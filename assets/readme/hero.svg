<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">RIPDPI — Android network-path diagnostics and optimization</title>
  <desc id="desc">A local Android network path is measured, diagnosed, and given the smallest working fix, with an optional encrypted relay when the direct path cannot be recovered.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="390" rx="28" fill="#121212"/>
  <path d="M56 80H1144M56 330H1144" stroke="#2A2A2A"/>

  <g transform="translate(64 64)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text fill="#A3A3A3" font-size="18" font-weight="700" letter-spacing="3">ANDROID / LOCAL-FIRST / NETWORK PATH</text>
    <text y="77" fill="#E8E8E8" font-size="72" font-weight="750" letter-spacing="-3">RIPDPI</text>
    <text y="117" fill="#E8E8E8" font-size="28" font-weight="600">Diagnose the path. Apply the lightest fix.</text>
    <text y="156" fill="#A3A3A3" font-size="21">On-device packet strategies, per-connection evidence,</text>
    <text y="184" fill="#A3A3A3" font-size="21">and optional encrypted relays you control.</text>

    <g transform="translate(0 220)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">
      <rect width="102" height="34" rx="17" fill="#173C35"/>
      <circle cx="21" cy="17" r="5" fill="#34D399"/>
      <text x="35" y="23" fill="#C8F8DF">LOCAL</text>
      <rect x="116" width="188" height="34" rx="17" fill="#102D45"/>
      <circle cx="137" cy="17" r="5" fill="#60A5FA"/>
      <text x="151" y="23" fill="#CDE8FF">EVIDENCE-LED</text>
      <rect x="318" width="228" height="34" rx="17" fill="#332913"/>
      <circle cx="339" cy="17" r="5" fill="#FBBF24"/>
      <text x="353" y="23" fill="#FFE6A3">NO ROOT REQUIRED</text>
    </g>
  </g>

  <g transform="translate(710 72)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text fill="#A3A3A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">THE DECISION LOOP</text>
    <path d="M18 94V266" fill="none" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 94V180" fill="none" stroke="url(#edge)" stroke-width="3" stroke-linecap="round"/>

    <g transform="translate(0 76)">
      <circle cx="18" cy="18" r="18" fill="#173C35" stroke="#34D399" stroke-width="2"/>
      <text x="12" y="24" fill="#C8F8DF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">1</text>
      <text x="54" y="11" fill="#E8E8E8" font-size="23" font-weight="700">Measure the direct path</text>
      <text x="54" y="37" fill="#A3A3A3" font-size="19">TCP · QUIC · DNS</text>
    </g>
    <g transform="translate(0 162)">
      <circle cx="18" cy="18" r="18" fill="#102D45" stroke="#60A5FA" stroke-width="2"/>
      <text x="12" y="24" fill="#CDE8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">2</text>
      <text x="54" y="11" fill="#E8E8E8" font-size="23" font-weight="700">Classify the failure</text>
      <text x="54" y="37" fill="#A3A3A3" font-size="19">per target, per network</text>
    </g>
    <g transform="translate(0 248)">
      <circle cx="18" cy="18" r="18" fill="#332913" stroke="#FBBF24" stroke-width="2"/>
      <text x="12" y="24" fill="#FFE6A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">3</text>
      <text x="54" y="11" fill="#E8E8E8" font-size="23" font-weight="700">Apply the lightest fix</text>
      <text x="54" y="37" fill="#A3A3A3" font-size="19">local strategy → optional relay</text>
    </g>
  </g>
</svg>
