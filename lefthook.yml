# lefthook.yml -- Fast pre-commit hooks for RIPDPI
# Install: brew install lefthook && lefthook install
# Skip:    LEFTHOOK=0 git commit ...
# Override: create .lefthook-local.yml (gitignored)

min_version: 1.11.0

pre-commit:
  parallel: true
  commands:
    kotlin-format:
      glob: "*.{kt,kts}"
      run: ktlint --format {staged_files}
      stage_fixed: true

    rust-format:
      glob: "*.rs"
      root: "native/rust/"
      run: cargo fmt --check

    no-secrets:
      run: |
        git diff --cached --diff-filter=ACM -z --name-only |
        grep -z -v '^native/rust/vendor/boring-sys/deps/' |
        xargs -0 git diff --cached -- |
        grep -E '^\+' |
        grep -Ev '^\+\+\+' |
        grep -Ei '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|(password|secret|token|api_key)\s*=\s*"[^"]{8,}")' |
        grep -Ev 'AKIAIOSFODNN7EXAMPLE|[Ff]ixture' &&
        { echo "error: potential secrets detected in staged changes"; exit 1; } ||
        true

    no-detekt-baseline:
      run: |
        if git diff --cached --diff-filter=ACM --name-only | grep -q 'detekt-baseline\.xml'; then
          echo "error: detekt-baseline.xml files are forbidden — fix violations in code instead"
          exit 1
        fi

    no-large-files:
      run: |
        large=""
        for f in $(git diff --cached --diff-filter=ACM --name-only); do
          case "$f" in */baseline-prof.txt | native/rust/vendor/boring-sys/deps/*) continue;; esac
          size=$(git cat-file -s ":$f" 2>/dev/null || echo 0)
          if [ "$size" -gt 524288 ]; then
            large="$large\n  $f ($(( size / 1024 ))KB)"
          fi
        done
        if [ -n "$large" ]; then
          echo "error: files exceed 512KB limit:$large"
          exit 1
        fi

    architecture-delta:
      glob: "*.{kt,rs,toml}"
      run: python3 scripts/ci/check_architecture_health.py --staged

    cargo-deny:
      glob: "{native/rust/Cargo*.toml,native/rust/deny.toml}"
      run: command -v cargo-deny >/dev/null || exit 0; cargo deny --locked --manifest-path native/rust/Cargo.toml check advisories bans licenses sources

    advisory-waivers:
      glob: "{native/rust/deny.toml,native/rust/advisory-waivers.toml,scripts/ci/check_rust_advisory_waivers.py,scripts/ci/test_rust_advisory_waivers.py}"
      run: python3 scripts/ci/check_rust_advisory_waivers.py && python3 -m unittest scripts.ci.test_rust_advisory_waivers

    rust-clippy:
      glob: "*.rs"
      root: "native/rust/"
      run: cargo clippy --locked --workspace --no-deps --all-targets -- -D warnings

    design-md:
      glob: "DESIGN.md"
      run: python3 scripts/ci/verify_design_md.py

    native-contracts:
      glob: "native/rust/**"
      run: python3 scripts/ci/check_native_architecture_contracts.py

    harness-link-audit:
      glob: ".claude/**"
      run: python3 scripts/ci/check_harness_links.py --report-only

    pinact-check:
      glob: ".github/workflows/*.yml"
      run: command -v pinact >/dev/null || exit 0; pinact run --check {staged_files}

    rules-drift-check:
      run: bash scripts/ci/check-rules-drift.sh

    harness-cargo-locked:
      run: python3 scripts/ci/check_harness_cargo_locked.py

    task-contracts:
      glob: "{.mdtaskrc,taskctl,docs/tasks/**,openspec/**,tools/tasking/**,scripts/tasks/**,.agents/skills/{mdtask*,sdd,openspec-*}/**,AGENTS.md}"
      run: ./taskctl validate

commit-msg:
  commands:
    conventional-commit:
      run: |
        msg=$(head -1 "{1}")
        if echo "$msg" | grep -Eq '^Merge '; then
          exit 0
        fi
        if ! echo "$msg" | grep -Eq '^(feat|fix|docs|refactor|chore|test|perf|ci|build|style|revert)(\(.+\))?(!)?: .{1,72}$'; then
          echo "error: commit message must follow Conventional Commits"
          echo "  format: type(scope): description  (max 72 chars)"
          echo "  types:  feat|fix|docs|refactor|chore|test|perf|ci|build|style|revert"
          echo "  got:    $msg"
          exit 1
        fi
