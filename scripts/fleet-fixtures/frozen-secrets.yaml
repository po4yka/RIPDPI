# Frozen secret-set for the ripdpi-vpn-deploy fleet-compat fixture regenerator.
#
# This file is the deliberately-synthetic SOPS payload fed to the sibling
# repo's scripts/emit-singbox.sh via the fake `sops` shim in
# scripts/refresh-fleet-fixtures.sh. NO production tokens ever appear here:
# values are fixed synthetic UUIDs, hex short IDs, byte-pattern AWG keys, and
# passwords with the `-fixture` marker;
# endpoint IPs are RFC-5737 documentation addresses. The deployer side
# (emit-singbox.sh) reads this through `sops --decrypt --output-type json`,
# so the shim converts this YAML to JSON verbatim.
#
# Shape matches ripdpi-vpn-deploy/secrets/prod.secrets.example.yaml.
# Keep it in sync if the deployer's secrets schema changes -- a schema drift
# is exactly what the golden-file suite is meant to catch.

xray:
  reality_public_key: "reality-public-key-fixture-000000000000000"
  reality_private_key: "reality-private-key-fixture-000000000000000"
  server_names:
    - "www.fixture-sni.example"
  xhttp_path: "/app-sync"
  clients:
    - name: laptop
      uuid: "00000000-0000-0000-0000-000000000001"
      short_id: "deadbeef00000001"
    - name: phone
      uuid: "00000000-0000-0000-0000-000000000002"
      short_id: "deadbeef00000002"
  cohorts: []

nginx_xhttp:
  server_name: "cdn.fixture-host.example"

hysteria:
  masquerade_url: "https://hy.fixture-host.example"
  server_name: "hy.fixture-host.example"
  salamander_enabled: true
  salamander_password: "salamander-password-fixture"
  clients:
    - name: laptop
      password: "hysteria2-password-fixture"
    - name: phone
      password: "hysteria2-password-fixture"

