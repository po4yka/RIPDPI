title: "RIPDPI UI/UX Audit"
subtitle: "Reachability, state coverage, and settings accessibility"
flow_title: "Current app user flow"

theme:
  primary: "#111111"
  accent: "#F2F2F2"
  text: "#111111"
  muted: "#6F6F6F"
  background: "#FFFFFF"

defaults:
  permission_preset: "granted"
  service_preset: "idle"
  data_preset: "settings_ready"
  settle_ms: 1500

pages:
  - id: onboarding
    title: "Onboarding"
    route: "onboarding"
    data_preset: "clean_home"
    expected_root: "onboarding-screen"
    required_elements: ["onboarding-continue"]
    state: "first-run"
    description: |
      First-run setup entry point with the primary continue action visible.

  - id: home_idle
    title: "Home"
    route: "home"
    flow_from: "onboarding"
    flow_label: "finish setup"
    expected_root: "home-screen"
    required_elements: ["home-mode-card-vpn", "home-mode-card-proxy", "home-mode-primary-vpn", "bottom-nav-config", "bottom-nav-diagnostics", "bottom-nav-settings"]
    state: "idle"
    description: |
      Primary status surface with per-mode connection cards and bottom navigation.

  - id: home_vpn_missing
    title: "Home Permission Banner"
    route: "home"
    flow_from: "home_idle"
    flow_label: "VPN permission missing"
    permission_preset: "vpn_missing"
    expected_root: "home-screen"
    required_elements: ["home-permission-issue-banner"]
    state: "permission repair"
    description: |
      Missing VPN permission state with a repair banner shown on the home status surface.

  - id: home_connected_proxy
    title: "Home Connected Proxy"
    route: "home"
    flow_from: "home_idle"
    flow_label: "proxy connected"
    service_preset: "connected_proxy"
    expected_root: "home-screen"
    required_elements: ["home-mode-card-proxy", "home-mode-primary-proxy"]
    state: "connected proxy"
    description: |
      Connected proxy state with the per-mode stop action and route context on the home surface.

  - id: home_connected_vpn
    title: "Home Connected VPN"
    route: "home"
    flow_from: "home_idle"
    flow_label: "VPN connected"
    service_preset: "connected_vpn"
    expected_root: "home-screen"
    required_elements: ["home-mode-card-vpn", "home-mode-primary-vpn"]
    state: "connected VPN"
    description: |
      Connected VPN state with tunnel status and the per-mode stop action visible.

  - id: config
    title: "Config"
    route: "config"
    flow_from: "home_idle"
    flow_label: "Config tab"
    expected_root: "config-screen"
    required_elements: ["bottom-nav-home", "bottom-nav-diagnostics", "bottom-nav-settings"]
    state: "preset selection"
    description: |
      Configuration hub for choosing and editing bypass modes.

  - id: local_bypass_config
    title: "Local Bypass Config"
    route: "config/local_bypass"
    flow_from: "config"
    flow_label: "local mode"
    expected_root: "config/local_bypass-screen"
    state: "local proxy"
    description: |
      Local bypass profile configuration state reached from the configuration hub.

  - id: vpn_config
    title: "VPN Config"
    route: "config/vpn"
    flow_from: "config"
    flow_label: "VPN mode"
    expected_root: "config/vpn-screen"
    state: "VPN profile"
    description: |
      VPN profile configuration state for tunnel setup.

  - id: mode_editor
    title: "Mode Editor"
    route: "mode_editor"
    flow_from: "config"
    flow_label: "edit current"
    expected_root: "mode_editor-screen"
    state: "edit mode"
    description: |
      Mode editor state with editable network parameters, validation surfaces, and save controls.

  - id: strategy_config
    title: "Strategy Config"
    route: "strategy_config"
    flow_from: "mode_editor"
    flow_label: "strategy"
    expected_root: "strategy_config-screen"
    state: "strategy settings"
    description: |
      Strategy configuration state with DPI bypass parameters and recovery controls.

  - id: strategy_import
    title: "Strategy Import"
    route: "strategy_import"
    flow_from: "strategy_config"
    flow_label: "import"
    expected_root: "strategy_import-screen"
    state: "import"
    description: |
      Strategy import state for bringing existing configuration into the app.

  - id: dns_settings
    title: "DNS Settings"
    route: "dns_settings"
    flow_from: "settings"
    flow_label: "DNS"
    expected_root: "dns_settings-screen"
    state: "resolver settings"
    description: |
      DNS settings state with resolver selection, custom provider inputs, and save controls.

  - id: advanced_settings_top
    title: "Advanced Settings"
    route: "advanced_settings"
    flow_from: "settings"
    flow_label: "advanced"
    expected_root: "advanced_settings-screen"
    required_elements: ["advanced-section-bypass-strategy"]
    state: "top"
    description: |
      Advanced settings top state with grouped advanced controls and section labels.

  - id: advanced_settings_activation
    title: "Activation Window"
    route: "advanced_settings"
    flow_from: "advanced_settings_top"
    flow_label: "scroll"
    scroll_to: "advanced-section-activation-window"
    expected_root: "advanced_settings-screen"
    required_elements: ["advanced-section-activation-window"]
    state: "scrolled"
    description: |
      Advanced settings scrolled state around the scheduled activation controls.

  - id: detection_settings
    title: "Detection Settings"
    route: "detection_settings"
    flow_from: "advanced_settings_top"
    flow_label: "detection"
    expected_root: "detection_settings-screen"
    state: "probe settings"
    description: |
      Detection settings state with scan-related resolver and routing preferences.

  - id: split_tunnel
    title: "Split Tunnel"
    route: "split_tunnel"
    flow_from: "advanced_settings_top"
    flow_label: "routing"
    expected_root: "split_tunnel-screen"
    state: "app routing"
    description: |
      Split tunnel state with included and excluded app routing controls.

  - id: domain_bypass_list
    title: "Domain Bypass List"
    route: "domain_bypass_list"
    flow_from: "advanced_settings_top"
    flow_label: "domains"
    expected_root: "domain_bypass_list-screen"
    state: "domain rules"
    description: |
      Domain bypass management state with list actions and domain-rule content.

  - id: diagnostics
    title: "Diagnostics"
    route: "diagnostics"
    flow_from: "home_idle"
    flow_label: "Diagnostics tab"
    data_preset: "diagnostics_demo"
    expected_root: "diagnostics-screen"
    required_elements: ["diagnostics-top-history-action"]
    state: "demo data"
    description: |
      Diagnostics state seeded with demo data, scan controls, recent reports, and history access.

  - id: scanner
    title: "Scanner"
    route: "scanner"
    flow_from: "diagnostics"
    flow_label: "run scan"
    data_preset: "diagnostics_demo"
    expected_root: "scanner-screen"
    state: "scan entry"
    description: |
      Scanner entry state with camera preview and import-from-image action.

  - id: detection_check
    title: "Detection Check"
    route: "detection_check"
    flow_from: "diagnostics"
    flow_label: "detection"
    data_preset: "diagnostics_demo"
    expected_root: "detection_check-screen"
    state: "analysis"
    description: |
      Detection check state with analysis output and status details.

  - id: blockcheck
    title: "Blockcheck"
    route: "blockcheck"
    flow_from: "diagnostics"
    flow_label: "blockcheck"
    data_preset: "diagnostics_demo"
    expected_root: "blockcheck-screen"
    state: "check"
    description: |
      Blockcheck state with test status, results, and retry actions.

  - id: history
    title: "History"
    route: "history"
    flow_from: "diagnostics"
    flow_label: "history"
    data_preset: "diagnostics_demo"
    expected_root: "history-screen"
    state: "seeded"
    description: |
      History state seeded with prior diagnostics and service events.

  - id: logs
    title: "Logs"
    route: "logs"
    flow_from: "diagnostics"
    flow_label: "logs"
    data_preset: "diagnostics_demo"
    expected_root: "logs-screen"
    required_elements: ["logs-save", "logs-clear"]
    state: "seeded"
    description: |
      Logs state with export, clear, filter, and log-content controls.

  - id: shared_diagnostic_result
    title: "Shared Diagnostic Result"
    route: "shared_diagnostic_result"
    flow_from: "diagnostics"
    flow_label: "share"
    data_preset: "diagnostics_report_demo"
    expected_root: "shared_diagnostic_result-screen"
    state: "report demo"
    description: |
      Shared diagnostic result state rendered as a standalone report.

  - id: pcap_capture_list
    title: "PCAP Captures"
    route: "pcap_capture_list"
    flow_from: "diagnostics"
    flow_label: "captures"
    data_preset: "diagnostics_demo"
    expected_root: "pcap_capture_list-screen"
    state: "capture list"
    description: |
      PCAP capture list state with capture entries or empty-state content.

  - id: settings
    title: "Settings"
    route: "settings"
    flow_from: "home_idle"
    flow_label: "Settings tab"
    expected_root: "settings-screen"
    required_elements: ["settings-dns-settings", "settings-advanced-settings", "settings-data-transparency", "settings-about"]
    state: "main"
    description: |
      Settings hub with secondary settings surfaces and navigation entries.

  - id: app_customization
    title: "App Customization"
    route: "app_customization"
    flow_from: "settings"
    flow_label: "appearance"
    expected_root: "app_customization-screen"
    state: "appearance"
    description: |
      App customization state with theme and visual preference controls.

  - id: data_transparency
    title: "Data Transparency"
    route: "data_transparency"
    flow_from: "settings"
    flow_label: "privacy"
    expected_root: "data_transparency-screen"
    state: "privacy"
    description: |
      Data transparency state with local-data handling and export information.

  - id: backup_restore
    title: "Backup And Restore"
    route: "backup_restore"
    flow_from: "settings"
    flow_label: "backup"
    expected_root: "backup_restore-screen"
    state: "backup"
    description: |
      Backup and restore state with import/export actions and related risk copy.

  - id: about
    title: "About"
    route: "about"
    flow_from: "settings"
    flow_label: "about"
    expected_root: "about-screen"
    state: "about"
    description: |
      About state with version, distribution, and support links.

  - id: biometric_prompt
    title: "Biometric Prompt"
    route: "biometric_prompt"
    flow_from: "settings"
    flow_label: "lock"
    data_preset: "biometric_locked_with_pin"
    expected_root: "biometric_prompt-screen"
    state: "locked with PIN"
    description: |
      Biometric lock state with PIN fallback content.

  - id: routes
    title: "Routes"
    route: "routes"
    flow_from: "config"
    flow_label: "routes"
    expected_root: "routes-screen"
    state: "routing"
    description: |
      Routes state with route management and rule editing entry points.

  - id: rule_editor
    title: "Rule Editor"
    route: "rule_editor"
    flow_from: "routes"
    flow_label: "edit rule"
    expected_root: "rule_editor-screen"
    state: "rule edit"
    description: |
      Rule editor state with match fields, validation, and save controls.

  - id: profile_variants
    title: "Profile Variants"
    route: "profile_variants"
    flow_from: "config"
    flow_label: "profiles"
    expected_root: "profile_variants-screen"
    state: "variants"
    description: |
      Profile variants state with profile comparison and selection content.

  - id: anytls_profile
    title: "AnyTLS Profile"
    route: "profile/anytls"
    flow_from: "profile_variants"
    flow_label: "AnyTLS"
    expected_root: "profile/anytls-screen"
    state: "relay profile"
    description: |
      AnyTLS profile settings state with transport fields and validation content.

  - id: amneziawg_profile
    title: "AmneziaWG Profile"
    route: "profile/amneziawg"
    flow_from: "profile_variants"
    flow_label: "AmneziaWG"
    expected_root: "profile/amneziawg-screen"
    state: "VPN profile"
    description: |
      AmneziaWG profile settings state with endpoint, key, and obfuscation fields.

  - id: xray_import
    title: "Xray Import"
    route: "xray/import"
    flow_from: "config"
    flow_label: "Xray"
    expected_root: "xray/import-screen"
    state: "import"
    description: |
      Xray import state with paste, parse feedback, and confirmation content.
