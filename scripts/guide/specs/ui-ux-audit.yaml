title: "RIPDPI UI/UX Audit"
subtitle: "Reachability, state coverage, and settings accessibility"
flow_title: "Current app user flow"

theme:
  primary: "#1B5E20"
  accent: "#E65100"

defaults:
  permission_preset: "granted"
  service_preset: "idle"
  data_preset: "settings_ready"
  settle_ms: 1500

pages:
  - id: onboarding
    title: "Onboarding"
    route: "onboarding"
    data_preset: "clean_home"
    expected_root: "onboarding-screen"
    required_elements: ["onboarding-continue"]
    state: "first-run"
    description: |
      First-run setup entry point with the primary continue action visible.

  - id: home_idle
    title: "Home"
    route: "home"
    flow_from: "onboarding"
    flow_label: "finish setup"
    expected_root: "home-screen"
    required_elements: ["home-connection-button", "home-connection-route-label", "bottom-nav-config", "bottom-nav-diagnostics", "bottom-nav-settings"]
    state: "idle"
    description: |
      Primary status surface with the connection actuator, selected route label, and bottom navigation.

  - id: home_vpn_missing
    title: "Home Permission Banner"
    route: "home"
    flow_from: "home_idle"
    flow_label: "VPN permission missing"
    permission_preset: "vpn_missing"
    expected_root: "home-screen"
    required_elements: ["home-permission-issue-banner"]
    state: "permission repair"
    description: |
      Missing VPN permission should produce an actionable repair banner without hiding the home status surface.

  - id: home_connected_proxy
    title: "Home Connected Proxy"
    route: "home"
    flow_from: "home_idle"
    flow_label: "proxy connected"
    service_preset: "connected_proxy"
    expected_root: "home-screen"
    required_elements: ["home-connection-button", "home-connection-route-label"]
    state: "connected proxy"
    description: |
      Connected proxy state should keep the stop action and route context easy to find.

  - id: home_connected_vpn
    title: "Home Connected VPN"
    route: "home"
    flow_from: "home_idle"
    flow_label: "VPN connected"
    service_preset: "connected_vpn"
    expected_root: "home-screen"
    required_elements: ["home-connection-button", "home-connection-route-label"]
    state: "connected VPN"
    description: |
      Connected VPN state should clearly communicate tunnel status and keep the stop action reachable.

  - id: config
    title: "Config"
    route: "config"
    flow_from: "home_idle"
    flow_label: "Config tab"
    expected_root: "config-screen"
    required_elements: ["bottom-nav-home", "bottom-nav-diagnostics", "bottom-nav-settings"]
    state: "preset selection"
    description: |
      Configuration hub for choosing and editing bypass modes.

  - id: local_bypass_config
    title: "Local Bypass Config"
    route: "config/local_bypass"
    flow_from: "config"
    flow_label: "local mode"
    expected_root: "config/local_bypass-screen"
    state: "local proxy"
    description: |
      Local bypass profile controls should remain reachable from the configuration hub.

  - id: vpn_config
    title: "VPN Config"
    route: "config/vpn"
    flow_from: "config"
    flow_label: "VPN mode"
    expected_root: "config/vpn-screen"
    state: "VPN profile"
    description: |
      VPN profile controls should expose the settings needed before starting a tunnel.

  - id: mode_editor
    title: "Mode Editor"
    route: "mode_editor"
    flow_from: "config"
    flow_label: "edit current"
    expected_root: "mode_editor-screen"
    state: "edit mode"
    description: |
      Mode editor should expose editable network parameters, validation, and save affordances.

  - id: strategy_config
    title: "Strategy Config"
    route: "strategy_config"
    flow_from: "mode_editor"
    flow_label: "strategy"
    expected_root: "strategy_config-screen"
    state: "strategy settings"
    description: |
      Strategy configuration should make DPI bypass parameters understandable and recoverable.

  - id: strategy_import
    title: "Strategy Import"
    route: "strategy_import"
    flow_from: "strategy_config"
    flow_label: "import"
    expected_root: "strategy_import-screen"
    state: "import"
    description: |
      Strategy import should provide a clear path for bringing existing configuration into the app.

  - id: dns_settings
    title: "DNS Settings"
    route: "dns_settings"
    flow_from: "settings"
    flow_label: "DNS"
    expected_root: "dns_settings-screen"
    state: "resolver settings"
    description: |
      DNS settings should expose resolver selection and custom provider inputs without burying save controls.

  - id: advanced_settings_top
    title: "Advanced Settings"
    route: "advanced_settings"
    flow_from: "settings"
    flow_label: "advanced"
    expected_root: "advanced_settings-screen"
    required_elements: ["advanced-section-desync"]
    state: "top"
    description: |
      Advanced settings should group risky controls clearly and keep section labels scannable.

  - id: advanced_settings_activation
    title: "Activation Window"
    route: "advanced_settings"
    flow_from: "advanced_settings_top"
    flow_label: "scroll"
    scroll_to: "advanced-section-activation-window"
    expected_root: "advanced_settings-screen"
    required_elements: ["advanced-section-activation-window"]
    state: "scrolled"
    description: |
      Scheduled activation controls should be reachable by scrolling and should expose editable from/to controls.

  - id: detection_settings
    title: "Detection Settings"
    route: "detection_settings"
    flow_from: "advanced_settings_top"
    flow_label: "detection"
    expected_root: "detection_settings-screen"
    state: "probe settings"
    description: |
      Detection settings should expose scan-related resolver and routing preferences.

  - id: split_tunnel
    title: "Split Tunnel"
    route: "split_tunnel"
    flow_from: "advanced_settings_top"
    flow_label: "routing"
    expected_root: "split_tunnel-screen"
    state: "app routing"
    description: |
      Split tunnel controls should make included and excluded app routing understandable.

  - id: domain_bypass_list
    title: "Domain Bypass List"
    route: "domain_bypass_list"
    flow_from: "advanced_settings_top"
    flow_label: "domains"
    expected_root: "domain_bypass_list-screen"
    state: "domain rules"
    description: |
      Domain bypass management should expose list actions and empty states clearly.

  - id: diagnostics
    title: "Diagnostics"
    route: "diagnostics"
    flow_from: "home_idle"
    flow_label: "Diagnostics tab"
    data_preset: "diagnostics_demo"
    expected_root: "diagnostics-screen"
    required_elements: ["diagnostics-top-history-action"]
    state: "demo data"
    description: |
      Diagnostics should expose scan controls, recent reports, and history access without requiring a live network run.

  - id: scanner
    title: "Scanner"
    route: "scanner"
    flow_from: "diagnostics"
    flow_label: "run scan"
    data_preset: "diagnostics_demo"
    expected_root: "scanner-screen"
    state: "scan entry"
    description: |
      Scanner entry should communicate what will run and how to cancel or inspect results.

  - id: detection_check
    title: "Detection Check"
    route: "detection_check"
    flow_from: "diagnostics"
    flow_label: "detection"
    data_preset: "diagnostics_demo"
    expected_root: "detection_check-screen"
    state: "analysis"
    description: |
      Detection check should surface verdicts and uncertainty without overstating confidence.

  - id: blockcheck
    title: "Blockcheck"
    route: "blockcheck"
    flow_from: "diagnostics"
    flow_label: "blockcheck"
    data_preset: "diagnostics_demo"
    expected_root: "blockcheck-screen"
    state: "check"
    description: |
      Blockcheck should make test state, results, and retry actions visible.

  - id: history
    title: "History"
    route: "history"
    flow_from: "diagnostics"
    flow_label: "history"
    data_preset: "diagnostics_demo"
    expected_root: "history-screen"
    state: "seeded"
    description: |
      History should expose search and filters for prior diagnostics and service events.

  - id: logs
    title: "Logs"
    route: "logs"
    flow_from: "diagnostics"
    flow_label: "logs"
    data_preset: "diagnostics_demo"
    expected_root: "logs-screen"
    required_elements: ["logs-save", "logs-clear"]
    state: "seeded"
    description: |
      Logs should make export, clear, filter, and empty states accessible.

  - id: shared_diagnostic_result
    title: "Shared Diagnostic Result"
    route: "shared_diagnostic_result"
    flow_from: "diagnostics"
    flow_label: "share"
    data_preset: "diagnostics_report_demo"
    expected_root: "shared_diagnostic_result-screen"
    state: "report demo"
    description: |
      Shared diagnostic result should be readable as a standalone report state.

  - id: pcap_capture_list
    title: "PCAP Captures"
    route: "pcap_capture_list"
    flow_from: "diagnostics"
    flow_label: "captures"
    data_preset: "diagnostics_demo"
    expected_root: "pcap_capture_list-screen"
    state: "capture list"
    description: |
      PCAP capture list should show available captures and the empty state without confusing diagnostics history.

  - id: settings
    title: "Settings"
    route: "settings"
    flow_from: "home_idle"
    flow_label: "Settings tab"
    expected_root: "settings-screen"
    required_elements: ["settings-dns-settings", "settings-advanced-settings", "settings-data-transparency", "settings-about"]
    state: "main"
    description: |
      Settings should make every secondary settings surface discoverable and tappable.

  - id: app_customization
    title: "App Customization"
    route: "app_customization"
    flow_from: "settings"
    flow_label: "appearance"
    expected_root: "app_customization-screen"
    state: "appearance"
    description: |
      App customization should expose theme and visual preference controls without hidden dependencies.

  - id: data_transparency
    title: "Data Transparency"
    route: "data_transparency"
    flow_from: "settings"
    flow_label: "privacy"
    expected_root: "data_transparency-screen"
    state: "privacy"
    description: |
      Data transparency should explain local-only data handling and export implications in a scannable way.

  - id: backup_restore
    title: "Backup And Restore"
    route: "backup_restore"
    flow_from: "settings"
    flow_label: "backup"
    expected_root: "backup_restore-screen"
    state: "backup"
    description: |
      Backup and restore should make import/export actions and risk copy easy to understand.

  - id: about
    title: "About"
    route: "about"
    flow_from: "settings"
    flow_label: "about"
    expected_root: "about-screen"
    state: "about"
    description: |
      About should expose version, distribution, and support links.

  - id: biometric_prompt
    title: "Biometric Prompt"
    route: "biometric_prompt"
    flow_from: "settings"
    flow_label: "lock"
    data_preset: "biometric_locked_with_pin"
    expected_root: "biometric_prompt-screen"
    state: "locked with PIN"
    description: |
      Biometric lock should offer a clear fallback path when biometric auth is unavailable.

  - id: routes
    title: "Routes"
    route: "routes"
    flow_from: "config"
    flow_label: "routes"
    expected_root: "routes-screen"
    state: "routing"
    description: |
      Routes should expose route management and rule editing entry points.

  - id: rule_editor
    title: "Rule Editor"
    route: "rule_editor"
    flow_from: "routes"
    flow_label: "edit rule"
    expected_root: "rule_editor-screen"
    state: "rule edit"
    description: |
      Rule editor should make match fields, validation, and save state clear.

  - id: profile_variants
    title: "Profile Variants"
    route: "profile_variants"
    flow_from: "config"
    flow_label: "profiles"
    expected_root: "profile_variants-screen"
    state: "variants"
    description: |
      Profile variants should support comparison and selection without losing the active profile context.

  - id: anytls_profile
    title: "AnyTLS Profile"
    route: "profile/anytls"
    flow_from: "profile_variants"
    flow_label: "AnyTLS"
    expected_root: "profile/anytls-screen"
    state: "relay profile"
    description: |
      AnyTLS profile settings should expose required transport fields and validation.

  - id: amneziawg_profile
    title: "AmneziaWG Profile"
    route: "profile/amneziawg"
    flow_from: "profile_variants"
    flow_label: "AmneziaWG"
    expected_root: "profile/amneziawg-screen"
    state: "VPN profile"
    description: |
      AmneziaWG profile settings should expose endpoint, keys, and obfuscation details clearly.

  - id: xray_import
    title: "Xray Import"
    route: "xray/import"
    flow_from: "config"
    flow_label: "Xray"
    expected_root: "xray/import-screen"
    state: "import"
    description: |
      Xray import should present paste/parse feedback and confirmation paths.
