title: "RIPDPI UI/UX Audit"
subtitle: "Reachability, state coverage, and settings accessibility"
flow_title: "Current app user flow"

theme:
  primary: "#111111"
  accent: "#F2F2F2"
  text: "#111111"
  muted: "#6F6F6F"
  background: "#FFFFFF"

defaults:
  permission_preset: "granted"
  service_preset: "idle"
  data_preset: "settings_ready"
  settle_ms: 1500

route_contract:
  exclusions:
    - route: "pcap_viewer"
      prerequisite: "A capture must be selected from PCAP Captures."
      reason: "The viewer reads capture selection from runtime state and has no stable empty audit fixture."
    - route: "owned_stack_browser"
      prerequisite: "A trusted non-empty owned-stack URL must be supplied."
      reason: "The embedded browser cannot render a meaningful or safe audit state without a validated URL."
    - route: "import/profile_confirm"
      prerequisite: "A profile import token must be staged by an import flow."
      reason: "The confirmation screen consumes transient staged import state rather than a standalone fixture."
    - route: "import/subscription_confirm"
      prerequisite: "A subscription import token must be staged by an import flow."
      reason: "The confirmation screen consumes transient staged import state rather than a standalone fixture."
    - route: "support/settings"
      prerequisite: "A validated support-package JSON payload must be supplied."
      reason: "The route is a payload-driven support surface and rejects an absent or malformed package."
    - route: "profile/share"
      prerequisite: "An existing profile identifier must be supplied."
      reason: "The share screen is only meaningful for a profile already persisted in app data."
    - route: "shared_diagnostic_result"
      prerequisite: "A valid encoded diagnostic-share fragment must be supplied."
      reason: "The standalone renderer shows an error for the empty default route and needs a real shared report payload."

flow_sections:
  - title: "Start, Home, and Config"
    subtitle: "Onboarding, home states, configuration entry points, and strategy setup."
    pages:
      - onboarding
      - home_idle
      - home_vpn_missing
      - home_connected_proxy
      - home_connected_vpn
      - config
      - local_bypass_config
      - vpn_config
      - mode_editor
      - strategy_config
      - routes
      - rule_editor
  - title: "Diagnostics"
    subtitle: "Diagnostics hub, scans, history, logs, and packet captures."
    pages:
      - diagnostics
      - connection_health
      - strategy_tuner
      - scanner
      - detection_check
      - blockcheck
      - history
      - replay_history
      - logs
      - pcap_capture_list
  - title: "Settings"
    subtitle: "Settings hub, advanced preferences, privacy, customization, backup, and providers."
    pages:
      - settings
      - dns_settings
      - advanced_settings_top
      - advanced_settings_activation
      - detection_settings
      - split_tunnel
      - domain_bypass_list
      - remembered_networks
      - root_mode_strategies
      - asset_provider
      - subscription_failover
      - subscription_status
      - app_customization
      - data_transparency
      - backup_restore
      - about
      - biometric_prompt
  - title: "Profiles and Imports"
    subtitle: "Standalone profile and import surfaces available through validated launch requests."
    pages:
      - anytls_profile
      - amneziawg_profile
      - mieru_profile
      - ssh_profile
      - xray_import

pages:
  - id: onboarding
    title: "Onboarding"
    route: "onboarding"
    data_preset: "clean_home"
    expected_root: "onboarding-screen"
    required_elements: ["onboarding-continue"]
    state: "first-run"
    description: |
      First-run setup entry point with the primary continue action visible.

  - id: home_idle
    title: "Home"
    route: "home"
    flow_from: "onboarding"
    flow_label: "finish setup"
    expected_root: "home-screen"
    required_elements: ["home-mode-card-local-dpi-bypass", "home-mode-card-remote-vpn", "home-mode-primary-local-dpi-bypass", "bottom-nav-config", "bottom-nav-diagnostics", "bottom-nav-settings"]
    state: "idle"
    description: |
      Primary status surface with per-mode connection cards and bottom navigation.

  - id: home_vpn_missing
    title: "Home Setup Health"
    route: "home"
    flow_from: "home_idle"
    flow_label: "VPN setup incomplete"
    permission_preset: "vpn_missing"
    expected_root: "home-screen"
    required_elements: ["home-setup-health-row"]
    state: "setup health"
    description: |
      Home status surface with the VPN setup issue represented in the setup health row.

  - id: home_connected_proxy
    title: "Home Connected Proxy"
    route: "home"
    flow_from: "home_idle"
    flow_label: "proxy connected"
    service_preset: "connected_proxy"
    expected_root: "home-screen"
    required_elements: ["home-mode-card-local-dpi-bypass", "home-mode-primary-local-dpi-bypass"]
    state: "connected proxy"
    description: |
      Connected proxy state with the per-mode stop action and route context on the home surface.

  - id: home_connected_vpn
    title: "Home Connected VPN"
    route: "home"
    flow_from: "home_idle"
    flow_label: "VPN connected"
    service_preset: "connected_vpn"
    expected_root: "home-screen"
    required_elements: ["home-mode-card-remote-vpn", "home-mode-primary-remote-vpn"]
    state: "connected VPN"
    description: |
      Connected VPN state with tunnel status and the per-mode stop action visible.

  - id: config
    title: "Config"
    route: "config"
    flow_from: "home_idle"
    flow_label: "Config tab"
    expected_root: "config-screen"
    required_elements:
      - "bottom-nav-home"
      - "bottom-nav-diagnostics"
      - "bottom-nav-settings"
      - "config-section-navigation"
      - "config-traffic-endpoint-selection"
      - "config-mode-section-local-bypass"
      - "config-mode-section-vpn"
      - "config-mode-vpn"
      - "config-mode-proxy"
    state: "preset selection"
    description: |
      Configuration hub for choosing and editing bypass modes.

  - id: local_bypass_config
    title: "Local Bypass Config"
    route: "config/local_bypass"
    flow_from: "config"
    flow_label: "local mode"
    expected_root: "config/local_bypass-screen"
    state: "local proxy"
    description: |
      Local bypass profile configuration state reached from the configuration hub.

  - id: vpn_config
    title: "VPN Config"
    route: "config/vpn"
    flow_from: "config"
    flow_label: "VPN mode"
    expected_root: "config/vpn-screen"
    state: "VPN profile"
    description: |
      VPN profile configuration state for tunnel setup.

  - id: mode_editor
    title: "Mode Editor"
    route: "mode_editor"
    flow_from: "config"
    flow_label: "edit current"
    expected_root: "mode_editor-screen"
    state: "edit mode"
    description: |
      Mode editor state with editable network parameters, validation surfaces, and save controls.

  - id: strategy_config
    title: "Strategy Config"
    route: "strategy_config"
