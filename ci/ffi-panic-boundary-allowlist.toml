# FFI Panic-Boundary Allowlist
# ============================
# Each entry grandfathers an `extern "C"` / `extern "system"` /
# `extern "C-unwind"` / `extern "system-unwind"` function whose body does
# NOT contain `ffi_boundary(` or `catch_unwind(`. The policy in
# `docs/rust-soundness-policy.md` ("FFI panic-unwind containment") requires
# every such function to be either:
#
#   1. Wrapped with `android_support::ffi_boundary(...)` (preferred), or
#   2. Wrapped with `std::panic::catch_unwind(...)`, or
#   3. Allowlisted here with a `reason` field that proves the body
#      cannot panic (atomic store only, literal-value return, stub under
#      cfg).
#
# Required fields per entry:
#   file          Path relative to repo root.
#   function      Exact identifier of the extern fn definition.
#   reason        Short human-readable proof the body cannot panic.
#   owner         Crate/team responsible for keeping the entry sound.
#   review_date   ISO date for the next mandatory re-review.
#
# When the guard fails, the correct fix order is:
#   1. Wrap the body with `ffi_boundary` (5-line change).
#   2. If the body genuinely cannot panic, add an entry here.
# Never lower the lint or skip the scanner to suppress findings.

[[entries]]
file = "native/rust/crates/ripdpi-root-helper/src/main.rs"
function = "signal_handler"
reason = """\
Body is a single `RUNNING.store(false, Ordering::SeqCst)` -- AtomicBool::store \
is a single relaxed/sequentially-consistent machine instruction and cannot \
panic. The function is registered as a POSIX signal handler via `libc::signal`; \
panicking in a signal handler is UB on its own (async-signal-unsafe), so a \
boundary would not save us. The discipline is to keep the body to async- \
signal-safe operations only.\
"""
owner = "infra"
review_date = "2026-11-17"

[[entries]]
file = "native/rust/crates/ripdpi-runtime-platform/src/process.rs"
function = "handle_shutdown_signal"
reason = """\
Body is one `SHUTDOWN_REQUESTED.store(true, Ordering::Release)`. AtomicBool::store \
cannot panic or allocate. This is a POSIX signal handler installed through \
`nix::sys::signal::signal`; the handler must remain async-signal-safe, so \
catch_unwind/ffi_boundary is not valid in this context.\
"""
owner = "runtime-platform"
review_date = "2026-11-17"

