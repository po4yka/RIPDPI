preconditions = "Pointer was produced by exactly one `Box::into_raw` call in `install_reality_client_hello_hook` (or in test setup), has not been freed since, and is reachable only through the guard (or local test scope). Module-level contract: callers must drop the guard before the SSL object so no callback invocation can fire after Drop runs"
enforcement = "Move-only `RealityHookGuard` (no `Copy`/`Clone`; `unsafe impl Send` opts in only `Send`, not `Sync`). The `Drop` impl nulls `state_ptr` after `Box::from_raw(...)` so a hypothetical second drop on the same guard would early-return. The test-mode `Box::from_raw` (line 282) is bracketed by the test that leaked the Box four lines earlier — single owner, single reclamation"
owner = "vless"
review_date = "2026-11-15"

[[entries]]
file = "native/rust/crates/ripdpi-vless/src/reality_hook.rs"
pattern = "unsafe impl Send/Sync"
