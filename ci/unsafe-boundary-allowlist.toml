# ---------------------------------------------------------------------------
# `UnsafeCell::get` derefs that materialize `&mut [u8]` from a pointer.
# All four occurrences live in `bufpool.rs` (the only producer of
# pointer-backed `&mut T` in the workspace per the issue-#7 audit) and
# share one exclusivity proof:
#   * `BufferHandle` is move-only (no Copy/Clone) and constructed only by
#     `RegisteredBufferPool::acquire`, which pops a unique index from a
#     `Mutex<Vec<u16>>` free list.
#   * `as_mut_buf` and `DerefMut::deref_mut` take `&mut self`, so the
#     borrow checker rules out aliased mutable access for a single owner.
#   * The free list is restocked only by `Drop`/`PendingBuffer::complete`,
#     and `release_by_index` is `pub(crate)` — outside the crate the only
#     legitimate release path is dropping a handle.
# Runtime regressions live in `bufpool::tests` (drop-and-reuse,
# capacity-exhaustion, into-pending lifecycle, available-count balance);
# the compile-fail half (`!Copy + !Clone`, `&mut self`-anchored borrow)
# is enforced by the type system per `docs/rust-soundness-policy.md`
# § "Compile-fail enforcement".
# ---------------------------------------------------------------------------
[[entries]]
file = "native/rust/crates/ripdpi-io-uring/src/bufpool.rs"
pattern = "UnsafeCell::get"
reason = "Produce `&mut [u8]` / `&[u8]` views into a registered io_uring buffer through the `BufferHandle` exclusivity protocol"
preconditions = "At most one `BufferHandle` exists per `buffers[index]` at any moment (free-list invariant); `&mut self` on `as_mut_buf`/`DerefMut` rules out aliased mutable access for a single owner; cross-thread happens-before is supplied by the `Mutex<Vec<u16>>` free list"
enforcement = "Move-only `BufferHandle` + `Mutex`-guarded free list + `&mut self`-anchored borrows + RAII Drop that returns the index exactly once; SAFETY comments at lines 53-54, 145-148, 173-174, 184 name the invariant; runtime regressions in `bufpool::tests`"
owner = "io-uring"
review_date = "2026-11-15"

