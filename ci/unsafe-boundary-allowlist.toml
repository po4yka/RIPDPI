# `unsafe fn from_ptr` constructor (caller asserts the alloc/free dual),
# a `pub fn as_ptr` borrow accessor, and a `pub fn take` consume-without-
# free escape hatch. The wrapper's Drop calls the typed `FreeFunction::free`
# exactly once, and a panic-unwind regression test in the same file proves
# the cleanup fires even on unwind.
# ---------------------------------------------------------------------------
[[entries]]
file = "native/rust/crates/soundness-canaries/src/lib.rs"
pattern = "raw pointer in public fn"
reason = "Three APIs of the generic RAII handle wrapper: `unsafe fn from_ptr(ptr: *mut T) -> Option<Self>` (constructor), `fn as_ptr(&self) -> *mut T` (borrow accessor), `fn take(self) -> *mut T` (consume-without-free)"
preconditions = "`from_ptr` is already `unsafe fn` and documents the `F::free` dual contract in its `# Safety` section; `as_ptr` returns the pointer for read-only inspection (doc-comment explicitly forbids passing it to `F::free`); `take` consumes the wrapper via `self`, returning the pointer and `mem::forget`-ing the wrapper so the caller is responsible for freeing"
enforcement = "Move-only `ScopedHandle<T, F>` (no Copy/Clone derives or impls); Drop calls `F::free` exactly once via the `FreeFunction` trait's `unsafe fn free`; `take` uses `mem::forget(self)` to suppress that Drop. The four unit tests in the same module (free-exactly-once, take-suppresses-free, null-rejected, panic-unwind-still-frees) lock in the discipline at runtime"
owner = "soundness-canaries"
review_date = "2026-11-15"

