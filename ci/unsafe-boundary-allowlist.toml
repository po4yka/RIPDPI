# Unsafe-Boundary Allowlist
# =========================
# Each entry grandfathers an existing (file, pattern) pair detected by
# `scripts/ci/check_unsafe_boundaries.py`. The allowlist exists so that the
# baseline does not block builds, but the policy in
# `docs/rust-soundness-policy.md` forbids adding *new* entries casually:
# every new entry must include real preconditions and a real enforcement
# story, and is expected to be reviewed periodically against its
# `review_date`.
#
# Required fields per entry:
#   file           Path relative to repo root.
#   pattern        Exact key reported by the scan script.
#   reason         Short human-readable summary.
#   preconditions  Concrete invariants the caller must uphold.
#   enforcement    How those invariants are guaranteed (type, RAII,
#                  module visibility, runtime check, or human review).
#   owner          Crate/team responsible for keeping the entry sound.
#   review_date    ISO date for the next mandatory re-review.
#
# When you see a guard failure, the correct fix order is:
#   1. Restructure the API to remove the boundary entirely
#      (newtype + private ctor, RAII, BorrowedFd/OwnedFd, typestate, ...).
#   2. If the unsafe contract is inherent, make the function `unsafe fn`
#      with a `# Safety` section and propagate it to callers.
#   3. Only if neither is possible, add an entry here with a SPECIFIC
#      justification — never with a TODO.
#
# Additional rule for the `Option<NonNull<T>>` and `&mut Option<NonNull<T>>`
# patterns: these are flagged because `Option<NonNull<T>>` is `Copy` and
# cannot encode ownership. A valid allowlist entry MUST state in its
# `reason` and `enforcement` fields:
#   - whether the pointer is owning or non-owning,
#   - who owns the underlying allocation,
#   - how liveness is guaranteed for every dereference,
#   - why `Copy` duplication is harmless in this case,
#   - whether the pointer ever reaches `destroy` / `free` / `unregister`
#     (and if so, what makes that path single-shot).
# In almost every case the correct fix is a private move-only
# `OwnerHandle<T>` newtype wrapping `NonNull<T>` with no `Copy`/`Clone`,
# so that `Option<OwnerHandle<T>>` replaces `Option<NonNull<T>>`. See
# docs/rust-soundness-policy.md § "Option<NonNull<T>> ownership tokens".
#
# Additional rule for `debug_assert near unsafe`: the proximity heuristic
# flags `debug_assert!` / `debug_assert_eq!` / `debug_assert_ne!` placed
# within ±10 source lines of an `unsafe` keyword. `debug_assert!` is a
# no-op in release builds; allowlisting an occurrence MUST state:
#   - which invariant the assertion documents,
#   - what actually enforces the invariant in release builds
#     (release-mode `assert!`, type design, RAII, FFI caller contract),
#   - why release-mode failure of the assertion cannot reach UB,
#   - the symbol (function/method) whose body contains the assertion.
# The default fix is to make the safety check a release-mode guard
# (`assert!`, `Result`, type-level encoding) and keep `debug_assert!`
# only for diagnostic checks that cannot promote to UB. See
# docs/rust-soundness-policy.md § "`debug_assert!` as memory-safety guard".
#
# Additional rule for `derive Clone on owner-named type`: a struct/enum
# whose name ends in `Handle`/`Owner`/`Guard`/`Token`/`Resource`/
# `Registration`/`Slot` advertising `#[derive(Clone)]` is flagged. The
# audit policy is that Clone on an ownership-named type MUST mean
# either "independent safe duplicate" (Copy-trivial fields only) or
# "refcounted shared owner" (`Arc<T>` / `Rc<T>` as the sole
# resource-bearing field). A valid allowlist entry's `enforcement`
# field MUST state which semantics the type uses, the specific field
# that bears the resource, and why Clone does not duplicate any
# underlying allocation, file descriptor, registration, or exclusive
# resource. See docs/rust-soundness-policy.md § "`Clone` on
# owner-named types".
#
# Additional rule for `manual Arc/Rc refcount` and
# `manual atomic refcount field`: shared ownership must use std's
# `Arc<T>` / `Rc<T>` / `Weak<T>` directly; manual lifecycle
# manipulation (`into_raw`/`from_raw`/`increment_strong_count`/
# `decrement_strong_count`) or a hand-rolled `AtomicUsize` counter
# field named `refs`/`refcount`/`ref_count`/`strong`/`weak` is
# almost always re-inventing reference counting unsoundly. A valid
# allowlist entry's `enforcement` field MUST state the five-model
# template from docs/rust-soundness-policy.md § "Use `Arc<T>` /
# `Rc<T>` / `Weak<T>`, not manual refcounting":
#   - ownership model (which type owns, non-`Copy` handle shape),
#   - atomic ordering proof (Relaxed clone, Release drop, Acquire
#     last-drop fence — with the happens-before chain stated),
#   - overflow policy (must abort/panic before wrap),
#   - reclamation policy (what runs at refcount zero and how it
#     synchronises with the last Release),
#   - owner accountable for periodic re-review.
# Required regression tests: clone/drop balance (sequential and
# multi-threaded), reentrancy proof, compile-fail `!Copy + !Clone`,
# Miri run on a single-threaded clone/drop sequence.
#
# Additional rule for `ownership flag near drop/unsafe` and
# `Cell<bool>`: a boolean lifecycle/ownership flag (`registered`,
# `is_alive`, `destroyed`, `initialized`, `disowned`, `owned_by_*`,
# `freed`) located within ±50 source lines of an `impl Drop` or
# `unsafe` keyword is flagged. The audit policy is that ownership
# and liveness must be encoded as types (move-only handles, RAII
# guards, typestate, validated state machines), not as flags
# alongside comments. A valid allowlist entry MUST state:
#   - whether the flag is diagnostic only or load-bearing for safety,
#   - what actually encodes ownership/liveness (move-only struct,
#     private constructor, type-state, refcount, mutex, etc.),
#   - why safe code cannot duplicate or forge the flag,
#   - what regressions exist (compile-fail `!Copy + !Clone` blocks,
#     runtime tests for sequential lifecycle, conditional cleanup,
#     `mem::forget` leak behaviour).
# See docs/rust-soundness-policy.md § "Ownership must be types,
# not flags".
#
# Additional rule for `UnsafeCell::get`: the scanner flags the
# `*cell.get()` deref shape, which materializes `&mut T` / `&T` from
# `*mut T` and bypasses Rust's borrow check entirely. A valid
# allowlist entry MUST state the three-model template from
# docs/rust-soundness-policy.md § "`UnsafeCell<T>` discipline":
#   - aliasing model — what makes simultaneous `&T`/`&mut T` impossible
#     (move-only handle + free list, Mutex/RwLock, type-state, `&mut self`),
#   - synchronisation model — what supplies the cross-thread
#     happens-before edge (mutex unlock/lock, atomic Release/Acquire,
#     channel send/receive, "single-threaded only"),
#   - reentrancy behaviour — what prevents a nested deref from
#     producing aliasing UB (no user callbacks while borrow live,
#     RefCell runtime panic, or restructure to consume the borrow),
#   - which symbol contains the deref and which type owns the cell,
#   - whether the resulting reference's lifetime is tied to a real owner.

# ---------------------------------------------------------------------------
# JNI export entry points: `extern "system" fn` is required by the JVM ABI for
# Java_<Class>_<method> symbols. The body in every case is the same shape:
#   pub extern "system" fn Java_<...>(env: EnvUnowned<'_>, ...) -> ... {
#       match env.with_env(|env| { /* safe work */ }).into_outcome() { ... }
#   }
# Soundness is delegated to `jni::EnvUnowned::with_env` which owns the
# JNIEnv* and catches panics. No raw pointer is dereferenced directly in
# these wrappers. The contract is enforced by the `jni` crate's typed env
# handshake.
# ---------------------------------------------------------------------------
[[entries]]
file = "native/rust/crates/ripdpi-android/src/ffi.rs"
pattern = 'extern "system" fn'
reason = "JNI re-export shim"
preconditions = "JNI symbol is invoked only by the JVM, which guarantees JNIEnv* validity for the call frame"
enforcement = "jni::EnvUnowned::with_env handshake + panic::catch_unwind in callee"
owner = "android-ffi"
review_date = "2026-11-15"

