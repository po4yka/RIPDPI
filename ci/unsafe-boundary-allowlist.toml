# every unsafe-boundary pattern this module triggers; each is intrinsic
# to the BoringSSL C ABI and gated by an RAII guard (`RealityHookGuard`)
# whose Drop reclaims the leaked `Box<RealityCallbackState>` exactly
# once. The caller of `install_reality_client_hello_hook` (an `unsafe fn`)
# must keep the returned guard alive at least as long as the SSL object,
# per the module-level doc-comment contract.
# ---------------------------------------------------------------------------
[[entries]]
file = "native/rust/crates/ripdpi-vless/src/reality_hook.rs"
pattern = 'extern "C" fn'
reason = "BoringSSL `client_hello_cb` ABI: a function-pointer type alias and the callback definition itself, invoked by patched BoringSSL during `ssl_add_client_hello`"
preconditions = "Invoked by BoringSSL with a valid `*mut SslHandle`, a `*mut u8` plus length pair pointing into the in-flight ClientHello body, and the `arg` pointer that was set via `SSL_CTX_set_client_hello_cb`. The Rust side null-checks all three arguments before any dereference and `catch_unwind`s every panic so it never unwinds across the C ABI"
enforcement = "Type alias `RealityHelloCb` matches the patched-BoringSSL signature exactly (verified against `docs/design/reality-boringssl-patch.md`). The function body runs inside `std::panic::catch_unwind(AssertUnwindSafe(...))`; any panic latches `RealityCallbackState.failed` via `Release` store and returns 0, which the C side interprets as handshake failure"
owner = "vless"
review_date = "2026-11-15"

[[entries]]
file = "native/rust/crates/ripdpi-vless/src/reality_hook.rs"
