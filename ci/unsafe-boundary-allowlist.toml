# ---------------------------------------------------------------------------
# `extern "C" fn`: signal handlers and platform callback shims. These are
# invoked by the OS/runtime, never directly from Rust code.
# ---------------------------------------------------------------------------
[[entries]]
file = "native/rust/crates/ripdpi-proxy-runtime/src/process.rs"
pattern = 'extern "C" fn'
reason = "SIGCHLD/SIGTERM signal handler installed via libc::sigaction"
preconditions = "Invoked asynchronously by the OS; must remain async-signal-safe (no allocation, no mutex)"
enforcement = "Body only performs atomic flag stores; reviewed each time it changes"
owner = "proxy-runtime"
review_date = "2026-11-15"

[[entries]]
file = "native/rust/crates/ripdpi-proxy-runtime-adapter/src/platform.rs"
pattern = 'extern "C" fn'
reason = "Connect-hook callback handed to socket2 for platform connect customization"
preconditions = "Invoked by socket2 with a borrowed SOCKET handle valid for the call"
enforcement = "Callback delegates to a `Box<dyn Fn>` whose lifetime is owned by the caller"
owner = "proxy-runtime-adapter"
review_date = "2026-11-15"

[[entries]]
file = "native/rust/crates/ripdpi-root-helper/src/main.rs"
pattern = 'extern "C" fn'
reason = "Root-helper SIGCHLD reaper signal handler"
preconditions = "Invoked asynchronously by the OS; must remain async-signal-safe"
enforcement = "Body only performs a non-blocking waitpid loop and an atomic flag store"
owner = "root-helper"
review_date = "2026-11-15"

[[entries]]
file = "native/rust/crates/ripdpi-runtime-platform/src/process.rs"
pattern = 'extern "C" fn'
reason = "Signal handler shared with the proxy runtime"
preconditions = "Async-signal-safe body only"
enforcement = "Atomic-flag store only; reviewed on change"
owner = "runtime-platform"
review_date = "2026-11-15"

# ---------------------------------------------------------------------------
# Targeted `slice::from_raw_parts` uses: each is a thin adapter over an OS
# syscall result with a small, locally documented unsafe block.
# ---------------------------------------------------------------------------
[[entries]]
file = "native/rust/crates/ripdpi-geo/src/mapped_file.rs"
pattern = "slice::from_raw_parts"
reason = "Read-only view over an mmap region owned by `MappedFile`"
preconditions = "The pointer was returned by mmap with `self.len` bytes; the returned slice's lifetime is tied to `&self`, which Drop munmaps exactly once"
enforcement = "RAII: `MappedFile` is the sole owner of the mapping; the slice borrows `&self`"
owner = "geo"
review_date = "2026-11-15"

[[entries]]
file = "native/rust/crates/ripdpi-privileged-ops/src/linux/experimental_tier3/icmp_wrapped_udp.rs"
pattern = "slice::from_raw_parts"
reason = "Materialize the `received`-prefixed window of an `[MaybeUninit<u8>; 8192]` after `recv_from` reports `received` bytes"
preconditions = "`recv_from` initialised exactly the first `received` bytes; `received <= buf.len()`"
enforcement = "Caller is a private function inside the same module; the buffer is a stack `[MaybeUninit<u8>; 8192]` that outlives the slice"
owner = "privileged-ops"
review_date = "2026-11-15"
