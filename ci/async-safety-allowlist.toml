file = "native/rust/crates/ripdpi-socks5-core/src/client.rs"
pattern = "to_socket_addrs"
line = 420
executor_strategy = "review-needed: SOCKS5 client outbound bind address resolution. Called from CLI/tool code paths, not from the proxy runtime worker pool. Switch to `lookup_host` when ripdpi-socks5-core is next touched."
reason = "SOCKS5 client resolves its outbound bind IP."
owner = "transport-team"
review_date = "2026-11-17"

