# Async-Safety Allowlist
# ======================
# Each entry grandfathers a production call site flagged by
# `scripts/ci/check_async_safety.py`. The policy in
# `docs/rust-soundness-policy.md` ("Blocking inside async runtime",
# audit issue 39) requires every entry to ship a documented
# `executor_strategy` that makes the blocking call safe in context.
#
# Required fields per entry:
#   file                Path relative to repo root.
#   pattern             One of the pattern IDs the scanner reports
#                       (`std::thread::sleep`, `to_socket_addrs`, ...).
#   line                Line number reported by the scanner.
#   executor_strategy   Why the blocking call cannot stall a tokio
#                       worker in this context. Examples:
#                         - "called from a dedicated current_thread
#                            runtime built per-call; no other task
#                            runs on this runtime."
#                         - "wrapped in `tokio::task::spawn_blocking`
#                            -- this call is the body of the spawn."
#                         - "single-shot at process start before
#                            tokio runtime is spawned."
#   reason              Short human-readable summary.
#   owner               Crate/team responsible for keeping the entry
#                       sound.
#   review_date         ISO date for the next mandatory re-review.
#
# As of 2026-05-17 the two highest-leverage call sites (DoQ bootstrap
# and xHTTP resolver) have been refactored to `tokio::net::lookup_host`.
# The remaining 3 review-needed entries below are vendored SOCKS5
# client paths:
#
#   - The SOCKS5 CLIENT paths (`client.rs:419/438/536`) run once per
#     outbound connection from the proxy CLI tooling; blocking briefly
#     here is tolerable but should be lifted to `lookup_host`
#     opportunistically.
#
# Each entry below carries `executor_strategy = "review-needed: ..."`
# to make the follow-up explicit. New blocking-in-async additions are
# NOT allowed to use the `review-needed` placeholder -- they must
# either ship the fix or provide a real strategy.

[[entries]]
file = "native/rust/crates/ripdpi-vless/src/endpoint_resolver.rs"
pattern = "to_socket_addrs"
line = 35
executor_strategy = "wrapped in `tokio::task::spawn_blocking`; `to_socket_addrs` is the body of the blocking closure and runs on the blocking thread pool, not on a tokio worker. The scanner matches the syntactic call site inside the closure, which is a false positive."
reason = "`resolve_hostname_via_system_dns` wraps the std blocking DNS lookup in `spawn_blocking` before awaiting the join handle."
owner = "transport-team"
review_date = "2026-11-22"

[[entries]]
file = "native/rust/crates/ripdpi-socks5-core/src/client.rs"
pattern = "to_socket_addrs"
line = 419
executor_strategy = "review-needed: SOCKS5 client outbound bind address resolution. Called from CLI/tool code paths, not from the proxy runtime worker pool. Switch to `lookup_host` when ripdpi-socks5-core is next touched."
reason = "SOCKS5 client resolves its outbound bind IP."
owner = "transport-team"
review_date = "2026-11-17"

[[entries]]
