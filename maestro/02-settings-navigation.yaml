appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "bottom-nav-settings"
- assertVisible:
    id: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-advanced-connectivity"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      notVisible:
        id: "settings-advanced-settings"
    commands:
      - tapOn:
          id: "settings-advanced-connectivity"
- tapOn:
    id: "settings-advanced-settings"
- assertVisible:
    id: "advanced_settings-screen"
