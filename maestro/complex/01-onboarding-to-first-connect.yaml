appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- assertVisible:
    id: "onboarding-screen"
# Step 1: privacy.
- tapOn:
    id: "onboarding-continue"
# Step 2: interface persona.
- assertVisible:
    id: "onboarding-persona-simple"
- tapOn:
    id: "onboarding-continue"
# Step 3: traffic mode.
- assertVisible:
    id: "onboarding-mode-proxy"
- tapOn:
    id: "onboarding-mode-proxy"
- tapOn:
    id: "onboarding-continue"
# Step 4: connection test.
- assertVisible:
    id: "onboarding-validate-action"
- tapOn:
    id: "onboarding-skip-test"
- assertVisible:
    id: "home-screen"
- scrollUntilVisible:
    element:
      id: "home-modes-diagnostics-header"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible:
        id: "home-modes-diagnostics-collapsed"
    commands:
      - tapOn:
          id: "home-modes-diagnostics-header"
- scrollUntilVisible:
    element:
      id: "home-mode-primary-local-dpi-bypass"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "home-mode-primary-local-dpi-bypass"
- tapOn:
    id: "home-mode-primary-local-dpi-bypass"
- assertVisible:
    id: "home-mode-primary-local-dpi-bypass"
