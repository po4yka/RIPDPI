appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- assertVisible:
    id: "home-screen"
- assertVisible:
    id: "home-permission-issue-banner"
- tapOn:
    id: "home-permission-issue-banner"
- assertVisible:
    id: "vpn-permission-dialog"
- tapOn:
    id: "vpn-permission-dialog-continue"
- tapOn:
    text: "OK|Allow"
    optional: true
- assertVisible:
    id: "home-screen"
- scrollUntilVisible:
    element:
      id: "home-modes-diagnostics-header"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible:
        id: "home-modes-diagnostics-collapsed"
    commands:
      - tapOn:
          id: "home-modes-diagnostics-collapsed"
- assertVisible:
    id: "home-mode-primary-local-dpi-bypass"
- tapOn:
    id: "home-mode-primary-local-dpi-bypass"
- assertVisible:
    id: "home-mode-primary-local-dpi-bypass"
