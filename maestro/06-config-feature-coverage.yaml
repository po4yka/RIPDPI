appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "bottom-nav-config"
- assertVisible:
    id: "config-screen"
- assertVisible:
    id: "config-mode-vpn"
- assertVisible:
    id: "config-mode-proxy"
- assertVisible:
    id: "config-mode-section-local-bypass"
- assertVisible:
    id: "config-local-bypass-summary"
- tapOn:
    id: "config-mode-section-vpn"
- assertVisible:
    id: "config-vpn-summary"
- assertVisible:
    id: "config-vpn-relay"
- tapOn:
    id: "config-mode-section-local-bypass"
- tapOn:
    id: "config-mode-proxy"
- assertVisible:
    id: "config-local-bypass-listen-address"
- assertVisible:
    id: "config-local-bypass-desync"
- tapOn:
    id: "config-dns-settings"
- assertVisible:
    id: "dns_settings-screen"
- pressKey: Back
- assertVisible:
    id: "config-screen"
- scrollUntilVisible:
    element:
      id: "config-profile-change"
    direction: UP
    centerElement: true
- tapOn:
    id: "config-profile-change"
- scrollUntilVisible:
    element:
      id: "config-preset-custom"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "config-preset-custom"
- assertVisible:
    id: "mode_editor-screen"
- assertVisible:
    id: "mode-editor-proxy-ip"
- assertVisible:
    id: "mode-editor-proxy-port"
- assertVisible:
    id: "mode-editor-save"
