appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- assertVisible:
    id: "home-screen"
- assertVisible:
    id: "home-setup-health-row"
- tapOn:
    id: "home-setup-health-row"
- assertVisible:
    id: "home-setup-health-details"
- scrollUntilVisible:
    element:
      id: "home-modes-diagnostics-header"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible:
        id: "home-modes-diagnostics-collapsed"
    commands:
      - tapOn:
          id: "home-modes-diagnostics-collapsed"
- assertVisible:
    id: "home-mode-card-local-dpi-bypass"
- assertVisible:
    id: "home-mode-card-remote-vpn"
- scrollUntilVisible:
    element:
      id: "home-mode-card-diagnostic"
    direction: DOWN
    centerElement: true
- assertNotVisible:
    id: "home-permission-issue-banner"
- assertNotVisible:
    id: "home-permission-recommendation-banner"
- assertNotVisible:
    id: "home-background-guidance-banner"
- assertNotVisible:
    id: "home-hard-kill-switch-banner"
