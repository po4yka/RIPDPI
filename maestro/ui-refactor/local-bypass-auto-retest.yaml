appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "bottom-nav-config"
- assertVisible:
    id: "config-local-bypass-simple"
- assertVisible:
    id: "config-local-bypass-strategy-auto"
- assertVisible:
    id: "config-local-bypass-precedence-note"
- scrollUntilVisible:
    element:
      id: "config-local-bypass-toggle"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "config-local-bypass-toggle"
- scrollUntilVisible:
    element:
      id: "config-local-bypass-retest"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "config-local-bypass-retest"
- assertVisible:
    id: "diagnostics-screen"
