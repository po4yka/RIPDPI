appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "bottom-nav-config"
- scrollUntilVisible:
    element:
      id: "config-mode-proxy"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "config-mode-proxy"
- scrollUntilVisible:
    element:
      id: "config-connection-details"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "config-connection-details"
- scrollUntilVisible:
    element:
      id: "config-local-bypass-strategy-auto"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "config-local-bypass-strategy-auto"
- assertVisible:
    id: "config-local-bypass-precedence-note"
- scrollUntilVisible:
    element:
      id: "config-runtime-action"
    direction: UP
    centerElement: true
- tapOn:
    id: "config-runtime-action"
- scrollUntilVisible:
    element:
      id: "config-local-bypass-retest"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "config-local-bypass-retest"
- assertVisible:
    id: "diagnostics-screen"
