appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "bottom-nav-settings"
- assertVisible:
    id: "settings-screen"
- scrollUntilVisible:
    element:
      id: "settings-advanced-connectivity"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      notVisible:
        id: "settings-advanced-settings"
    commands:
      - tapOn:
          id: "settings-advanced-connectivity"
- scrollUntilVisible:
    element:
      id: "settings-advanced-settings"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "settings-advanced-settings"
- assertVisible:
    id: "advanced_settings-screen"
- scrollUntilVisible:
    element:
      id: "advanced-input-diagnostics-history-retention-days"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "advanced-input-diagnostics-history-retention-days"
- eraseText
- inputText: "21"
- hideKeyboard
- assertVisible:
    id: "advanced_settings-screen"
- scrollUntilVisible:
    element:
      id: "advanced-save-diagnostics-history-retention-days"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "advanced-save-diagnostics-history-retention-days"
- assertVisible:
    id: "advanced-save-diagnostics-history-retention-days"
