appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- assertVisible:
    id: "home-screen"
- scrollUntilVisible:
    element:
      id: "home-modes-diagnostics-header"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible:
        id: "home-modes-diagnostics-collapsed"
    commands:
      - tapOn:
          id: "home-modes-diagnostics-header"
- assertVisible:
    id: "home-mode-card-remote-vpn"
- assertVisible:
    id: "home-mode-primary-remote-vpn"
- assertVisible:
    id: "route-stack"
