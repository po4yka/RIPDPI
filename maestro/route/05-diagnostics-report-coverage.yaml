appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- assertVisible:
    id: "diagnostics-screen"
- assertVisible:
    id: "diagnostics-section-dashboard"
- tapOn:
    id: "diagnostics-section-scan"
- scrollUntilVisible:
    element:
      id: "diagnostics-strategy-probe-report"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "diagnostics-strategy-probe-report"
- scrollUntilVisible:
    element:
      id: "diagnostics-strategy-full-matrix-toggle"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "diagnostics-strategy-full-matrix-toggle"
- scrollUntilVisible:
    element:
      id: "diagnostics-strategy-winning-path"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "diagnostics-strategy-winning-path"
- scrollUntilVisible:
    element:
      id: "diagnostics-strategy-probe-summary"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "diagnostics-strategy-probe-summary"
