name: tls-catalog-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify-tls-catalog-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify TLS catalog refresh cadence
        run: python3 scripts/ci/check_tls_catalog_refresh.py

      - name: Run TLS catalog refresh tests
        run: python3 -m unittest scripts.tests.test_tls_catalog_refresh
