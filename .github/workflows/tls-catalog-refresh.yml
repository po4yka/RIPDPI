name: tls-catalog-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify-tls-catalog-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Verify TLS catalog refresh cadence
        run: python3 scripts/ci/check_tls_catalog_refresh.py

      - name: Run TLS catalog refresh tests
        run: python3 -m unittest scripts.tests.test_tls_catalog_refresh
