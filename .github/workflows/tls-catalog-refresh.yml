name: tls-catalog-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * 1"

permissions:
  contents: read

jobs:
  verify-tls-catalog-refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify TLS catalog refresh cadence
        run: python3 scripts/ci/check_tls_catalog_refresh.py

      - name: Run TLS catalog refresh tests
        run: python3 -m unittest scripts.tests.test_tls_catalog_refresh

  verify-mozilla-ca-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The freshness check reads the bundle's last commit time.
          fetch-depth: 0

      - name: Check Mozilla CA bundle freshness
        run: scripts/ci/refresh_mozilla_ca_bundle.sh
