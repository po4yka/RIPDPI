name: Upstream Spec Watch

# Checks each protocol crate's SPEC_VERSION.md metadata, SPEC.md presence, and
# pinned fixture tags, then uploads a non-blocking pin-inventory report.

on:
  pull_request:
    paths:
      - "native/rust/crates/**/SPEC.md"
      - "native/rust/crates/**/SPEC_VERSION.md"
      - "contract-fixtures/**"
      - "scripts/ci/check_protocol_fixture_versions.py"
      - "scripts/ci/verify_spec_md_present.sh"
      - "scripts/ci/verify_spec_versions.py"
      - "scripts/tests/test_protocol_fixture_versions.py"
      - ".github/workflows/upstream-spec-watch.yml"
  schedule:
    - cron: "47 9 * * 1"  # Mondays 09:47 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify SPEC_VERSION.md format
        run: python3 scripts/ci/verify_spec_versions.py --format-only

      - name: Verify protocol fixture tags
        run: python3 scripts/ci/check_protocol_fixture_versions.py

      - name: Verify SPEC.md presence
        run: bash scripts/ci/verify_spec_md_present.sh

      - name: Diff pins against upstream defaults
        id: drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Per-crate drift detection is best-effort. The job is informational
          # until per-protocol upstream APIs are wired (xray-core release feed,
          # hysteria release tags, tuic tags, etc.). This step currently emits
          # a placeholder report; expand it as the watch matures.
          {
            echo "## Upstream Spec Watch — $(date -u +%Y-%m-%d)"
            echo
            echo "Pins are currently format-only. Reachability and release-note"
            echo "diffing will be added per-protocol; see"
            echo "docs/native/upstream-spec-watch-runbook.md."
            echo
            for crate in ripdpi-vless ripdpi-xhttp ripdpi-hysteria2 ripdpi-tuic ripdpi-shadowtls ripdpi-anytls ripdpi-naiveproxy ripdpi-ws-tunnel; do
              echo "### $crate"
              grep -E '^- \*\*Upstream (repo|tag|commit|reviewed)' "native/rust/crates/$crate/SPEC_VERSION.md" || true
              echo
            done
          } > drift-report.md
          cat drift-report.md

      - name: Upload drift report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-spec-watch-report
          path: drift-report.md
          retention-days: 30
