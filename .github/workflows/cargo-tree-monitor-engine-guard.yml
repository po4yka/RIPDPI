name: Monitor-engine dependency guard

# Fails if ripdpi-monitor-engine re-acquires a direct or transitive dependency on
# ripdpi-runtime-api.
#
# Update procedure (intentional reintroduction):
#   1. Confirm the dependency is truly needed and the architectural decision has
#      been reviewed against docs/architecture/DIAGNOSTICS_ARCHITECTURE.md and
#      docs/architecture/NATIVE_RUST.md.
#   2. Remove or relax the corresponding `if cargo tree --locked …` guard block below.
#   3. Open a PR with an explicit note in the description explaining why the
#      formerly-dropped dependency is being reintroduced.

on:
  pull_request:
    branches: [main]
    paths:
      - "native/rust/Cargo.toml"
      - "native/rust/Cargo.lock"
      - "native/rust/crates/ripdpi-monitor-engine/**"
      - ".github/workflows/cargo-tree-monitor-engine-guard.yml"
  push:
    branches: [main]
    paths:
      - "native/rust/Cargo.toml"
      - "native/rust/Cargo.lock"
      - "native/rust/crates/ripdpi-monitor-engine/**"
      - ".github/workflows/cargo-tree-monitor-engine-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-engine-dep-guard:
    name: Assert monitor-engine has no runtime-api deps
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.98.1"

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: cargo-tree-guard-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.lock') }}
          restore-keys: cargo-tree-guard-${{ runner.os }}-

      - name: Guard — ripdpi-runtime-api must not appear in monitor-engine deps
        run: |
          if cargo tree --locked \
               --manifest-path native/rust/Cargo.toml \
               -p ripdpi-monitor-engine \
               -i ripdpi-runtime-api \
               2>/dev/null; then
            echo "ERROR: ripdpi-monitor-engine has acquired a dependency on ripdpi-runtime-api."
            echo "This is a regression. See the update procedure in this workflow file."
            exit 1
          fi
          echo "OK: ripdpi-runtime-api not found in ripdpi-monitor-engine dep tree."
