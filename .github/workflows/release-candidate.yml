name: Android release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Future immutable release tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pluggable-transport-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      manifest_sha256: ${{ steps.digest.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-release-candidate-pluggable-transports
          rust-cache-save: "false"
          gradle-cache-read-only: "true"

      - name: Build source-pinned pluggable transport assets
        env:
          RUSTC_WRAPPER: sccache
        run: >-
          ./gradlew :core:engine:buildPluggableTransportAssets
          -Pripdpi.pluggableTransportAssetsMode=source
          -Pripdpi.pluggableTransportAssetsStrictFailures=true

      - name: Stage verified pluggable transport assets
        id: digest
        run: |
          set -euo pipefail
          source_root="core/engine/build/generated/pluggableTransportAssets"
          stage_root="$RUNNER_TEMP/pluggable-transport-assets"
          test -f "$source_root/metadata/pluggable-transports.json"
          mkdir -p "$stage_root"
          cp -a "$source_root/." "$stage_root/"
          manifest_sha256="$(sha256sum "$stage_root/metadata/pluggable-transports.json" | awk '{print $1}')"
          test "${#manifest_sha256}" -eq 64
          tar -C "$stage_root" -czf "$RUNNER_TEMP/pluggable-transport-assets.tar.gz" .
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified pluggable transport assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pluggable-transport-assets
          path: ${{ runner.temp }}/pluggable-transport-assets.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-signed-candidate:
    needs: pluggable-transport-assets
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: release-signing
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_RELEASE_CERT_SHA256: ${{ vars.RIPDPI_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release-candidate ref and identity inputs
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_RELEASE_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-android
          rust-cache-save: "true"
          gradle-cache-read-only: "true"

      - name: Download verified pluggable transport assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluggable-transport-assets
          path: ${{ runner.temp }}/pluggable-transport-download

      - name: Extract verified pluggable transport assets
        run: |
          set -euo pipefail
          scripts/ci/extract-pluggable-transport-artifact.sh \
            "$RUNNER_TEMP/pluggable-transport-download/pluggable-transport-assets.tar.gz" \
            "$RUNNER_TEMP/prebuilt-pluggable-transport-assets"

      - name: Check owned-stack TLS fingerprint snapshot
        run: bash scripts/ci/check-owned-stack-tls-fingerprint.sh

      - name: Resolve and verify release identity
        run: |
          ./gradlew :app:writeReleaseIdentityManifest \
            :app:verifyReleaseVersion \
            -Pripdpi.releaseRefName="$RELEASE_TAG"
          python3 scripts/ci/check_app_identity_review.py --report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compile release instrumentation before the native build
        run: |
          ./gradlew :app:compileGithubFullReleaseAndroidTestKotlin \
            -Pripdpi.testBuildType=release \
            -Pripdpi.skipNativeBuild=true

      - name: Materialize release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 0600 "$RUNNER_TEMP/release.keystore"

      - name: Verify release signing identity before build
        env:
          RIPDPI_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RIPDPI_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          actual="$({
            keytool -J-Duser.language=en -list -v \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "$RIPDPI_SIGNING_STORE_PASSWORD" \
              -alias "$RIPDPI_SIGNING_KEY_ALIAS"
          } | python3 scripts/ci/release_signature_fingerprint.py)" || {
            echo "::error::Could not extract the release keystore certificate SHA-256 digest."
            exit 1
          }
          if [ "$actual" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "::error::Release keystore certificate does not match the published signer continuity fingerprint."
            exit 1
          fi
          umask 077
          keytool -exportcert \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$RIPDPI_SIGNING_STORE_PASSWORD" \
            -alias "$RIPDPI_SIGNING_KEY_ALIAS" \
            -file "$RUNNER_TEMP/release-certificate.der"
          keytool -importcert -noprompt \
            -alias ripdpi-release \
            -file "$RUNNER_TEMP/release-certificate.der" \
            -keystore "$RUNNER_TEMP/release-verification-truststore.p12" \
            -storetype PKCS12 \
            -storepass ripdpi-public-cert

      - name: Build signed release candidate once
        env:
          RUSTC_WRAPPER: sccache
          RIPDPI_SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          RIPDPI_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RIPDPI_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RIPDPI_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          common_args=(
            -Pripdpi.testBuildType=release
            -Pripdpi.nativeAbiParallelism=1
            -Pripdpi.prebuiltPluggableTransportAssetsDir="$RUNNER_TEMP/prebuilt-pluggable-transport-assets"
            -Pripdpi.prebuiltPluggableTransportAssetsManifestSha256="${{ needs.pluggable-transport-assets.outputs.manifest_sha256 }}"
          )
          ./gradlew \
            :app:bundlePlayFullRelease \
            -Pripdpi.enableAbiSplits=false \
            "${common_args[@]}"
          ./gradlew \
            :app:assembleFdroidFullRelease \
            :app:assembleGithubFullRelease \
            :app:assembleGithubFullReleaseAndroidTest \
            -Pripdpi.enableAbiSplits=true \
            "${common_args[@]}"

      - name: Remove release signing key
        if: always()
        run: |
          key="$RUNNER_TEMP/release.keystore"
          if [ -f "$key" ]; then
            shred -u "$key"
          fi

      - name: Normalize channel artifacts and metadata
        run: |
          set -euo pipefail
          scripts/ci/generate_update_metadata.py \
            --apk-glob "app/build/outputs/apk/fdroidFull/release/*.apk" \
            --output-metadata "app/build/outputs/apk/fdroidFull/release/output-metadata.json" \
            --gradle-properties gradle.properties \
            --package-name com.poyka.ripdpi \
            --artifact-prefix app-fdroid-release \
            --size-report fdroid-apk-size-report.md
          scripts/ci/generate_update_metadata.py \
            --apk-glob "app/build/outputs/apk/githubFull/release/*.apk" \
            --output-metadata "app/build/outputs/apk/githubFull/release/output-metadata.json" \
            --gradle-properties gradle.properties \
            --package-name com.poyka.ripdpi \
            --artifact-prefix app-github-release \
            --update-json update.json \
            --sha256sums "$RUNNER_TEMP/intermediate-SHA256SUMS" \
            --size-report github-apk-size-report.md \
            --max-abi-apk-size-mib 170

      - name: Stage immutable candidate inventory
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/release-candidate"
          mkdir -p "$candidate"
          mapfile -t bundles < <(find app/build/outputs/bundle/playFullRelease -maxdepth 1 -type f -name '*.aab')
          test "${#bundles[@]}" -eq 1
          cp "${bundles[0]}" "$candidate/app-play-full-release.aab"
          cp app/build/outputs/apk/fdroidFull/release/app-fdroid-release-*.apk "$candidate/"
          cp app/build/outputs/apk/githubFull/release/app-github-release-*.apk "$candidate/"
          mapfile -t test_apks < <(find app/build/outputs/apk/androidTest -type f -name '*.apk')
          test "${#test_apks[@]}" -eq 1
          cp "${test_apks[0]}" "$candidate/app-github-release-androidTest.apk"
          cp update.json github-apk-size-report.md fdroid-apk-size-report.md "$candidate/"
          python3 scripts/ci/release_candidate_manifest.py create \
            --directory "$candidate" \
            --source-sha "$GITHUB_SHA" \
            --output "$candidate/candidate-manifest.json"
          python3 scripts/ci/release_candidate_manifest.py verify \
            --directory "$candidate" \
            --manifest "$candidate/candidate-manifest.json" \
            --expected-source-sha "$GITHUB_SHA"

      - name: Verify release signatures and signer continuity
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/release-candidate"
          apksigner="$(find "${ANDROID_SDK_ROOT:?}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner"
          for apk in "$candidate"/*.apk; do
            name="$(basename "$apk")"
            if ! output="$($apksigner verify --verbose --print-certs "$apk" 2>&1)"; then
              echo "::error file=$name::APK signature verification failed."
              exit 1
            fi
            if [ "$name" != app-github-release-androidTest.apk ]; then
              actual="$(printf '%s\n' "$output" | python3 scripts/ci/release_signature_fingerprint.py)" || {
                echo "::error file=$name::Could not extract the APK signer SHA-256 digest."
                exit 1
              }
              if [ "$actual" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
                echo "::error file=$name::APK signer does not match the published signer continuity fingerprint."
                exit 1
              fi
            fi
            echo "Verified APK signature: $name"
          done
          aab="$candidate/app-play-full-release.aab"
          if ! jarsigner -J-Duser.language=en -verify -strict \
            -keystore "$RUNNER_TEMP/release-verification-truststore.p12" \
            -storepass ripdpi-public-cert \
            "$aab" ripdpi-release >/dev/null 2>&1; then
            echo "::error file=app-play-full-release.aab::AAB signature verification failed."
            exit 1
          fi
          actual_aab="$(keytool -J-Duser.language=en -printcert -jarfile "$aab" | python3 scripts/ci/release_signature_fingerprint.py)" || {
            echo "::error file=app-play-full-release.aab::Could not extract the AAB signer SHA-256 digest."
            exit 1
          }
          if [ "$actual_aab" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "::error file=app-play-full-release.aab::AAB signer does not match the published signer continuity fingerprint."
            exit 1
          fi
          echo "Verified AAB signature: app-play-full-release.aab"

      - name: Remove release verification certificate
        if: always()
        run: |
          shred -u \
            "$RUNNER_TEMP/release-certificate.der" \
            "$RUNNER_TEMP/release-verification-truststore.p12" 2>/dev/null || true

      - name: Verify native ELF payload from exact candidate APKs
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/release-candidate"
          extracted="$RUNNER_TEMP/candidate-native"
          mkdir -p "$extracted"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -q "$candidate/app-github-release-$abi.apk" 'lib/*/*.so' -d "$extracted"
          done
          python3 scripts/ci/verify_native_elfs.py \
            --lib-dir "$extracted/lib" \
            --abis arm64-v8a,armeabi-v7a,x86,x86_64

      - name: Package deterministic release native symbols
        run: |
          set -euo pipefail
          ndk_version="$(grep '^ripdpi.nativeNdkVersion=' gradle.properties | cut -d= -f2-)"
          readelf="$ANDROID_SDK_ROOT/ndk/$ndk_version/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          python3 scripts/ci/package_native_symbols.py \
            --symbols-dir core/engine/build/generated/nativeSymbols \
            --stripped-libs-dir core/engine/build/generated/jniLibs \
            --output-dir "$RUNNER_TEMP/release-native-symbols" \
            --readelf "$readelf"

      - name: Upload immutable Android release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-candidate
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 30

      - name: Upload release retrace inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-retrace-inputs
          path: |
            app/build/outputs/mapping/*Release/mapping.txt
            app/build/intermediates/compose_mapping/*Release/compose-mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload release native symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-native-symbols
          path: |
            ${{ runner.temp }}/release-native-symbols/manifest.json
            ${{ runner.temp }}/release-native-symbols/release-native-symbols.zip
          if-no-files-found: error
          retention-days: 90

  attest-candidate:
    needs: build-signed-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download immutable Android release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-candidate
          path: ${{ runner.temp }}/release-candidate

      - name: Reverify candidate before attestation
        run: |
          python3 scripts/ci/release_candidate_manifest.py verify \
            --directory "$RUNNER_TEMP/release-candidate" \
            --manifest "$RUNNER_TEMP/release-candidate/candidate-manifest.json" \
            --expected-source-sha "$GITHUB_SHA"

      - name: Attest exact candidate build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ runner.temp }}/release-candidate/*.apk
            ${{ runner.temp }}/release-candidate/*.aab
            ${{ runner.temp }}/release-candidate/candidate-manifest.json
