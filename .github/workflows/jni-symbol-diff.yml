name: JNI Symbol Diff

on:
  pull_request:
    branches: [main]
    paths:
      - "native/rust/crates/ripdpi-android/**"
      - "native/rust/crates/ripdpi-tunnel-android/**"
      - "native/rust/crates/ripdpi-relay-android/**"
      - "native/rust/crates/ripdpi-warp-android/**"
      - "native/rust/crates/ripdpi-amneziawg-android/**"
      - ".github/workflows/jni-symbol-diff.yml"
      - ".github/scripts/check-jni-symbols.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jni-symbol-diff:
    name: JNI symbol surface guard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-targets: aarch64-linux-android
          rust-cache-shared-key: jni-sym
          gradle-cache-read-only: "true"

      # Install the pinned toolchain and its components before the native build.
      - name: Pre-install pinned Rust toolchain
        working-directory: native/rust
        run: |
          rustup show
          cargo --version

      - name: Build native library (arm64-v8a release)
        run: ./gradlew :core:engine:buildRustNativeLibs -Pripdpi.nativeAbisOverride=arm64-v8a

      - name: Locate native libraries (arm64-v8a)
        id: locate
        run: |
          JNI_LIB_DIR="$(find . -type d -path "*/jniLibs/arm64-v8a" -print -quit 2>/dev/null)"
          if [[ -z "${JNI_LIB_DIR}" ]]; then
            echo "error: could not locate arm64-v8a JNI library directory after build" >&2
            exit 1
          fi
          echo "dir=${JNI_LIB_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Check every JNI symbol surface against its baseline
        env:
          JNI_LIB_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          while read -r library crate; do
            bash .github/scripts/check-jni-symbols.sh \
              "${JNI_LIB_DIR}/lib${library}.so" \
              "native/rust/crates/${crate}/jni-symbols.baseline"
          done <<'EOF'
          ripdpi ripdpi-android
          ripdpi-tunnel ripdpi-tunnel-android
          ripdpi-relay ripdpi-relay-android
          ripdpi-warp ripdpi-warp-android
          ripdpi-amneziawg ripdpi-amneziawg-android
          EOF
