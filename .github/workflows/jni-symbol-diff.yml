name: JNI Symbol Diff

on:
  pull_request:
    branches: [main]
    paths:
      - "native/rust/crates/ripdpi-android/**"
      - ".github/workflows/jni-symbol-diff.yml"
      - ".github/scripts/check-jni-symbols.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jni-symbol-diff:
    name: JNI symbol surface guard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "${GITHUB_ENV}"

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rust/target
          key: jni-sym-${{ runner.os }}-${{ hashFiles('native/rust/Cargo.lock') }}
          restore-keys: jni-sym-${{ runner.os }}-

      # Materialize the pinned rust-toolchain.toml channel + its components
      # (clippy/rust-src/rust-analyzer/rustfmt) once, serially, before the
      # parallel per-ABI cargo builds below. Without this, each ABI's cargo
      # invocation triggers rustup to auto-install the toolchain concurrently
      # and they race on ~/.rustup/downloads/*.partial ("could not rename ...
      # No such file or directory"). ~/.rustup is not cached, so this is
      # deterministic, not flaky.
      - name: Pre-install pinned Rust toolchain
        working-directory: native/rust
        run: |
          rustup show
          cargo --version

      - name: Build native library (arm64-v8a release)
        run: ./gradlew :core:engine:buildRustNativeLibs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Locate libripdpi.so (arm64-v8a)
        id: locate
        run: |
          LIB="$(find . -path "*/jniLibs/arm64-v8a/libripdpi.so" -print -quit 2>/dev/null)"
          if [[ -z "${LIB}" ]]; then
            LIB="$(find native/rust/target -name "libripdpi.so" -print -quit 2>/dev/null)"
          fi
          if [[ -z "${LIB}" ]]; then
            echo "error: could not locate libripdpi.so after build" >&2
            exit 1
          fi
          echo "lib=${LIB}" >> "${GITHUB_OUTPUT}"

      - name: Check JNI symbols against baseline
        run: bash .github/scripts/check-jni-symbols.sh "${{ steps.locate.outputs.lib }}"
