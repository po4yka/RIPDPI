name: JNI Symbol Diff

on:
  pull_request:
    branches: [main]
    paths:
      - "native/rust/crates/ripdpi-android/**"
      - ".github/workflows/jni-symbol-diff.yml"
      - ".github/scripts/check-jni-symbols.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jni-symbol-diff:
    name: JNI symbol surface guard
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: jni-sym
          gradle-cache-read-only: "true"

      # Materialize the pinned rust-toolchain.toml channel + its components
      # (clippy/rust-src/rust-analyzer/rustfmt) once, serially, before the
      # parallel per-ABI cargo builds below. Without this, each ABI's cargo
      # invocation triggers rustup to auto-install the toolchain concurrently
      # and they race on ~/.rustup/downloads/*.partial ("could not rename ...
      # No such file or directory"). ~/.rustup is not cached, so this is
      # deterministic, not flaky.
      - name: Pre-install pinned Rust toolchain
        working-directory: native/rust
        run: |
          rustup show
          cargo --version

      - name: Build native library (arm64-v8a release)
        run: ./gradlew :core:engine:buildRustNativeLibs

      - name: Locate libripdpi.so (arm64-v8a)
        id: locate
        run: |
          LIB="$(find . -path "*/jniLibs/arm64-v8a/libripdpi.so" -print -quit 2>/dev/null)"
          if [[ -z "${LIB}" ]]; then
            LIB="$(find native/rust/target -name "libripdpi.so" -print -quit 2>/dev/null)"
          fi
          if [[ -z "${LIB}" ]]; then
            echo "error: could not locate libripdpi.so after build" >&2
            exit 1
          fi
          echo "lib=${LIB}" >> "${GITHUB_OUTPUT}"

      - name: Check JNI symbols against baseline
        run: bash .github/scripts/check-jni-symbols.sh "${{ steps.locate.outputs.lib }}"
