name: Fuzz Nightly

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds to run each fuzz target in its shard
        required: false
        default: "600"
        type: string

permissions:
  contents: read

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest
    # Operators may request up to the documented 1,800 seconds per target;
    # three targets share a shard, so retain headroom for compilation.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-06-12
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-fuzz@0.13.1
      - name: Run fuzz targets
        env:
          RIPDPI_FUZZ_SECONDS: ${{ inputs.fuzz_seconds || 600 }}
          RIPDPI_FUZZ_RUST_TOOLCHAIN: nightly-2026-06-12
          RIPDPI_FUZZ_SHARD_COUNT: "6"
          RIPDPI_FUZZ_SHARD_INDEX: ${{ matrix.shard }}
          RIPDPI_FUZZ_ARTIFACTS_DIR: ${{ runner.temp }}/fuzz-artifacts
        run: bash scripts/ci/run-rust-fuzz-smoke.sh
      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 14
