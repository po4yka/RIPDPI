name: Fuzz Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds to run each fuzz target
        required: false
        default: "1800"
        type: string

permissions:
  contents: read

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --quiet
      - name: Run fuzz targets
        run: env RIPDPI_FUZZ_SECONDS=${{ inputs.fuzz_seconds || 1800 }} bash scripts/ci/run-rust-fuzz-smoke.sh
