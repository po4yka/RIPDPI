name: Fuzz Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds to run each fuzz target
        required: false
        default: "1200"
        type: string

permissions:
  contents: read

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --quiet
      - name: Run fuzz targets
        run: env RIPDPI_FUZZ_SECONDS=${{ inputs.fuzz_seconds || 1200 }} RIPDPI_FUZZ_ARTIFACTS_DIR="$RUNNER_TEMP/fuzz-artifacts" bash scripts/ci/run-rust-fuzz-smoke.sh
      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: ${{ runner.temp }}/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 14
