name: Fuzz Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Seconds to run each fuzz target
        required: false
        default: "1200"
        type: string

permissions:
  contents: read

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --quiet
      - name: Run fuzz targets
        run: env RIPDPI_FUZZ_SECONDS=${{ inputs.fuzz_seconds || 1200 }} bash scripts/ci/run-rust-fuzz-smoke.sh
