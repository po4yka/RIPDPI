name: Telegram Worker contracts

on:
  push:
    branches: [main]
    paths:
      - docs/native/cloudflare-workers/**
      - .github/workflows/telegram-worker.yml
  pull_request:
    branches: [main]
    paths:
      - docs/native/cloudflare-workers/**
      - .github/workflows/telegram-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  relay-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Test Worker request validation
        run: node --test docs/native/cloudflare-workers/relay.test.mjs
      - name: Test binary relay in the pinned local Worker runtime
        run: npx --yes workerd@1.20260515.1 test docs/native/cloudflare-workers/relay.workerd.capnp
