name: L7 adversarial dry-run

on:
  pull_request:
    paths:
      - "test-lab/chaos/tspu/**"
      - "scripts/ci/run-l7-adversarial-dryrun.sh"
      - "scripts/ci/run-tspu-dryrun.sh"
      - ".github/workflows/l7-adversarial-dryrun.yml"
  push:
    branches:
      - main
    paths:
      - "test-lab/chaos/tspu/**"
      - "scripts/ci/run-l7-adversarial-dryrun.sh"
      - "scripts/ci/run-tspu-dryrun.sh"
      - ".github/workflows/l7-adversarial-dryrun.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Run L7 adversarial dry-run
        env:
          RIPDPI_L7_ADVERSARIAL_ARTIFACT_DIR: ${{ runner.temp }}/l7-adversarial-dryrun
        run: bash scripts/ci/run-l7-adversarial-dryrun.sh

      - name: Upload verdict report + pcaps
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l7-adversarial-dryrun-artifacts
          path: ${{ runner.temp }}/l7-adversarial-dryrun
          retention-days: 14
