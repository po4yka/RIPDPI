name: L7 adversarial dry-run

on:
  pull_request:
    paths:
      - "test-lab/chaos/tspu/**"
      - "scripts/ci/run-l7-adversarial-dryrun.sh"
      - "scripts/ci/run-tspu-dryrun.sh"
      - ".github/workflows/l7-adversarial-dryrun.yml"
  push:
    branches:
      - main
    paths:
      - "test-lab/chaos/tspu/**"
      - "scripts/ci/run-l7-adversarial-dryrun.sh"
      - "scripts/ci/run-tspu-dryrun.sh"
      - ".github/workflows/l7-adversarial-dryrun.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Run L7 adversarial dry-run
        env:
          RIPDPI_L7_ADVERSARIAL_ARTIFACT_DIR: ${{ runner.temp }}/l7-adversarial-dryrun
        run: bash scripts/ci/run-l7-adversarial-dryrun.sh

      - name: Upload verdict report + pcaps
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l7-adversarial-dryrun-artifacts
          path: ${{ runner.temp }}/l7-adversarial-dryrun
          retention-days: 14
