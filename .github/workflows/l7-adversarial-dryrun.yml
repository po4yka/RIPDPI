name: L7 adversarial dry-run

on:
  pull_request:
    paths:
      - "test-lab/chaos/tspu/**"
      - "scripts/ci/run-l7-adversarial-dryrun.sh"
      - "scripts/ci/run-tspu-dryrun.sh"
      - "scripts/ci/run-l7-engine-evidence.sh"
      - "scripts/ci/run-phase16-matrix-entry.sh"
      - "scripts/ci/phase16*.py"
      - "scripts/tests/test_phase16_matrix.py"
      - "contract-fixtures/phase16_lab_matrix.json"
      - "native/rust/**"
      - ".github/workflows/l7-adversarial-dryrun.yml"
  push:
    branches:
      - main
    paths:
      - "test-lab/chaos/tspu/**"
      - "scripts/ci/run-l7-adversarial-dryrun.sh"
      - "scripts/ci/run-tspu-dryrun.sh"
      - "scripts/ci/run-l7-engine-evidence.sh"
      - "scripts/ci/run-phase16-matrix-entry.sh"
      - "scripts/ci/phase16*.py"
      - "scripts/tests/test_phase16_matrix.py"
      - "contract-fixtures/phase16_lab_matrix.json"
      - "native/rust/**"
      - ".github/workflows/l7-adversarial-dryrun.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run L7 adversarial dry-run
        env:
          RIPDPI_L7_ADVERSARIAL_ARTIFACT_DIR: ${{ runner.temp }}/l7-adversarial-dryrun
        run: bash scripts/ci/run-l7-adversarial-dryrun.sh

      - name: Test Phase16 evidence contracts
        run: python3 -m unittest scripts.tests.test_phase16_matrix

      - name: Upload verdict report + pcaps
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l7-adversarial-dryrun-artifacts
          path: ${{ runner.temp }}/l7-adversarial-dryrun
          retention-days: 14

  engine-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-targets: ""
          rust-cache-shared-key: l7-engine-evidence
          setup-java: "false"
          setup-gradle: "false"
          skip-android-sdk-ndk: "true"

      - name: Install raw packet capture tools
        run: |
          # The runner image ships cmake; bounded timeouts turn the Azure mirror
          # stalls (up to 10 minutes per package) into fast retries.
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          packages=(libclang-dev tcpdump tshark)
          command -v cmake >/dev/null || packages+=(cmake)
          sudo apt-get "${apt_options[@]}" update
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"
          sudo setcap cap_net_raw,cap_net_admin=eip "$(command -v tcpdump)"

      - name: Run current-engine TLS packet gate
        env:
          RIPDPI_L7_ENGINE_ARTIFACT_DIR: ${{ runner.temp }}/l7-engine-evidence
        run: bash scripts/ci/run-l7-engine-evidence.sh

      - name: Upload engine gate receipt and local fixture captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l7-engine-evidence
          path: ${{ runner.temp }}/l7-engine-evidence
          if-no-files-found: warn
          retention-days: 14
