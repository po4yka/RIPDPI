name: harness-checks

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/skills/**'
      - '.github/workflows/harness-checks.yml'
      - 'lefthook.yml'
      - 'native/rust/Cargo.toml'
      - 'native/rust/clippy.toml'
      - 'quality/release-gates/cross-language-runtime-contracts.json'
      - 'scripts/ci/check_harness_*.py'
      - 'scripts/ci/check_codex_skills_sync.py'
      - 'scripts/ci/check-rules-drift.sh'
      - 'scripts/tests/test_agent_hooks.py'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - '.github/skills/**'
      - '.github/workflows/harness-checks.yml'
      - 'lefthook.yml'
      - 'native/rust/Cargo.toml'
      - 'native/rust/clippy.toml'
      - 'quality/release-gates/cross-language-runtime-contracts.json'
      - 'scripts/ci/check_harness_*.py'
      - 'scripts/ci/check_codex_skills_sync.py'
      - 'scripts/ci/check-rules-drift.sh'
      - 'scripts/tests/test_agent_hooks.py'

permissions:
  contents: read

jobs:
  harness-validation:
    name: harness-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install manifest parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate manifests and discovery roots
        run: python3 scripts/ci/check_harness_manifests.py
      - name: Validate harness references
        run: python3 scripts/ci/check_harness_links.py --strict
      - name: Validate documented lint policy
        run: python3 scripts/ci/check_harness_policy.py
      - name: Validate locked Cargo commands
        run: python3 scripts/ci/check_harness_cargo_locked.py
      - name: Validate compatibility mirrors
        run: python3 scripts/ci/check_codex_skills_sync.py
      - name: Validate rule mirrors
        run: bash scripts/ci/check-rules-drift.sh
      - name: Test committed agent hooks
        run: python3 scripts/tests/test_agent_hooks.py
      - name: Test harness-owned scanners
        run: python3 -m unittest scripts.tests.test_network_surface_scanner
