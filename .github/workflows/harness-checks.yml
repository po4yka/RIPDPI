name: harness-checks

on:
  pull_request:
    paths:
      - '.claude/**'
      - 'native/rust/Cargo.toml'
      - 'native/rust/clippy.toml'
      - 'scripts/ci/check_harness_*.py'
      - '.github/workflows/harness-checks.yml'
  push:
    branches: [main]
    paths:
      - '.claude/**'
      - 'native/rust/Cargo.toml'
      - 'native/rust/clippy.toml'

permissions:
  contents: read
  pull-requests: write

jobs:
  link-audit:
    name: harness link audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run link audit (report-only during transition)
        run: python3 scripts/ci/check_harness_links.py --report-only

  policy-audit:
    name: harness policy audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: run policy audit (report-only during transition)
        run: python3 scripts/ci/check_harness_policy.py --report-only

  # agent-review is a placeholder lane that demonstrates how the Claude-Code
  # sub-agents (`unsafe-code-auditor`, `async-cancel-safety`,
  # `jni-bridge-verifier`, `rust-api-auditor`) would fire on PR diffs.
  #
  # This lane is currently DISABLED by default. To enable:
  # 1. Add `ANTHROPIC_API_KEY` to the repo secrets.
  # 2. Add the official Claude Code installer step:
  #      - run: npm install -g @anthropic-ai/claude-code
  # 3. Set `if: false` below to `if: secrets.ANTHROPIC_API_KEY != ''`.
  # 4. The headless invocations use `claude -p` with `--allowed-tools` scoped
  #    to read-only operations; outputs are posted as PR review comments
  #    through the Anthropic-supported GitHub Action when it ships.
  #
  # Without an API key the lane is a no-op gate, so adding the workflow file
  # does not impose any per-PR cost.
  agent-review:
    name: agent review (advisory, disabled without ANTHROPIC_API_KEY)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - run: echo "agent-review lane is disabled by default — see workflow comment for wiring instructions"
