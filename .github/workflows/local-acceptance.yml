name: Local VPN acceptance

on:
  pull_request:
    paths:
      - "test-lab/acceptance/**"
      - "test-lab/lima/ripdpi-acceptance.yaml"
      - "scripts/ci/run-android-local-acceptance.py"
      - "scripts/fixtures/xray-provider-peer/**"
      - "scripts/ci/android_*_fixture.py"
      - "scripts/ci/android_owned_installation.py"
      - "scripts/ci/android_udp_bridge.py"
      - "scripts/tests/test_android_*.py"
      - "native/rust/crates/ripdpi-hysteria2/**"
      - "native/rust/crates/ripdpi-relay-core/**"
      - ".github/workflows/local-acceptance.yml"
  workflow_dispatch:
    inputs:
      run_android:
        description: Build APKs and run real Android TUN acceptance
        type: boolean
        default: false
  schedule:
    - cron: "50 3 * * 2,5"

permissions:
  contents: read

concurrency:
  group: local-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate catalog and regression controls
        run: |
          python3 test-lab/acceptance/generate_manifest.py --check
          python3 test-lab/acceptance/lab.py validate
          python3 -m unittest discover -s test-lab/acceptance/tests -v
          python3 -m unittest discover -s test-lab/acceptance/vm/tests -v
          python3 -m unittest discover -s test-lab/acceptance/peers -p 'test_*.py' -v
          python3 -m unittest scripts.tests.test_android_local_acceptance scripts.tests.test_android_owned_installation scripts.tests.test_android_transport_fixtures scripts.tests.test_android_migration_receipt scripts.tests.test_android_migration_fixture scripts.tests.test_android_udp_bridge -v

  routed:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare isolated Linux routing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 nftables tcpdump ethtool
      - name: Run real TCP and UDP fault controls
        run: sudo python3 test-lab/acceptance/lab.py run --profile routed --out-dir "$RUNNER_TEMP/routed-acceptance"
      - name: Export readable metadata from the private root-owned run
        if: always()
        run: |
          sudo install -d -m 0755 "$RUNNER_TEMP/routed-public"
          for report in report.json report.xml; do
            sudo install -m 0644 "$RUNNER_TEMP/routed-acceptance/$report" "$RUNNER_TEMP/routed-public/$report"
          done
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: routed-acceptance-report
          path: |
            ${{ runner.temp }}/routed-public/report.json
            ${{ runner.temp }}/routed-public/report.xml
          retention-days: 7

  peers:
    needs: contracts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-android-rust
        with:
          setup-java: "false"
          setup-gradle: "false"
          skip-android-sdk-ndk: "true"
          rust-targets: ""
          rust-cache-shared-key: local-acceptance-peers
      - name: Prepare pinned peers and native tests
        run: python3 test-lab/acceptance/lab.py prepare --profile native --out-dir "$RUNNER_TEMP/peer-preparation"
      - name: Run exact native protocol cases
        run: python3 test-lab/acceptance/lab.py run --profile native --out-dir "$RUNNER_TEMP/peer-acceptance"
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peer-acceptance-report
          path: |
            ${{ runner.temp }}/peer-acceptance/report.json
            ${{ runner.temp }}/peer-acceptance/report.xml
          retention-days: 7

  hysteria-hopping:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-android-rust
        with:
          setup-java: "false"
          setup-gradle: "false"
          skip-android-sdk-ndk: "true"
          rust-targets: ""
          rust-cache-shared-key: hysteria-hopping-peers
      - name: Check Linux UDP GRO capabilities across hops
        working-directory: native/rust
        run: |
          set -euo pipefail
          cargo test --locked --jobs 4 -p ripdpi-hysteria2 --lib \
            hopping_socket::tests::adapter_preserves_gro_gso_and_fragmentation_capabilities_across_hops \
            -- --exact | tee "$RUNNER_TEMP/hopping-gro-test.log"
          grep -F 'test hopping_socket::tests::adapter_preserves_gro_gso_and_fragmentation_capabilities_across_hops ... ok' "$RUNNER_TEMP/hopping-gro-test.log"
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/hopping-gro-test.log"
      - name: Prepare pinned Hysteria peer and native relay test
        run: python3 test-lab/acceptance/lab.py prepare --profile hysteria-hopping --out-dir "$RUNNER_TEMP/hopping-preparation"
      - name: Run all eight remote hopping cases through RelayRuntime
        run: python3 test-lab/acceptance/lab.py run --profile hysteria-hopping --out-dir "$RUNNER_TEMP/hopping-acceptance"
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hysteria-hopping-report
          path: |
            ${{ runner.temp }}/hopping-acceptance/report.json
            ${{ runner.temp }}/hopping-acceptance/report.xml
          retention-days: 7

  android:
    needs: contracts
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_android)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-android-rust
        with:
          rust-targets: x86_64-linux-android
          rust-cache-shared-key: local-acceptance-android
      - uses: ./.github/actions/build-xray
      - uses: ./.github/actions/fetch-naive-upstream
        with:
          abis: x86_64
      - name: Build source-pinned pluggable transports
        run: >-
          ./gradlew :core:engine:buildPluggableTransportAssets
          -Pripdpi.nativeAbisOverride=x86_64
          -Pripdpi.pluggableTransportAssetsMode=source
          -Pripdpi.pluggableTransportAssetsStrictFailures=true
      - name: Prepare pinned Android transport peers
        run: |
          python3 scripts/ci/android_nginx_fixture.py --prepare-image
          python3 scripts/ci/android_hysteria_fixture.py --prepare-binary "$RUNNER_TEMP/hysteria-peer"
      - name: Cache pinned NaiveProxy peer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ripdpi-acceptance/peers
          key: naiveproxy-peer-${{ runner.os }}-${{ hashFiles('test-lab/acceptance/peers/naiveproxy.py', 'test-lab/acceptance/peers/go_toolchain.py') }}
      - name: Prepare pinned NaiveProxy peer
        run: python3 -c 'import sys; sys.path.insert(0, "test-lab/acceptance"); from execution import naiveproxy_binary; print(naiveproxy_binary({}))'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start disposable emulator
        run: bash scripts/ci/start-android-emulator.sh --fresh --avd local-acceptance --api 35 --arch x86_64 --target google_apis --boot-timeout 600
      - name: Prepare APKs once
        run: |
          serial="$(adb devices | awk '/^emulator-.*device$/ {print $1}')"
          test "$(printf '%s\n' "$serial" | wc -l)" -eq 1
          echo "ACCEPTANCE_SERIAL=$serial" >> "$GITHUB_ENV"
          python3 test-lab/acceptance/lab.py prepare --profile android --serial "$serial" --out-dir "$RUNNER_TEMP/android-preparation"
      - name: Run real TUN and independent Xray scenarios
        run: |
          python3 test-lab/acceptance/lab.py run --profile android \
            --serial "$ACCEPTANCE_SERIAL" \
            --prepared-dir "$RUNNER_TEMP/android-preparation/android" \
            --hysteria-binary "$RUNNER_TEMP/hysteria-peer" \
            --out-dir "$RUNNER_TEMP/android-acceptance"
      - name: Stop owned emulator
        if: always()
        run: bash scripts/ci/stop-android-emulator.sh --avd local-acceptance
      - name: Publish metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-acceptance-report
          path: |
            ${{ runner.temp }}/android-preparation/android/preparation-summary.json
            ${{ runner.temp }}/android-acceptance/*/runtime-summary.json
            ${{ runner.temp }}/android-acceptance/report.json
            ${{ runner.temp }}/android-acceptance/report.xml
          retention-days: 7
