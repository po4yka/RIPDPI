name: DNS IPv6 kill-switch evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA measured by the device or lab run
        required: true
        type: string
      results_json:
        description: Complete dns_ipv6_killswitch_results_v1 JSON from the measured run
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate measured source SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase 40-character Git SHA-1" >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha }}

      - name: Materialize measured gate results
        env:
          GATE_RESULTS_JSON: ${{ inputs.results_json }}
        run: |
          install -d "$RUNNER_TEMP/dns-ipv6-killswitch-release-evidence"
          printf '%s\n' "$GATE_RESULTS_JSON" \
            > "$RUNNER_TEMP/dns-ipv6-killswitch-release-evidence/results.json"

      - name: Validate complete exact-SHA release evidence
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 scripts/ci/check_dns_ipv6_killswitch_gates.py \
            --results "$RUNNER_TEMP/dns-ipv6-killswitch-release-evidence/results.json" \
            --applies-to android-client-release \
            --expected-source-sha "$SOURCE_SHA"

      - name: Publish validated release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dns-ipv6-killswitch-release-evidence
          path: ${{ runner.temp }}/dns-ipv6-killswitch-release-evidence/results.json
          if-no-files-found: error
          retention-days: 30
