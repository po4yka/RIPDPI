name: DNS IPv6 kill-switch evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 3"

permissions:
  contents: read

jobs:
  build-evidence-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-android
          rust-cache-save: "true"
          gradle-cache-read-only: "false"

      - name: Build exact-SHA evidence APKs
        run: |
          # x86_64 because the only consumer is the CI emulator. This was
          # arm64-v8a while a physical Pixel lane existed; that lane is retired,
          # so an arm64 build would now install nowhere.
          device_abi=x86_64
          ./gradlew --no-daemon :app:assembleGithubFullDebug \
            :app:assembleGithubFullDebugAndroidTest \
            -Pripdpi.nativeAbisOverride=$device_abi \
            -Pripdpi.enableAbiSplits=false
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' ! -name '*androidTest*')
          test "${#apks[@]}" -eq 1
          mapfile -t test_apks < <(find app/build/outputs/apk/androidTest -type f -name '*.apk')
          test "${#test_apks[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/evidence-apks"
          cp "${apks[0]}" "$RUNNER_TEMP/evidence-apks/client.apk"
          cp "${test_apks[0]}" "$RUNNER_TEMP/evidence-apks/test.apk"

      - name: Upload exact-SHA evidence APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dns-ipv6-killswitch-evidence-apks
          path: ${{ runner.temp }}/evidence-apks
          if-no-files-found: error
          retention-days: 3

  # The only capture lane. It replaced a self-hosted Raspberry Pi lane that never
  # produced evidence once: it needed a hand-placed runner config that was never
  # created, and per the 2026-07-22 work log the Pi could not observe the Pixel's
  # wireless network at all, so the vantage pair never formed.
  #
  # The CI host is a genuine external-observer vantage: emulator traffic to the
  # local fixture crosses host loopback, and a leak to a real resolver egresses on
  # a real interface. The collector watches every interface so neither is missed.
  capture-validate-publish-emulator:
    needs: build-evidence-apks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EVIDENCE_OUTPUT_NAME: dns-ipv6-killswitch-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      RIPDPI_EVIDENCE_OBSERVER_INTERFACE: any
      ANDROID_SERIAL: emulator-5554
      ORDINARY_RESULTS_BASE64: ${{ secrets.RIPDPI_ANDROID_ORDINARY_RESULTS_BASE64 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download exact-SHA evidence APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dns-ipv6-killswitch-evidence-apks
          path: ${{ runner.temp }}/evidence-apks

      # Provides the `android` CLI that start-android-emulator.sh drives, plus the
      # SDK baseline. Nothing is compiled here -- the APKs are prebuilt -- so the
      # caches are read-only and nothing is saved.
      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-android
          rust-cache-save: "false"
          gradle-cache-read-only: "true"

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant packet capture to the unprivileged collector
        run: |
          # The collector is an allowlisted producer and must never invoke sudo
          # itself; granting the capability here keeps privilege out of the
          # digest-pinned hook.
          sudo setcap cap_net_raw,cap_net_admin+eip "$(command -v tcpdump)"
          tcpdump --version

      - name: Start local network fixture
        env:
          RIPDPI_FIXTURE_ANDROID_HOST: 10.0.2.2
          RIPDPI_FIXTURE_DNS_ANSWER_IPV4: 10.0.2.2
        run: |
          mkdir -p "$RUNNER_TEMP/local-network-fixture"
          scripts/ci/start-local-network-fixture.sh \
            "$RUNNER_TEMP/local-network-fixture/fixture.log" \
            "$RUNNER_TEMP/local-network-fixture/fixture-manifest.json" \
            "$RUNNER_TEMP/local-network-fixture/fixture.pid"

      - name: Provision evidence emulator
        run: |
          # google_apis, not google_apis_playstore: the client vantage captures
          # inside the guest and a Play image refuses `adb root`.
          bash scripts/ci/start-android-emulator.sh \
            --avd network-evidence \
            --api 34 \
            --arch x86_64 \
            --target google_apis \
            --boot-timeout 600
          bash scripts/ci/wait-for-android-package-manager.sh

      - name: Put adb on PATH for the capture hooks
        run: |
          # The emulator scripts resolve adb internally, but the workflow steps
          # and the collector/workload hooks invoke it directly. ADB is exported
          # as well as PATH: the hooks read that variable first and are exec'd
          # outside this shell.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          adb_bin="$sdk/platform-tools/adb"
          test -x "$adb_bin"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "ADB=$adb_bin" >> "$GITHUB_ENV"
          "$adb_bin" version

      - name: Install and measure the exact-SHA client
        run: |
          apk="$RUNNER_TEMP/evidence-apks/client.apk"
          test_apk="$RUNNER_TEMP/evidence-apks/test.apk"
          test -f "$apk" && test -f "$test_apk"
          adb -s "$ANDROID_SERIAL" install -r -d "$apk"
          adb -s "$ANDROID_SERIAL" install -r -d "$test_apk"
          remote_apk="$(adb -s "$ANDROID_SERIAL" shell pm path com.poyka.ripdpi | sed -n 's/^package://p' | tr -d '\r')"
          test -n "$remote_apk"
          adb -s "$ANDROID_SERIAL" pull "$remote_apk" "$RUNNER_TEMP/installed-ripdpi.apk" >/dev/null
          cmp -s "$apk" "$RUNNER_TEMP/installed-ripdpi.apk"
          remote_test_apk="$(adb -s "$ANDROID_SERIAL" shell pm path com.poyka.ripdpi.test | sed -n 's/^package://p' | tr -d '\r')"
          test -n "$remote_test_apk"
          adb -s "$ANDROID_SERIAL" pull "$remote_test_apk" "$RUNNER_TEMP/installed-ripdpi-test.apk" >/dev/null
          cmp -s "$test_apk" "$RUNNER_TEMP/installed-ripdpi-test.apk"
          {
            echo "CLIENT_ARTIFACT_PATH=$apk"
            echo "TEST_ARTIFACT_PATH=$test_apk"
            echo "CLIENT_ARTIFACT_SHA256=$(sha256sum "$apk" | cut -d' ' -f1)"
            echo "TEST_ARTIFACT_SHA256=$(sha256sum "$test_apk" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Materialize the private runner config
        run: |
          umask 077
          config_path="$(python3 test-lab/scripts/write-emulator-evidence-runner-config.py \
            --directory "$RUNNER_TEMP/evidence-runner")"
          echo "EVIDENCE_CONFIG=$config_path" >> "$GITHUB_ENV"

      - name: Capture client and external-observer evidence
        env:
          # Hook logs only. The raw captures beside them hold addresses and
          # payloads and stay in the private scratch, which is always deleted.
          RIPDPI_EVIDENCE_DIAGNOSTICS_DIR: ${{ runner.temp }}/evidence-diagnostics
        run: |
          test-lab/scripts/run-dual-vantage-network-evidence.sh \
            --config "$EVIDENCE_CONFIG" \
            --output-dir "$RUNNER_TEMP/$EVIDENCE_OUTPUT_NAME" \
            --source-sha "$GITHUB_SHA" \
            --client-artifact "$CLIENT_ARTIFACT_PATH" \
            --test-artifact "$TEST_ARTIFACT_PATH" \
            --applies-to android-client-release

      - name: Reconfirm installed client after capture
        run: |
          remote_apk="$(adb -s "$ANDROID_SERIAL" shell pm path com.poyka.ripdpi | sed -n 's/^package://p' | tr -d '\r')"
          adb -s "$ANDROID_SERIAL" pull "$remote_apk" "$RUNNER_TEMP/post-capture-ripdpi.apk" >/dev/null
          test "$(sha256sum "$RUNNER_TEMP/post-capture-ripdpi.apk" | cut -d' ' -f1)" = "$CLIENT_ARTIFACT_SHA256"

      - name: Validate exact-SHA dual-vantage bundle
        run: |
          python3 scripts/ci/network_evidence_manifest.py validate \
            --manifest "$RUNNER_TEMP/$EVIDENCE_OUTPUT_NAME/manifest.json" \
            --artifact-root "$RUNNER_TEMP/$EVIDENCE_OUTPUT_NAME" \
            --applies-to android-client-release \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-execution-kind github-actions \
            --expected-execution-id "$GITHUB_RUN_ID" \
            --expected-execution-attempt "$GITHUB_RUN_ATTEMPT" \
            --require-pass

      - name: Report gates left without evidence
        if: always()
        run: |
          # Nine selectors are still unimplemented, so this lane cannot yet reach
          # an all-PASS manifest and --require-pass above will fail the job. That
          # is the intended state: a red job names the missing coverage, while a
          # green one would be read as proof the gates hold.
          find "${RUNNER_TEMP:?}" -name skipped-gates.json -exec cat {} + || true

      - name: Attach and validate source-owned ordinary results
        run: |
          test -n "$ORDINARY_RESULTS_BASE64"
          evidence_dir="$RUNNER_TEMP/$EVIDENCE_OUTPUT_NAME"
          results="$evidence_dir/ordinary-results.json"
          umask 077
          printf '%s' "$ORDINARY_RESULTS_BASE64" | base64 --decode > "$results"
          python3 scripts/ci/check_dns_ipv6_killswitch_gates.py \
            --results "$results" \
            --evidence-manifest "$evidence_dir/manifest.json" \
            --applies-to android-client-release \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-evidence-run-id "$GITHUB_RUN_ID" \
            --expected-evidence-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Publish validated redacted release evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dns-ipv6-killswitch-release-evidence
          path: ${{ runner.temp }}/${{ env.EVIDENCE_OUTPUT_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish capture diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dns-ipv6-killswitch-emulator-diagnostics
          path: |
            ${{ runner.temp }}/local-network-fixture/fixture.log
            ${{ runner.temp }}/evidence-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local network fixture
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/local-network-fixture/fixture.pid"
          if [ -f "$pid_file" ]; then kill "$(cat "$pid_file")" || true; fi

