name: Mutation Testing

on:
  schedule:
    - cron: "29 6 * * 1" # Weekly on Monday at 06:29 UTC
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package list; each workspace runs only matching packages (empty = all enabled)"
        required: false
        default: ""
      in_diff:
        description: "Only mutate lines changed vs main (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.96.0"

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-nextest,cargo-mutants

      - name: Install act build prerequisites
        if: env.ACT == 'true'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build pkg-config build-essential libclang-dev

      # Scheduled runs rotate the whole workspace over four weeks. Manual
      # dispatches retain the full-workspace default unless packages are chosen.
      - name: Resolve mutation scope
        id: mutation-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            week="$(date -u +%V)"
            {
              echo "shard-count=4"
              echo "shard-index=$((10#$week % 4))"
              echo "label=weekly-${week}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "shard-count=1"
              echo "shard-index=0"
              echo "label=manual"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Run mutation testing
        env:
          MUTANTS_PACKAGES: ${{ github.event.inputs.packages || '' }}
          MUTANTS_SHARD_COUNT: ${{ steps.mutation-scope.outputs.shard-count }}
          MUTANTS_SHARD_INDEX: ${{ steps.mutation-scope.outputs.shard-index }}
          RIPDPI_REPO_ROOT: ${{ github.workspace }}
        run: |
          extra_args=()
          if [ "${{ github.event.inputs.in_diff || 'false' }}" = "true" ]; then
            extra_args+=(--in-diff "git diff origin/main...HEAD")
          fi
          bash scripts/ci/run-rust-mutants.sh "${extra_args[@]}"

      - name: Upload mutation results
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-output-${{ steps.mutation-scope.outputs.label }}
          path: target/mutants-output/
          retention-days: 14
