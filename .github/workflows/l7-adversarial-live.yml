name: L7 adversarial live smoke

on:
  pull_request:
    paths:
      - "test-lab/chaos/tspu/**"
      - "scripts/ci/run-l7-adversarial-live-smoke.sh"
      - "scripts/ci/run-tspu-live-smoke.sh"
      - ".github/workflows/l7-adversarial-live.yml"
  push:
    branches:
      - main
    paths:
      - "test-lab/chaos/tspu/**"
      - "scripts/ci/run-l7-adversarial-live-smoke.sh"
      - "scripts/ci/run-tspu-live-smoke.sh"
      - ".github/workflows/l7-adversarial-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install nftables and NetfilterQueue bindings
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libnetfilter-queue-dev \
            nftables \
            pkg-config \
            python3-dev
          python -m pip install --upgrade pip
          python -m pip install NetfilterQueue

      - name: Run L7 adversarial live smoke
        env:
          RIPDPI_L7_ADVERSARIAL_LIVE_ARTIFACT_DIR: ${{ runner.temp }}/l7-adversarial-live
        run: bash scripts/ci/run-l7-adversarial-live-smoke.sh

      - name: Upload verdict report + handler logs
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: l7-adversarial-live-artifacts
          path: ${{ runner.temp }}/l7-adversarial-live
          retention-days: 14
