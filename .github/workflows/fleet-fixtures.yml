name: fleet-fixtures

# Gates the ripdpi-vpn-deploy fleet-compat golden-file suite on every PR that
# touches the client-side parsers/models it locks (subscription parser, relay
# model, routing model, AmneziaWG model), the fixtures themselves, or the
# regenerator + structural-drift tooling. CI checks out the exact pinned public
# deploy commit and feeds its real emitter synthetic Terraform/SOPS inputs,
# then runs the deploy validator and the app's production-parser golden suite.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "core/data/runtime-state/src/main/kotlin/com/poyka/ripdpi/data/subscription/**"
      - "core/data/runtime-state/src/main/kotlin/com/poyka/ripdpi/data/routing/**"
      - "core/data/runtime-state/src/main/kotlin/com/poyka/ripdpi/data/awg/**"
      - "core/data/runtime-state/src/main/kotlin/com/poyka/ripdpi/data/RelayPresetCatalog.kt"
      - "core/data/runtime-state/src/main/kotlin/com/poyka/ripdpi/data/RelayStores.kt"
      - "core/data/src/test/kotlin/com/poyka/ripdpi/data/FleetCompatGoldenFileTest.kt"
      - "core/data/src/test/kotlin/com/poyka/ripdpi/data/fleet/**"
      - "core/data/src/test/resources/fleet-fixtures/**"
      - "scripts/refresh-fleet-fixtures.sh"
      - "scripts/fleet-fixtures/**"
      - "scripts/ci/check_fleet_fixtures.py"
      - "scripts/tests/test_fleet_fixtures.py"
      - ".github/workflows/fleet-fixtures.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fleet-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read exact deployer pin
        id: deployer-pin
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '[:space:]' < scripts/fleet-fixtures/deployer-git-sha.txt)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ || "$sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "invalid ripdpi-vpn-deploy commit pin" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out pinned ripdpi-vpn-deploy emitter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: po4yka/ripdpi-vpn-deploy
          ref: ${{ steps.deployer-pin.outputs.sha }}
          path: .fleet-deployer
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned emitter contract dependencies
        run: python3 -m pip install jsonschema==4.26.0 PyYAML==6.0.3

      - name: Run fleet-fixtures structural drift tests
        run: python3 -m unittest scripts.tests.test_fleet_fixtures

      - name: Run fleet-fixtures structural drift gate
        run: python3 scripts/ci/check_fleet_fixtures.py

      - name: Materialize and deploy-validate pinned fleet bundles
        env:
          RIPDPI_VPN_DEPLOY_DIR: ${{ github.workspace }}/.fleet-deployer
        run: |
          scripts/refresh-fleet-fixtures.sh --write
          git diff --exit-code -- core/data/src/test/resources/fleet-fixtures

      - uses: ./.github/actions/setup-android-rust
        with:
          java-version: "21"
          rust-components: ""
          rust-targets: ""
          rust-cache-shared-key: rust-fleet-fixtures
          rust-cache-save: "false"
          setup-rust: "false"
          setup-android-ndk: "false"
          gradle-cache-read-only: "true"

      - name: Parse materialized fleet bundles through the app contract
        run: >-
          ./gradlew :core:data:testDebugUnitTest
          --tests "*FleetCompat*"
          -Pripdpi.skipNativeBuild=true
