name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-exact-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_RUN_ID: ${{ vars.RIPDPI_RELEASE_CANDIDATE_RUN_ID }}
      RELEASE_ASSURANCE_PROFILE: ${{ vars.RIPDPI_RELEASE_ASSURANCE_PROFILE || 'artifact-publish' }}
      RELEASE_WAIVERS: ${{ vars.RIPDPI_RELEASE_WAIVERS || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Verify immutable release tag and version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/ci/verify_remote_release_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --expected-sha "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          ./gradlew :app:verifyReleaseVersion -Pripdpi.skipNativeBuild=true

      - name: Require exact-SHA release candidate
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]

      - name: Verify release-candidate workflow provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          run_id = os.environ["CANDIDATE_RUN_ID"]
          response = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],
              check=True,
              capture_output=True,
              text=True,
          )
          run = json.loads(response.stdout)
          expected = {
              "conclusion": "success",
              "event": "workflow_dispatch",
              "head_sha": os.environ["GITHUB_SHA"],
              "path": ".github/workflows/release-candidate.yml",
          }
          for field, value in expected.items():
              if run.get(field) != value:
                  raise SystemExit(f"candidate run {field} does not match release")
          PY

      - name: Download exact immutable Android release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-candidate
          path: ${{ runner.temp }}/release-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}

      - name: Download candidate attestation receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-attestation
          path: ${{ runner.temp }}/candidate-attestation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}

      - name: Verify immutable candidate bytes
        run: |
          candidate="$RUNNER_TEMP/release-candidate"
          python3 scripts/ci/release_candidate_manifest.py verify \
            --directory "$candidate" \
            --manifest "$candidate/candidate-manifest.json" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-release-tag "$GITHUB_REF_NAME" \
            --expected-candidate-run-id "$CANDIDATE_RUN_ID"

      - name: Install pinned Syft
        run: |
          set -euo pipefail
          readonly syft_version=1.50.0
          readonly syft_sha256=bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl -fsSL \
            "https://github.com/anchore/syft/releases/download/v$syft_version/syft_${syft_version}_linux_amd64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$syft_sha256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/syft"
          tar -xzf "$archive" -C "$RUNNER_TEMP/syft" syft
          "$RUNNER_TEMP/syft/syft" version

      - name: Generate candidate-bound SBOMs
        run: |
          syft="$RUNNER_TEMP/syft/syft"
          "$syft" scan "dir:$RUNNER_TEMP/release-candidate" \
            --output "cyclonedx-json=$RUNNER_TEMP/android-bom.json"
          "$syft" scan dir:native/rust \
            --output "cyclonedx-json=$RUNNER_TEMP/rust-bom.json"

      - name: Stage and verify flat release bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/release-candidate"
          publish="$RUNNER_TEMP/release-publish"
          mkdir -p "$publish"
          python3 - "$candidate" "$publish" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          candidate = Path(sys.argv[1])
          publish = Path(sys.argv[2])
          manifest = json.loads((candidate / "candidate-manifest.json").read_text())
          for name, record in manifest["artifacts"].items():
              if record["publish"]:
                  shutil.copy2(candidate / name, publish / name)
          PY
          cp "$RUNNER_TEMP/android-bom.json" "$RUNNER_TEMP/rust-bom.json" "$publish/"
          cp "$candidate/candidate-manifest.json" "$publish/"
          cp "$RUNNER_TEMP/candidate-attestation/candidate-attestation.json" "$publish/"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > "$publish/release-notes.md"
          test -s "$publish/release-notes.md"
          waiver_args=()
          if [[ -n "$RELEASE_WAIVERS" ]]; then
            IFS=',' read -r -a waiver_values <<< "$RELEASE_WAIVERS"
            for waiver in "${waiver_values[@]}"; do
              [[ "$waiver" =~ ^[A-Za-z0-9_.:-]+$ ]]
              waiver_args+=(--waiver "$waiver")
            done
          fi
          python3 scripts/ci/release_dossier.py \
            --publish-directory "$publish" \
            --candidate-manifest "$candidate/candidate-manifest.json" \
            --attestation-receipt "$RUNNER_TEMP/candidate-attestation/candidate-attestation.json" \
            --release-notes "$publish/release-notes.md" \
            --publish-run-id "$GITHUB_RUN_ID" \
            --assurance-profile "$RELEASE_ASSURANCE_PROFILE" \
            "${waiver_args[@]}" \
            --output "$publish/release-manifest.json"
          checksums="$RUNNER_TEMP/SHA256SUMS"
          (
            cd "$publish"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #'
          ) > "$checksums"
          mv "$checksums" "$publish/SHA256SUMS"
          (
            cd "$publish"
            sha256sum -c SHA256SUMS
          )

      - name: Upload exact release publish bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publish-bundle
          path: ${{ runner.temp }}/release-publish
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: prepare-exact-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified release publish bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-publish-bundle
          path: publish

      - id: publication-mode
        name: Reverify bundle, remote tag, and resumable draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd publish && sha256sum -c SHA256SUMS)
          python3 scripts/ci/verify_remote_release_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --expected-sha "$GITHUB_SHA"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,body > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --dir "$RUNNER_TEMP/existing-release"
            python3 scripts/ci/verify_release_draft.py \
              --metadata "$RUNNER_TEMP/release.json" \
              --expected-directory publish \
              --actual-directory "$RUNNER_TEMP/existing-release" \
              --release-notes publish/release-notes.md \
              --tag "$GITHUB_REF_NAME"
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub Release from exact candidate bytes
        if: steps.publication-mode.outputs.create == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: publish/*
          body_path: publish/release-notes.md

      - name: Verify complete draft and recheck remote tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_remote_release_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --expected-sha "$GITHUB_SHA"
          rm -rf "$RUNNER_TEMP/verified-release"
          mkdir -p "$RUNNER_TEMP/verified-release"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,body > "$RUNNER_TEMP/release.json"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/verified-release"
          python3 scripts/ci/verify_release_draft.py \
            --metadata "$RUNNER_TEMP/release.json" \
            --expected-directory publish \
            --actual-directory "$RUNNER_TEMP/verified-release" \
            --release-notes publish/release-notes.md \
            --tag "$GITHUB_REF_NAME"

      - name: Publish the fully uploaded draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Verify published release remains tag-bound
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_remote_release_tag.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --expected-sha "$GITHUB_SHA"
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
