name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-android
          rust-cache-save: "true"
          gradle-cache-read-only: "false"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore

      - name: Build release AAB (no ABI splits)
        env:
          RUSTC_WRAPPER: sccache
          RIPDPI_SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          RIPDPI_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RIPDPI_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RIPDPI_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease -Pripdpi.enableAbiSplits=false

      - name: Build release APK (per-ABI splits)
        env:
          RUSTC_WRAPPER: sccache
          RIPDPI_SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          RIPDPI_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RIPDPI_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RIPDPI_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Generate Rust SBOM
        run: |
          cargo install cargo-cyclonedx --quiet
          cd native/rust
          cargo cyclonedx --format json --output-pattern bom
          cp target/bom.json $GITHUB_WORKSPACE/rust-bom.json

      - name: Generate Android SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft packages dir:. --output cyclonedx-json=$GITHUB_WORKSPACE/android-bom.json

      - name: Generate SHA-256 checksums
        run: |
          cd $GITHUB_WORKSPACE
          sha256sum \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk \
            rust-bom.json \
            android-bom.json \
            > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            rust-bom.json
            android-bom.json
            checksums.txt

      - name: Upload release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload release retrace inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-retrace-inputs
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/intermediates/compose_mapping/release/compose-mapping.txt
          retention-days: 90

      - name: Upload release native symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-symbols
          path: app/build/intermediates/native_symbol_tables/release/extractReleaseNativeSymbolTables/out/**
          if-no-files-found: ignore
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            rust-bom.json
            android-bom.json
            checksums.txt
          generate_release_notes: true

      - name: Upload SBOMs and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-checksums
          path: |
            rust-bom.json
            android-bom.json
            checksums.txt
          retention-days: 90
