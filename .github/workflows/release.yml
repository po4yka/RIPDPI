name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: false
        default: "true"
        type: boolean
      gate_evidence_run_id:
        description: "Workflow run containing exact-SHA DNS/IPv6/kill-switch evidence"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_RUN_ID: ${{ inputs.gate_evidence_run_id || vars.DNS_IPV6_KILLSWITCH_EVIDENCE_RUN_ID }}
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Require DNS/IPv6/kill-switch evidence run
        run: test -n "$EVIDENCE_RUN_ID"

      - name: Verify DNS/IPv6/kill-switch evidence provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          run_id = os.environ["EVIDENCE_RUN_ID"]
          completed = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],
              check=True,
              capture_output=True,
              text=True,
          )
          run = json.loads(completed.stdout)
          expected = {
              "path": ".github/workflows/dns-ipv6-killswitch-evidence.yml",
              "head_sha": os.environ["EXPECTED_SHA"],
              "conclusion": "success",
          }
          for field, value in expected.items():
              if run.get(field) != value:
                  raise SystemExit(f"evidence run {field} does not match release")
          if run.get("event") not in {"workflow_dispatch", "schedule"}:
              raise SystemExit("evidence run event is not an approved capture trigger")
          attempt = run.get("run_attempt")
          if not isinstance(attempt, int) or attempt < 1:
              raise SystemExit("evidence run attempt is invalid")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"EVIDENCE_RUN_ATTEMPT={attempt}\n")
          PY

      - name: Download DNS/IPv6/kill-switch release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dns-ipv6-killswitch-release-evidence
          path: ${{ runner.temp }}/dns-ipv6-killswitch-release-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.EVIDENCE_RUN_ID }}

      - name: Enforce DNS/IPv6/kill-switch release evidence
        env:
          RIPDPI_DNS_IPV6_KILLSWITCH_RESULTS: ${{ vars.RIPDPI_DNS_IPV6_KILLSWITCH_RESULTS }}
        run: |
          results_path="${RIPDPI_DNS_IPV6_KILLSWITCH_RESULTS:-}"
          test -n "$results_path" || {
            echo "RIPDPI_DNS_IPV6_KILLSWITCH_RESULTS must name a real exact-SHA ordinary-results artifact" >&2
            exit 1
          }
          test -f "$results_path" || {
            echo "ordinary DNS/IPv6/kill-switch results artifact not found: $results_path" >&2
            exit 1
          }
          python3 scripts/ci/check_dns_ipv6_killswitch_gates.py \
            --results "$results_path" \
            --evidence-manifest "$RUNNER_TEMP/dns-ipv6-killswitch-release-evidence/manifest.json" \
            --applies-to android-client-release \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-evidence-run-id "$EVIDENCE_RUN_ID" \
            --expected-evidence-run-attempt "$EVIDENCE_RUN_ATTEMPT"

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-android
          rust-cache-save: "true"
          gradle-cache-read-only: "false"

      - name: Check owned-stack TLS fingerprint snapshot
        run: bash scripts/ci/check-owned-stack-tls-fingerprint.sh

      - name: Resolve release application IDs
        run: ./gradlew :app:writeReleaseIdentityManifest

      - name: Verify app identity review
        run: python3 scripts/ci/check_app_identity_review.py --report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: Verify release version
        run: ./gradlew :app:verifyReleaseVersion

      - name: Build Play release AAB
        env:
          RUSTC_WRAPPER: sccache
          RIPDPI_SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          RIPDPI_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RIPDPI_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RIPDPI_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlayFullRelease -Pripdpi.enableAbiSplits=false -Pripdpi.nativeAbiParallelism=1

      - name: Build F-Droid release APK
        env:
          RUSTC_WRAPPER: sccache
          RIPDPI_SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          RIPDPI_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RIPDPI_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RIPDPI_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFdroidFullRelease -Pripdpi.nativeAbiParallelism=1

      - name: Build GitHub release APK
        env:
          RUSTC_WRAPPER: sccache
          RIPDPI_SIGNING_STORE_FILE: ${{ github.workspace }}/release.keystore
          RIPDPI_SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RIPDPI_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RIPDPI_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleGithubFullRelease -Pripdpi.nativeAbiParallelism=1

      - name: Normalize F-Droid release APK names
        run: |
          scripts/ci/generate_update_metadata.py \
            --apk-glob "app/build/outputs/apk/fdroidFull/release/*.apk" \
            --output-metadata "app/build/outputs/apk/fdroidFull/release/output-metadata.json" \
            --gradle-properties "gradle.properties" \
            --package-name "com.poyka.ripdpi" \
            --artifact-prefix "app-fdroid-release" \
            --size-report "fdroid-apk-size-report.md"

      - name: Generate GitHub updater metadata
        run: |
          # ponytail: --max-abi-apk-size-mib 170 calibrated to actual per-ABI size
          # (v0.1.2 max 156.2 MiB; gate introduced post-v0.1.1, never validated at 140).
          # Real reduction is ABI-filtering the bundled Go PT asset binaries, which are
          # duplicated across every per-ABI APK because assets aren't ABI-split.
          scripts/ci/generate_update_metadata.py \
            --apk-glob "app/build/outputs/apk/githubFull/release/*.apk" \
            --output-metadata "app/build/outputs/apk/githubFull/release/output-metadata.json" \
            --gradle-properties "gradle.properties" \
            --package-name "com.poyka.ripdpi" \
            --artifact-prefix "app-github-release" \
            --update-json "update.json" \
            --sha256sums "SHA256SUMS" \
            --size-report "github-apk-size-report.md" \
            --max-abi-apk-size-mib 170

      - name: Install Syft
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh |
            sh -s -- -b /usr/local/bin

      - name: Generate Rust SBOM
        run: |
          set -euo pipefail
          syft packages dir:native/rust --output "cyclonedx-json=$GITHUB_WORKSPACE/rust-bom.json"

      - name: Generate Android SBOM
        run: |
          set -euo pipefail
          syft packages dir:. --output "cyclonedx-json=$GITHUB_WORKSPACE/android-bom.json"

      - name: Generate SHA-256 checksums
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum \
            app/build/outputs/bundle/playFullRelease/*.aab \
            app/build/outputs/apk/fdroidFull/release/*.apk \
            update.json \
            rust-bom.json \
            android-bom.json \
            >> SHA256SUMS
          cat SHA256SUMS

      - name: Package deterministic release native symbols
        run: |
          set -euo pipefail
          ndk_version="$(grep '^ripdpi.nativeNdkVersion=' gradle.properties | cut -d= -f2-)"
          readelf="$ANDROID_SDK_ROOT/ndk/$ndk_version/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          python3 scripts/ci/package_native_symbols.py \
            --symbols-dir core/engine/build/generated/nativeSymbols \
            --stripped-libs-dir core/engine/build/generated/jniLibs \
            --output-dir "$RUNNER_TEMP/release-native-symbols" \
            --readelf "$readelf"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            app/build/outputs/bundle/playFullRelease/*.aab
            app/build/outputs/apk/fdroidFull/release/*.apk
            app/build/outputs/apk/githubFull/release/*.apk
            update.json
            rust-bom.json
            android-bom.json
            SHA256SUMS
            github-apk-size-report.md
            fdroid-apk-size-report.md

      - name: Upload Play release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-release-aab
          path: app/build/outputs/bundle/playFullRelease/*.aab
          retention-days: 90

      - name: Upload F-Droid release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fdroid-release-apk
          path: app/build/outputs/apk/fdroidFull/release/*.apk
          retention-days: 90

      - name: Upload GitHub release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-release-apk
          path: app/build/outputs/apk/githubFull/release/*.apk
          retention-days: 90

      - name: Upload GitHub updater metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-update-metadata
          path: |
            update.json
            SHA256SUMS
            github-apk-size-report.md
            fdroid-apk-size-report.md
          retention-days: 90

      - name: Upload release retrace inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-retrace-inputs
          path: |
            app/build/outputs/mapping/*Release/mapping.txt
            app/build/intermediates/compose_mapping/*Release/compose-mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload release native symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-symbols
          path: |
            ${{ runner.temp }}/release-native-symbols/manifest.json
            ${{ runner.temp }}/release-native-symbols/release-native-symbols.zip
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            app/build/outputs/bundle/playFullRelease/*.aab
            app/build/outputs/apk/fdroidFull/release/*.apk
            app/build/outputs/apk/githubFull/release/*.apk
            update.json
            rust-bom.json
            android-bom.json
            SHA256SUMS
            github-apk-size-report.md
            fdroid-apk-size-report.md
          generate_release_notes: true

      - name: Upload SBOMs and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-checksums
          path: |
            rust-bom.json
            android-bom.json
            SHA256SUMS
            github-apk-size-report.md
            fdroid-apk-size-report.md
          retention-days: 90
