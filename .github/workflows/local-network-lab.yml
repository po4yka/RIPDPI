name: Local Network Lab

on:
  workflow_dispatch:
    inputs:
      run_vpn_emulator_lane:
        description: Document the full VPN-mode emulator lane in this run
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

concurrency:
  group: local-network-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lab-doctor:
    name: Lab script and Docker doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          find test-lab/scripts test-lab/chaos -type f -name '*.sh' -print0 |
            xargs -0 -n1 bash -n

      - name: Validate custom probe broadcast
        run: |
          set -euo pipefail
          command="$(
            ./test-lab/scripts/adb-run-probe.sh \
              --profile custom \
              --mode diagnostics \
              --host lab.example.test \
              --dns-server dns.example.test \
              --dns-port 1053 \
              --dns-hostname ok.test \
              --http-url http://lab.example.test:8080/get \
              --https-url https://lab.example.test:8443/ \
              --tcp-host tcp.example.test \
              --tcp-port 9000 \
              --udp-host udp.example.test \
              --udp-port 9001 \
              --relay-endpoint relay.example.test:10080 \
              --require-vpn-active false \
              --require-proxy-ready false \
              --print-broadcast
          )"
          printf '%s\n' "$command"
          grep -F -- "--es profile custom" <<<"$command"
          grep -F -- "--es dns_server dns.example.test" <<<"$command"
          grep -F -- "--es http_url http://lab.example.test:8080/get" <<<"$command"
          grep -F -- "--es tcp_host tcp.example.test" <<<"$command"
          grep -F -- "--es udp_host udp.example.test" <<<"$command"
          grep -F -- "--es relay_endpoint relay.example.test:10080" <<<"$command"
          grep -F -- "--ez require_vpn_active false" <<<"$command"
          grep -F -- "--ez require_proxy_ready false" <<<"$command"

      - name: Validate feature gap readiness preflight
        run: |
          set -euo pipefail
          test-lab/scripts/check-relay-matrix-config.sh \
            --config test-lab/relay/provider-matrix.example.json
          invalid_matrix="$RUNNER_TEMP/invalid-relay-matrix.json"
          printf '{"version":1,"relays":[]}\n' > "$invalid_matrix"
          if test-lab/scripts/check-relay-matrix-config.sh --config "$invalid_matrix"; then
            echo "Invalid relay matrix unexpectedly passed validation" >&2
            exit 1
          fi
          ./test-lab/scripts/check-feature-gap-readiness.sh \
            --output "$RUNNER_TEMP/feature-gap-readiness.json"
          jq -e '.checks[] | select(.name == "android_device")' \
            "$RUNNER_TEMP/feature-gap-readiness.json"
          jq -e '.checks[] | select(.name == "remote_workflow_confirmation")' \
            "$RUNNER_TEMP/feature-gap-readiness.json"
          RIPDPI_RELAY_MATRIX_CONFIG=test-lab/relay/provider-matrix.example.json \
            ./test-lab/scripts/check-feature-gap-readiness.sh \
              --output "$RUNNER_TEMP/feature-gap-readiness-with-relay.json"
          jq -e '.checks[] | select(.name == "production_relay_matrix" and .status == "manual")' \
            "$RUNNER_TEMP/feature-gap-readiness-with-relay.json"

      - name: Validate VPN E2E Maestro precondition
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/no-maestro-home"
          set +e
          HOME="$RUNNER_TEMP/no-maestro-home" \
            PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            ./test-lab/scripts/run-vpn-e2e.sh \
              --skip-start \
              --skip-install \
              --out-dir "$RUNNER_TEMP/ripdpi-missing-maestro-fast-fail" \
              >"$RUNNER_TEMP/ripdpi-missing-maestro-fast-fail.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ripdpi-missing-maestro-fast-fail.log"
          test "$status" -eq 2
          grep -q "maestro is not available; cannot drive the VPN connect flow" \
            "$RUNNER_TEMP/ripdpi-missing-maestro-fast-fail.log"

      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/local-network-lab.yml")'

      - name: Validate Docker Compose model
        run: docker compose -f test-lab/docker-compose.yml config

      - name: Start emulator-profile lab
        run: ./test-lab/scripts/start-lab.sh --profile emulator

      - name: Run host lab doctor checks
        run: |
          set -euo pipefail
          ./test-lab/scripts/doctor.sh
          ./test-lab/scripts/archive-artifacts.sh

      - name: Stop lab
        if: always()
        run: ./test-lab/scripts/stop-lab.sh

      - name: Upload test-lab artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-network-lab-artifacts
          path: test-lab/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  vpn-emulator-lane:
    name: VPN-mode emulator lane
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_vpn_emulator_lane }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate VPN E2E orchestrator
        run: bash -n test-lab/scripts/run-vpn-e2e.sh

      - name: Document manual execution
        run: |
          cat <<'MSG'
          Full VPN-mode E2E requires an Android emulator or attached device,
          ADB install access, and Maestro UI automation. Run it on a prepared
          host with:

            ./test-lab/scripts/run-vpn-e2e.sh --profile emulator

          The hosted nightly lane validates the Docker lab and script syntax;
          this workflow input records the heavier VPN lane as intentionally
          host-dependent rather than silently pretending to run it.
          MSG
