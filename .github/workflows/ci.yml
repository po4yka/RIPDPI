    if: >-
      !cancelled() &&
      needs.change-routing.outputs.run_full_ci == 'true' && ((github.event_name == 'schedule' && github.event.schedule == '19 4 * * 2') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_native_load == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true

      - name: Resolve load profile
        id: load-profile
        run: |
          profile="${{ github.event.inputs.soak_profile }}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            profile="full"
          elif [ -z "$profile" ]; then
            profile="smoke"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Run native Rust load test suites
        run: |
          mkdir -p "$RUNNER_TEMP/native-load-artifacts"
          RIPDPI_SOAK_PROFILE="${{ steps.load-profile.outputs.profile }}" \
            bash scripts/ci/run-rust-native-load.sh "$RUNNER_TEMP/native-load-artifacts" \
            2>&1 | tee "$RUNNER_TEMP/native-load-artifacts/rust-native-load.log"

      - name: Upload native load artifacts
