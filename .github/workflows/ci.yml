  linux-tun-e2e:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true') && ((github.event_name == 'schedule' && github.event.schedule == '27 4 * * 5') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-tun-e2e')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true

      - name: Install Linux TUN prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2
          sudo mkdir -p /dev/net
          if [ ! -c /dev/net/tun ]; then
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo chmod 0666 /dev/net/tun

      - name: Run Linux TUN E2E
        run: |
          sudo env \
            "PATH=$HOME/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" \
            "RIPDPI_RUN_TUN_E2E=1" \
            bash scripts/ci/run-linux-tun-e2e.sh

  so-bindtodevice-e2e:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true') && ((github.event_name == 'schedule' && github.event.schedule == '27 4 * * 5') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-tun-e2e')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true

      - name: Install physical TUN prerequisites
        id: so_bind_prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 util-linux
          sudo mkdir -p /dev/net
          if [ ! -c /dev/net/tun ]; then
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo chmod 0666 /dev/net/tun

      - name: Build SO_BINDTODEVICE adversarial E2E as runner user
        id: so_bind_build
        run: |
          test_binary="$(bash scripts/ci/build-so-bindtodevice-e2e.sh)"
          echo "test_binary=$test_binary" >> "$GITHUB_OUTPUT"

      - name: Run unprivileged SO_BINDTODEVICE adversarial E2E
        id: so_bind_runtime
        run: |
          evidence_dir="$RUNNER_TEMP/so-bindtodevice-evidence"
          mkdir -p "$evidence_dir"
          runtime_status=0
          sudo env \
            "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "RIPDPI_RUN_SO_BINDTODEVICE_E2E=1" \
            "RIPDPI_SO_BIND_TEST_BINARY=${{ steps.so_bind_build.outputs.test_binary }}" \
            "RIPDPI_SO_BIND_EVIDENCE_PATH=$evidence_dir/manifest.json" \
            "RIPDPI_EVIDENCE_SOURCE_SHA=$GITHUB_SHA" \
            "RIPDPI_EVIDENCE_RUN_ID=$GITHUB_RUN_ID" \
            "RIPDPI_EVIDENCE_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT" \
            bash scripts/ci/run-so-bindtodevice-e2e.sh || runtime_status=$?
          sudo chown -R "$(id -u):$(id -g)" "$evidence_dir"
          exit "$runtime_status"

      - name: Finalize classified SO_BINDTODEVICE evidence
        if: always()
        run: |
          python3 scripts/ci/check_so_bindtodevice_evidence.py \
            --manifest "$RUNNER_TEMP/so-bindtodevice-evidence/manifest.json" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --finalize-prerequisite-outcome "${{ steps.so_bind_prerequisites.outcome }}" \
            --finalize-build-outcome "${{ steps.so_bind_build.outcome }}" \
            --finalize-runtime-outcome "${{ steps.so_bind_runtime.outcome }}"

      - name: Validate redacted SO_BINDTODEVICE evidence as runner user
        if: always()
        run: |
          python3 scripts/ci/check_so_bindtodevice_evidence.py \
            --manifest "$RUNNER_TEMP/so-bindtodevice-evidence/manifest.json" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload redacted SO_BINDTODEVICE evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: so-bindtodevice-tun-evidence
          path: ${{ runner.temp }}/so-bindtodevice-evidence/manifest.json
          if-no-files-found: error
          retention-days: 30

  linux-tun-soak:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      needs.change-routing.outputs.run_full_ci == 'true' && ((github.event_name == 'schedule' && github.event.schedule == '19 4 * * 2') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true

      - name: Resolve soak profile
        id: tun-soak-profile
        run: |
          profile="${{ github.event.inputs.soak_profile }}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            profile="full"
          elif [ -z "$profile" ]; then
            profile="smoke"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Install Linux TUN prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2
          sudo mkdir -p /dev/net
          if [ ! -c /dev/net/tun ]; then
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo chmod 0666 /dev/net/tun

      - name: Run Linux TUN soak
        run: |
          mkdir -p "$RUNNER_TEMP/linux-tun-soak-artifacts"
          sudo env \
            "PATH=$HOME/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "CARGO_HOME=$HOME/.cargo" \
            "RUSTUP_HOME=$HOME/.rustup" \
            "RIPDPI_SOAK_PROFILE=${{ steps.tun-soak-profile.outputs.profile }}" \
            bash scripts/ci/run-linux-tun-soak.sh "$RUNNER_TEMP/linux-tun-soak-artifacts" \
            2>&1 | tee "$RUNNER_TEMP/linux-tun-soak-artifacts/linux-tun-soak.log"

      - name: Capture Linux route and interface state
        if: always()
        run: |
          ip route show > "$RUNNER_TEMP/linux-tun-soak-artifacts/ip-route.txt" || true
          ip link show > "$RUNNER_TEMP/linux-tun-soak-artifacts/ip-link.txt" || true

      - name: Upload Linux TUN soak artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-tun-soak-artifacts
          path: |
            ${{ runner.temp }}/linux-tun-soak-artifacts/
          retention-days: 7

  ci-required:
    name: ci-required
    if: always()
    needs:
      - change-routing
      - task-contracts
      - docs-only-gate
      - workflow-only-contracts
      - fixture-contracts
      - android-e2e-result-contracts
      - ci-preflight
      - design-md-lint
      - architecture-health
      - release-gates
      - rust-native-packaging
      - rust-native-x86_64
      - pluggable-transport-assets
      - owned-stack-tls-fingerprint
      - build-android-debug
      - build-android-tests
      - verify-roborazzi
      - release-verification
      - native-bloat
      - rust-miri
      - cargo-deny
      - cargo-deny-advisories
      - diagnostics-probes-facade
      - rust-lint
      - rust-cross-check
      - rust-workspace-tests
      - rust-fuzz-smoke
      - runtime-api-snapshot
      - gradle-static-analysis
      - rust-network-e2e
      - relay-interoperability
      - cli-packet-smoke
      - rust-turmoil
      - kotlin-coverage
      - rust-coverage
      - rust-criterion-bench
      - phase0-baseline
      - android-macrobenchmark
      - android-instrumented-tests
      - rust-loom
      - rust-native-soak
      - rust-native-load
      - nightly-kotlin-coverage
      - nightly-rust-coverage
      - android-network-e2e
      - android-journeys
      - android-relay-emulator-smoke
      - linux-tun-e2e
      - so-bindtodevice-e2e
      - linux-tun-soak
    runs-on: ubuntu-latest
    steps:
      - name: Enforce routed CI results
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROUTE: ${{ needs.change-routing.outputs.route }}
          RUN_FULL_CI: ${{ needs.change-routing.outputs.run_full_ci }}
          RUN_ANDROID_CI: ${{ needs.change-routing.outputs.run_android_ci }}
          RUN_RUST_NATIVE_CI: ${{ needs.change-routing.outputs.run_rust_native_ci }}
          RUN_FIXTURES_CI: ${{ needs.change-routing.outputs.run_fixtures_ci }}
          RUN_WORKFLOW_CI: ${{ needs.change-routing.outputs.run_workflow_ci }}
          RUN_KOTLIN_COVERAGE: ${{ needs.change-routing.outputs.run_kotlin_coverage }}
          RUN_RUST_COVERAGE: ${{ needs.change-routing.outputs.run_rust_coverage }}
          RUN_NIGHTLY_COVERAGE: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 4 * * 3') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_nightly_coverage == 'true') }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          results = {job: detail["result"] for job, detail in needs.items()}
          allowed_results = {"success", "skipped"}
          unexpected = {
              job: result for job, result in results.items() if result not in allowed_results
          }
          required_success = {
              "change-routing",
              "task-contracts",
              "android-e2e-result-contracts",
              "ci-preflight",
          }
          route = os.environ["ROUTE"]
          event_name = os.environ["EVENT_NAME"]
          run_nightly_coverage = os.environ["RUN_NIGHTLY_COVERAGE"] == "true"
          run_full_ci = os.environ["RUN_FULL_CI"] == "true"
          run_android_ci = os.environ["RUN_ANDROID_CI"] == "true"
          run_rust_native_ci = os.environ["RUN_RUST_NATIVE_CI"] == "true"

          if route == "documentation":
              required_success.add("docs-only-gate")
          elif event_name != "schedule" and (run_full_ci or run_android_ci or run_rust_native_ci):
              required_success.update(
                  {
                      "design-md-lint",
                      "architecture-health",
                      "release-gates",
                      "rust-native-packaging",
                      "rust-native-x86_64",
                      "pluggable-transport-assets",
                      "owned-stack-tls-fingerprint",
                      "release-verification",
                      "runtime-api-snapshot",
                  }
              )
              if run_full_ci or run_android_ci:
                  required_success.update(
                      {
                          "build-android-debug",
                          "build-android-tests",
                          "verify-roborazzi",
                          "gradle-static-analysis",
                          "android-instrumented-tests",
                      }
                  )
              if run_full_ci or run_rust_native_ci:
                  required_success.update(
                      {
                          "rust-miri",
                          "cargo-deny",
                          "diagnostics-probes-facade",
                          "rust-lint",
                          "rust-cross-check",
                          "rust-workspace-tests",
                          "rust-fuzz-smoke",
                          "rust-network-e2e",
                          "relay-interoperability",
                          "cli-packet-smoke",
                          "rust-turmoil",
                          "rust-loom",
                      }
                  )

          if run_full_ci or run_android_ci or run_rust_native_ci:
              required_success.add("runtime-api-snapshot")

          if event_name != "schedule" and not run_nightly_coverage:
              if os.environ["RUN_KOTLIN_COVERAGE"] == "true":
                  required_success.add("kotlin-coverage")
              if os.environ["RUN_RUST_COVERAGE"] == "true":
                  required_success.add("rust-coverage")

          if run_nightly_coverage:
              required_success.update(
                  {"nightly-kotlin-coverage", "nightly-rust-coverage"}
              )

          if os.environ["RUN_FIXTURES_CI"] == "true":
              required_success.add("fixture-contracts")
          if os.environ["RUN_WORKFLOW_CI"] == "true":
              required_success.add("workflow-only-contracts")

          missing = {
              job: results.get(job, "missing")
              for job in required_success
              if results.get(job) != "success"
          }
          skipped = sorted(job for job, result in results.items() if result == "skipped")
          if skipped:
              print("Accepted routed/skipped jobs: " + ", ".join(skipped))
          if unexpected or missing:
              if unexpected:
                  print("Unexpected CI results: " + json.dumps(unexpected, sort_keys=True))
              if missing:
                  print("Required CI jobs not successful: " + json.dumps(missing, sort_keys=True))
              sys.exit(1)
          print("All required CI jobs completed successfully.")
          PY
