name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      soak_profile:
        description: Native soak profile for manual runs
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      run_maestro_smoke:
        description: Run Maestro UI coverage flows after Android instrumentation
        required: false
        default: false
        type: boolean
      run_appium_smoke:
        description: Run Appium smoke tests after Android instrumentation
        required: false
        default: false
        type: boolean
      run_native_soak:
        description: Run native Rust soak suites
        required: false
        default: false
        type: boolean
      run_native_load:
        description: Run native Rust load suites
        required: false
        default: false
        type: boolean
      run_nightly_coverage:
        description: Run full nightly coverage flow
        required: false
        default: false
        type: boolean
      run_rust_criterion_bench:
        description: Run Rust criterion benchmarks
        required: false
        default: false
        type: boolean
      run_android_macrobenchmark:
        description: Run Android macrobenchmark suite
        required: false
        default: false
        type: boolean
      run_android_network_e2e:
        description: Run Android network E2E emulator suite
        required: false
        default: false
        type: boolean
      specialized_lanes:
        description: "Comma-separated opt-ins: criterion_baseline,phase0_baseline,android_journeys,android_relay_smoke"
        required: false
        default: ""
        type: string
  schedule:
    # Daily security signal; each expensive lane gets its own weekly window so
    # scheduled runs stay actionable instead of repeating the entire suite.
    - cron: "23 3 * * *"
    - cron: "7 4 * * 1" # Monday: Rust performance benchmarks
    - cron: "19 4 * * 2" # Tuesday: native endurance checks
    - cron: "43 4 * * 3" # Wednesday: coverage
    - cron: "11 4 * * 4" # Thursday: Android performance checks
    - cron: "27 4 * * 5" # Friday: relay and Linux network checks

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('ci-pr-{0}', github.event.pull_request.number)
      || github.event_name == 'push'
      && format('ci-push-{0}', github.ref)
      || format('ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  change-routing:
    name: Resolve CI change route
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.resolve.outputs.route }}
      docs_only: ${{ steps.resolve.outputs.docs_only }}
      run_full_ci: ${{ steps.resolve.outputs.run_full_ci }}
      run_android_ci: ${{ steps.resolve.outputs.run_android_ci }}
      run_rust_native_ci: ${{ steps.resolve.outputs.run_rust_native_ci }}
      run_kotlin_coverage: ${{ steps.resolve.outputs.run_kotlin_coverage }}
      run_rust_coverage: ${{ steps.resolve.outputs.run_rust_coverage }}
      run_fixtures_ci: ${{ steps.resolve.outputs.run_fixtures_ci }}
      run_workflow_ci: ${{ steps.resolve.outputs.run_workflow_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          paths_file="$RUNNER_TEMP/changed-files.txt"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            if ! git diff --name-only "$merge_base" "$PR_HEAD_SHA" > "$paths_file"; then
              : > "$paths_file"
            fi
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if ! git diff --name-only "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" > "$paths_file"; then
              : > "$paths_file"
            fi
          else
            : > "$paths_file"
          fi
          python3 scripts/ci/resolve_change_routing.py \
            --paths-file "$paths_file" \
            --github-output "$GITHUB_OUTPUT"

  docs-only-gate:
    name: Documentation-only CI gate
    needs: change-routing
    if: needs.change-routing.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Documentation-only change: heavy CI jobs intentionally skipped."'

  task-contracts:
    name: Task and OpenSpec contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/tasking/package-lock.json

      - name: Install pinned tasking tools
        run: npm ci --prefix tools/tasking --ignore-scripts

      - name: Run tasking contract tests
        run: |
          python3 -m unittest \
            scripts.tests.test_taskctl \
            scripts.tests.test_check_harness_links

      - name: Validate portfolio, mdtask, OpenSpec, and deletion history
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            args+=(--base "$PR_BASE_SHA")
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            args+=(--base "$PUSH_BEFORE_SHA")
          fi
          ./taskctl validate "${args[@]}"

  workflow-only-contracts:
    name: Workflow-only contract gate
    needs: change-routing
    if: needs.change-routing.outputs.run_workflow_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned workflow linters
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          go install github.com/suzuki-shunsuke/pinact/v4/cmd/pinact@v4.1.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflow syntax and action pins
        run: |
          actionlint .github/workflows/*.yml
          pinact run --fix=false --no-api \
            .github/workflows/*.yml \
            .github/actions/setup-android-rust/action.yml \
            .github/actions/upload-build-observability/action.yml

      - name: Validate workflow and release contracts
        run: |
          python3 -m unittest \
            scripts.tests.test_build_observability_contracts \
            scripts.tests.test_check_ci_preflight \
            scripts.tests.test_ci_native_dependency_graph \
            scripts.tests.test_ci_tool_pinning \
            scripts.tests.test_nightly_coverage_selection \
            scripts.tests.test_release_artifact_uploads \
            scripts.tests.test_release_candidate_manifest \
            scripts.tests.test_release_candidate_attempt \
            scripts.tests.test_candidate_attempt_tag_ruleset \
            scripts.tests.test_release_contract \
            scripts.tests.test_release_p0_contracts \
            scripts.tests.test_release_p1_contracts \
            scripts.tests.test_release_window \
            scripts.tests.test_release_preflight \
            scripts.tests.test_evidence_retention \
            scripts.tests.test_require_successful_ci_run \
            scripts.tests.test_path_filtered_pr_checks \
            scripts.tests.test_scheduled_workflow_offsets \
            scripts.tests.test_resolve_change_routing

  fixture-contracts:
    name: Fixture contract gate
    needs: change-routing
    if: needs.change-routing.outputs.run_fixtures_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository fixtures
        run: |
          python3 -m unittest \
            scripts.tests.test_fleet_fixtures \
            scripts.tests.test_netem_transaction \
            scripts.tests.test_phase16_matrix \
            scripts.tests.test_protocol_fixture_versions

  android-e2e-result-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Android E2E result contract tests
        run: |
          python3 -m unittest \
            scripts.tests.test_validate_android_junit_results \
            scripts.tests.test_android_device_session \
            scripts.tests.test_run_android_e2e_emulator \
            scripts.tests.test_start_local_network_fixture

  design-md-lint:
    needs: change-routing
    if: github.event_name != 'schedule' && (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Lint DESIGN.md
        run: npx --yes @google/design.md lint DESIGN.md

      - name: Run DESIGN.md drift check
        run: python3 scripts/ci/verify_design_md.py

      - name: Run DESIGN.md verifier unit tests
        run: python3 -m unittest scripts.tests.test_verify_design_md

  architecture-health:
    needs: change-routing
    if: github.event_name != 'schedule' && (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run architecture health unit tests
        run: python3 -m unittest scripts.tests.test_architecture_health

      - name: Run architecture health gate
        run: python3 scripts/ci/check_architecture_health.py --check

      - name: Run file LoC gate
        run: python3 scripts/ci/check_file_loc_limits.py

      - name: Run native architecture contract tests
        run: python3 scripts/ci/test_native_architecture_contracts.py

      - name: Run Linux TUN wrapper contract tests
        run: python3 -m unittest scripts.tests.test_linux_tun_wrappers

      - name: Run native architecture contracts
        run: python3 scripts/ci/check_native_architecture_contracts.py

      - name: Run native hotspot budgets
        run: python3 scripts/ci/check_native_hotspot_budgets.py

      - name: Upload architecture health reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-health-reports
          path: |
            build/reports/architecture/
            build/reports/file-loc-limits/
          retention-days: 7

  # Enforces the machine-readable release-gate policies under quality/release-gates/:
  #   - Per-release Android application-ID review against package-based VPN detection.
  #   - Fleet release-gating + cadence policy (daily/weekly/release cadences,
  #     staging/production/client-release gate sets, no-ship + warn-only policy).
  # Each check validates its policy artifact is well-formed and complete, and the
  # paired unit tests exercise the policy + result-evaluation logic. Wiring the
  # checks here makes a malformed or incomplete release-gate policy a CI failure.
  release-gates:
    needs: change-routing
    if: github.event_name != 'schedule' && (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned release-gate contract dependencies
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Run app identity review unit tests
        run: python3 -m unittest scripts.tests.test_app_identity_review

      - name: Run immutable release publication contract tests
        run: |
          python3 -m unittest \
            scripts.tests.test_release_p1_contracts \
            scripts.tests.test_evidence_retention \
            scripts.tests.test_release_window \
            scripts.tests.test_release_preflight

      - name: Validate fleet release-gate policy contract
        run: python3 scripts/ci/check_fleet_release_gates.py

      - name: Run fleet release-gating + cadence unit tests
        run: python3 -m unittest scripts.tests.test_fleet_release_gates

      - name: Run fleet release-gating + cadence policy check
        run: python3 scripts/ci/check_fleet_release_gates.py

      - name: Run cross-language runtime contract unit tests
        run: python3 -m unittest scripts.tests.test_cross_language_runtime_contracts

      - name: Run cross-language runtime contract policy check
        run: python3 scripts/ci/check_cross_language_runtime_contracts.py

      - name: Run REALITY BoringSSL hook vector guard unit tests
        run: python3 -m unittest scripts.tests.test_reality_boring_vector

      - name: Run REALITY BoringSSL hook vector guard
        run: python3 scripts/ci/check_reality_boring_vector.py

  ci-preflight:
    name: CI preflight barrier
    if: always()
    needs:
      - change-routing
      - task-contracts
      - docs-only-gate
      - workflow-only-contracts
      - fixture-contracts
      - android-e2e-result-contracts
      - design-md-lint
      - architecture-health
      - release-gates
      - cargo-deny
      - gradle-static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release expensive jobs after required gates pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROUTE: ${{ needs.change-routing.outputs.route }}
          RUN_FULL_CI: ${{ needs.change-routing.outputs.run_full_ci }}
          RUN_ANDROID_CI: ${{ needs.change-routing.outputs.run_android_ci }}
          RUN_RUST_NATIVE_CI: ${{ needs.change-routing.outputs.run_rust_native_ci }}
          RUN_FIXTURES_CI: ${{ needs.change-routing.outputs.run_fixtures_ci }}
          RUN_WORKFLOW_CI: ${{ needs.change-routing.outputs.run_workflow_ci }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_ci_preflight.py

  # Builds the non-x86_64 CI-default android-jni libraries + helpers. APK and
  # release consumers need the complete ABI set, while instrumented tests use
  # the separately-produced x86_64 shard below and can start sooner.
  rust-native-packaging:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        abi:
          - { name: arm64-v8a,   rust-target: aarch64-linux-android }
          - { name: armeabi-v7a, rust-target: armv7-linux-androideabi }
          - { name: x86,         rust-target: i686-linux-android }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-targets: ${{ matrix.abi.rust-target }}
          rust-cache-shared-key: rust-android-${{ matrix.abi.name }}
          rust-cache-workspaces: "native/rust -> ../../core/engine/build/intermediates/rust-native-libs"
          rust-cache-save: ${{ github.ref == 'refs/heads/main' }}
          gradle-cache-read-only: "true"

      - name: Build Rust native libraries + helper binaries for ${{ matrix.abi.name }}
        env:
          RUSTC_WRAPPER: sccache
        run: |
          ./gradlew \
            :core:engine:buildRustNativeLibs \
            :core:engine:buildRustRootHelper \
            :core:engine:buildRustNaiveProxy \
            :core:engine:buildRustCloudflareOrigin \
            --profile \
            -Pripdpi.nativeAbisOverride=${{ matrix.abi.name }}

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-native-${{ matrix.abi.name }}

      - name: Stage native artifacts for ${{ matrix.abi.name }}
        run: |
          set -euo pipefail
          stage_asset() {
            local source_dir="$1"
            local executable="$2"
            local destination_dir="$3"
            if [ ! -f "$source_dir/$executable" ]; then
              echo "::error::Native helper missing: $source_dir/$executable"
              exit 1
            fi
            cp -a "$source_dir/." "$destination_dir/"
            chmod 0755 "$destination_dir/$executable"
            if [ ! -x "$destination_dir/$executable" ]; then
              echo "::error::Staged native helper is not executable: $destination_dir/$executable"
              exit 1
            fi
          }

          mkdir -p "$RUNNER_TEMP/native-shard"
          if [ -d "core/engine/build/generated/jniLibs/${{ matrix.abi.name }}" ]; then
            cp -r "core/engine/build/generated/jniLibs/${{ matrix.abi.name }}" \
              "$RUNNER_TEMP/native-shard/jniLibs-${{ matrix.abi.name }}"
          else
            echo "::error::JNI lib outputs missing for ${{ matrix.abi.name }}"
            exit 1
          fi
          assets_dir="$RUNNER_TEMP/native-shard/assetsBin-${{ matrix.abi.name }}"
          mkdir -p "$assets_dir"
          stage_asset \
            "core/engine/build/generated/rootHelperAssets/bin/${{ matrix.abi.name }}" \
            "ripdpi-root-helper" "$assets_dir"
          stage_asset \
            "core/engine/build/generated/naiveProxyAssets/bin/${{ matrix.abi.name }}" \
            "ripdpi-naiveproxy" "$assets_dir"
          stage_asset \
            "core/engine/build/generated/cloudflareOriginAssets/bin/${{ matrix.abi.name }}" \
            "ripdpi-cloudflare-origin" "$assets_dir"
          ls -la "$RUNNER_TEMP/native-shard"

      - name: Upload native artifacts for ${{ matrix.abi.name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-shard-${{ matrix.abi.name }}
          path: ${{ runner.temp }}/native-shard/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload native symbol sidecar for ${{ matrix.abi.name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-symbols-${{ matrix.abi.name }}
          path: core/engine/build/generated/nativeSymbols/${{ matrix.abi.name }}/*.dbg
          if-no-files-found: error
          retention-days: 7

  # Produces the only shard required by the Android instrumented-test matrix.
  # Keeping it outside the packaging matrix removes the wait for arm/x86 jobs.
  rust-native-x86_64:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-targets: x86_64-linux-android
          rust-cache-shared-key: rust-android-x86_64
          rust-cache-workspaces: "native/rust -> ../../core/engine/build/intermediates/rust-native-libs"
          rust-cache-save: ${{ github.ref == 'refs/heads/main' }}
          gradle-cache-read-only: "true"

      - name: Build Rust native libraries + helper binaries for x86_64
        env:
          RUSTC_WRAPPER: sccache
        run: |
          ./gradlew \
            :core:engine:buildRustNativeLibs \
            :core:engine:buildRustRootHelper \
            :core:engine:buildRustNaiveProxy \
            :core:engine:buildRustCloudflareOrigin \
            --profile \
            -Pripdpi.nativeAbisOverride=x86_64

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-native-x86_64

      - name: Stage native artifacts for x86_64
        run: |
          set -euo pipefail
          stage_asset() {
            local source_dir="$1"
            local executable="$2"
            local destination_dir="$3"
            if [ ! -f "$source_dir/$executable" ]; then
              echo "::error::Native helper missing: $source_dir/$executable"
              exit 1
            fi
            cp -a "$source_dir/." "$destination_dir/"
            chmod 0755 "$destination_dir/$executable"
            if [ ! -x "$destination_dir/$executable" ]; then
              echo "::error::Staged native helper is not executable: $destination_dir/$executable"
              exit 1
            fi
          }

          mkdir -p "$RUNNER_TEMP/native-shard"
          if [ -d "core/engine/build/generated/jniLibs/x86_64" ]; then
            cp -r "core/engine/build/generated/jniLibs/x86_64" \
              "$RUNNER_TEMP/native-shard/jniLibs-x86_64"
          else
            echo "::error::JNI lib outputs missing for x86_64"
            exit 1
          fi
          assets_dir="$RUNNER_TEMP/native-shard/assetsBin-x86_64"
          mkdir -p "$assets_dir"
          stage_asset \
            "core/engine/build/generated/rootHelperAssets/bin/x86_64" \
            "ripdpi-root-helper" "$assets_dir"
          stage_asset \
            "core/engine/build/generated/naiveProxyAssets/bin/x86_64" \
            "ripdpi-naiveproxy" "$assets_dir"
          stage_asset \
            "core/engine/build/generated/cloudflareOriginAssets/bin/x86_64" \
            "ripdpi-cloudflare-origin" "$assets_dir"
          ls -la "$RUNNER_TEMP/native-shard"

      - name: Upload native artifacts for x86_64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-shard-x86_64
          path: ${{ runner.temp }}/native-shard/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload native symbol sidecar for x86_64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-symbols-x86_64
          path: core/engine/build/generated/nativeSymbols/x86_64/*.dbg
          if-no-files-found: error
          retention-days: 7

  # Builds the source-pinned WebTunnel, Lyrebird, and Cloudflared helpers once.
  # Android APK/test consumers receive this exact tree only after Gradle verifies
  # the producer's manifest digest and every launcher/upstream binary digest.
  pluggable-transport-assets:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true') &&
      (github.event_name != 'schedule' ||
      github.event.schedule == '11 4 * * 4' || github.event.schedule == '27 4 * * 5')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      manifest_sha256: ${{ steps.digest.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-pluggable-transport-assets
          rust-cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gradle-cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Build source-pinned pluggable transport assets
        env:
          RUSTC_WRAPPER: sccache
        run: >-
          ./gradlew :core:engine:buildPluggableTransportAssets
          --profile
          -Pripdpi.pluggableTransportAssetsMode=source
          -Pripdpi.pluggableTransportAssetsStrictFailures=true

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-pluggable-transports

      - name: Stage verified pluggable transport assets
        id: digest
        run: |
          set -euo pipefail
          source_root="core/engine/build/generated/pluggableTransportAssets"
          stage_root="$RUNNER_TEMP/pluggable-transport-assets"
          manifest="$source_root/metadata/pluggable-transports.json"
          test -f "$manifest"
          rm -rf "$stage_root"
          mkdir -p "$stage_root"
          cp -a "$source_root/." "$stage_root/"
          manifest_sha256="$(sha256sum "$stage_root/metadata/pluggable-transports.json" | awk '{print $1}')"
          test "${#manifest_sha256}" -eq 64
          tar -C "$stage_root" -czf "$RUNNER_TEMP/pluggable-transport-assets.tar.gz" .
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified pluggable transport assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pluggable-transport-assets
          path: ${{ runner.temp }}/pluggable-transport-assets.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Assembles each debug distribution in its own shard using prebuilt native
  # artifacts. The rust-native Gradle plugin copies these inputs instead of
  # running Cargo, so the shards can execute independently.
  build-android-debug:
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true')
    needs: [change-routing, rust-native-packaging, rust-native-x86_64, pluggable-transport-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { id: github, task: ':app:assembleGithubFullDebug' }
          - { id: fdroid, task: ':app:assembleFdroidFullDebug' }
          - { id: play, task: ':app:assemblePlayFullDebug' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          setup-rust: "false"
          setup-sccache: "false"
          setup-android-ndk: "false"
          gradle-cache-read-only: "true"

      - name: Download native shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-shard-*
          path: ${{ runner.temp }}/native-shards

      - name: Download verified pluggable transport assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluggable-transport-assets
          path: ${{ runner.temp }}/pluggable-transport-download

      - name: Extract verified pluggable transport assets
        run: |
          set -euo pipefail
          scripts/ci/extract-pluggable-transport-artifact.sh \
            "$RUNNER_TEMP/pluggable-transport-download/pluggable-transport-assets.tar.gz" \
            "$RUNNER_TEMP/prebuilt-pluggable-transport-assets"

      - name: Stage prebuilt native artifacts
        run: |
          set -euo pipefail
          jni_root="$RUNNER_TEMP/prebuilt/jniLibs"
          assets_root="$RUNNER_TEMP/prebuilt/assetsBin"
          mkdir -p "$jni_root" "$assets_root"
          for shard in "$RUNNER_TEMP/native-shards"/native-shard-*; do
            for d in "$shard"/jniLibs-*; do
              [ -d "$d" ] || continue
              abi="${d##*/jniLibs-}"
              cp -r "$d" "$jni_root/$abi"
            done
            for d in "$shard"/assetsBin-*; do
              [ -d "$d" ] || continue
              abi="${d##*/assetsBin-}"
              cp -r "$d" "$assets_root/$abi"
            done
          done
          echo "JNI staging:"
          ls -la "$jni_root" || true
          echo "Assets-bin staging:"
          ls -la "$assets_root" || true

      - name: Build ${{ matrix.shard.id }} debug APK with prebuilt natives
        run: |
          common_args=(
            --no-parallel
            --max-workers=2
            -Pripdpi.prebuiltJniLibsDir="$RUNNER_TEMP/prebuilt/jniLibs"
            -Pripdpi.prebuiltRootHelperDir="$RUNNER_TEMP/prebuilt/assetsBin"
            -Pripdpi.prebuiltNaiveProxyDir="$RUNNER_TEMP/prebuilt/assetsBin"
            -Pripdpi.prebuiltCloudflareOriginDir="$RUNNER_TEMP/prebuilt/assetsBin"
            -Pripdpi.prebuiltPluggableTransportAssetsDir="$RUNNER_TEMP/prebuilt-pluggable-transport-assets"
            -Pripdpi.prebuiltPluggableTransportAssetsManifestSha256="${{ needs.pluggable-transport-assets.outputs.manifest_sha256 }}"
          )
          ./gradlew "${{ matrix.shard.task }}" "${common_args[@]}" --profile

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-debug-${{ matrix.shard.id }}

      - name: Verify packaged native ELFs
        run: python3 scripts/ci/verify_native_elfs.py

      - name: Verify packaged native library sizes
        run: |
          mkdir -p "$RUNNER_TEMP/native-size-report"
          python3 scripts/ci/verify_native_sizes.py \
            --report-json "$RUNNER_TEMP/native-size-report/native-size-report.json" \
            --report-md "$RUNNER_TEMP/native-size-report/native-size-report.md"

      - name: Upload native size report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-size-report-debug-${{ matrix.shard.id }}
          path: ${{ runner.temp }}/native-size-report/*
          if-no-files-found: warn
          retention-days: 14

  # Runs JVM unit tests in parallel with the Rust matrix. Robolectric tests don't
  # load JNI libraries, so -Pripdpi.skipNativeBuild=true safely skips the entire
  # Rust dependency chain that preBuild normally pulls in.
  build-android-tests:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          java-version: "21"
          rust-components: ""
          rust-targets: ""
          rust-cache-shared-key: rust-android-tests
          rust-cache-save: "false"
          setup-rust: "false"
          setup-android-ndk: "false"
          gradle-cache-read-only: "true"
          embedded-relay-bundle-base64: ${{ secrets.RIPDPI_EMBEDDED_RELAY_BUNDLE_BASE64 }}

      - name: Run JVM unit tests
        run: >-
          ./gradlew testDebugUnitTest
          -x :app:testFdroidFullDebugUnitTest
          -x :app:testFdroidSimpleDebugUnitTest
          -x :app:testGithubFullDebugUnitTest
          -x :app:testGithubSimpleDebugUnitTest
          -x :app:testPlayFullDebugUnitTest
          -x :app:testPlaySimpleDebugUnitTest
          --profile
          -Pripdpi.skipNativeBuild=true

      - name: Run app unit tests
        run: >-
          ./gradlew
          :app:testGithubFullDebugUnitTest
          :app:testGithubSimpleDebugUnitTest
          --profile
          -Pripdpi.skipNativeBuild=true

      - name: Run release artifact upload contract tests
        run: |
          python3 -m unittest \
            scripts.tests.test_build_observability_contracts \
            scripts.tests.test_measure_native_abi_parallelism \
            scripts.tests.test_package_native_symbols \
            scripts.tests.test_release_artifact_uploads \
            scripts.tests.test_rust_native_task_layout \
            scripts.tests.test_verify_jni_readiness_mapping

      - name: Run nightly coverage selection contract tests
        run: python3 -m unittest scripts.tests.test_nightly_coverage_selection

      - name: Run UI audit generator unit tests
        run: |
          python3 -m pip install -r scripts/guide/requirements.txt
          python3 -m unittest scripts.tests.test_generate_guide

      - name: Run diagnostics boundary unit tests
        run: python3 -m unittest scripts.tests.test_verify_diagnostics_boundary

      - name: Verify diagnostics-service boundary
        run: python3 scripts/ci/verify_diagnostics_boundary.py

      - name: Run sync script unit tests
        run: python3 -m unittest discover -s scripts/tests -p "test_sync_*.py"

      - name: Run mutation wrapper unit test
        run: bash scripts/tests/test_run_rust_mutants.sh

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-android-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/golden-diffs/
          retention-days: 7

  # Roborazzi screenshot tests run in parallel; they don't load JNI either.
  verify-roborazzi:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          java-version: "21"
          rust-components: ""
          rust-targets: ""
          rust-cache-shared-key: rust-android-roborazzi
          rust-cache-save: "false"
          setup-rust: "false"
          setup-android-ndk: "false"
          gradle-cache-read-only: "true"
          embedded-relay-bundle-base64: ${{ secrets.RIPDPI_EMBEDDED_RELAY_BUNDLE_BASE64 }}

      - name: Verify screenshot baselines
        run: >-
          ./gradlew
          :app:verifyRoborazziGithubFullDebug
          :app:verifyRoborazziGithubSimpleDebug
          --profile
          -Pripdpi.skipNativeBuild=true
          -Pripdpi.includeRoborazziUnitTests=true
          --tests 'com.poyka.ripdpi.ui.screenshot.*'

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-roborazzi

      - name: Upload Roborazzi diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roborazzi-results
          path: |
            **/build/outputs/roborazzi/
          retention-days: 7

  owned-stack-tls-fingerprint:
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    needs: [change-routing, ci-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-targets: ""
          rust-cache-shared-key: rust-owned-stack-tls
          rust-cache-save: "false"
          setup-java: "false"
          setup-gradle: "false"
          skip-android-sdk-ndk: "true"
          setup-android-ndk: "false"

      - name: Check owned-stack TLS fingerprint snapshot
        run: bash scripts/ci/check-owned-stack-tls-fingerprint.sh

  release-verification:
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    needs: [change-routing, rust-native-packaging, rust-native-x86_64, owned-stack-tls-fingerprint, pluggable-transport-assets]
    runs-on: ubuntu-latest
    # Three two-build shards bound Kotlin heap use without serializing all six
    # variants in one runner. Stop Gradle between variants and emit each build
    # duration so shard sizing stays observable.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { id: fdroid, tasks: ':app:assembleFdroidFullRelease,:app:assembleFdroidSimpleRelease' }
          - { id: github, tasks: ':app:assembleGithubFullRelease,:app:assembleGithubSimpleRelease' }
          - { id: play, tasks: ':app:assemblePlayFullRelease,:app:assemblePlaySimpleRelease' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          setup-rust: "false"
          setup-sccache: "false"
          setup-android-ndk: ${{ matrix.shard.id == 'github' }}
          gradle-cache-read-only: "true"
          embedded-relay-bundle-base64: ${{ secrets.RIPDPI_EMBEDDED_RELAY_BUNDLE_BASE64 }}

      - name: Download native release shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-shard-*
          path: ${{ runner.temp }}/native-shards-release

      - name: Download verified pluggable transport assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluggable-transport-assets
          path: ${{ runner.temp }}/pluggable-transport-download

      - name: Extract verified pluggable transport assets
        run: |
          set -euo pipefail
          scripts/ci/extract-pluggable-transport-artifact.sh \
            "$RUNNER_TEMP/pluggable-transport-download/pluggable-transport-assets.tar.gz" \
            "$RUNNER_TEMP/prebuilt-pluggable-transport-assets"

      - name: Download native symbol sidecars
        if: matrix.shard.id == 'github'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-symbols-*
          path: ${{ runner.temp }}/native-symbols-release

      - name: Stage prebuilt release native artifacts
        run: |
          set -euo pipefail
          jni_root="$RUNNER_TEMP/prebuilt-release/jniLibs"
          assets_root="$RUNNER_TEMP/prebuilt-release/assetsBin"
          mkdir -p "$jni_root" "$assets_root"
          for shard in "$RUNNER_TEMP/native-shards-release"/native-shard-*; do
            for d in "$shard"/jniLibs-*; do
              [ -d "$d" ] || continue
              abi="${d##*/jniLibs-}"
              cp -r "$d" "$jni_root/$abi"
            done
            for d in "$shard"/assetsBin-*; do
              [ -d "$d" ] || continue
              abi="${d##*/assetsBin-}"
              cp -r "$d" "$assets_root/$abi"
            done
          done
          echo "JNI staging:"
          ls -la "$jni_root" || true
          echo "Assets-bin staging:"
          ls -la "$assets_root" || true

      - name: Verify ${{ matrix.shard.id }} release shard with prebuilt natives
        run: |
          common_args=(
            --max-workers=1
            -Pripdpi.enableAbiSplits=false
            -Pripdpi.nativeAbiParallelism=1
            -Pripdpi.prebuiltJniLibsDir="$RUNNER_TEMP/prebuilt-release/jniLibs"
            -Pripdpi.prebuiltRootHelperDir="$RUNNER_TEMP/prebuilt-release/assetsBin"
            -Pripdpi.prebuiltNaiveProxyDir="$RUNNER_TEMP/prebuilt-release/assetsBin"
            -Pripdpi.prebuiltCloudflareOriginDir="$RUNNER_TEMP/prebuilt-release/assetsBin"
            -Pripdpi.prebuiltPluggableTransportAssetsDir="$RUNNER_TEMP/prebuilt-pluggable-transport-assets"
            -Pripdpi.prebuiltPluggableTransportAssetsManifestSha256="${{ needs.pluggable-transport-assets.outputs.manifest_sha256 }}"
          )
          IFS=',' read -r -a release_tasks <<< "${{ matrix.shard.tasks }}"
          for task in "${release_tasks[@]}"; do
            started_at="$(date +%s)"
            ./gradlew "$task" "${common_args[@]}" --profile
            elapsed_seconds="$(( $(date +%s) - started_at ))"
            printf '### %s release build\n\nDuration: %ss\n' "$task" "$elapsed_seconds" >> "$GITHUB_STEP_SUMMARY"
            ./gradlew --stop
          done
          if [[ "${{ matrix.shard.id }}" == github ]]; then
            ./gradlew :app:assembleGithubFullReleaseAndroidTest \
              -Pripdpi.testBuildType=release \
              "${common_args[@]}" \
              --profile
            mapfile -t test_apks < <(find app/build/outputs/apk/androidTest -type f -name "*.apk")
            test "${#test_apks[@]}" -eq 1
            printf "### GitHub Full release instrumentation APK\n\nBuilt: %s\n" \
              "${test_apks[0]}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-release-${{ matrix.shard.id }}

      - name: Verify packaged release native ELFs
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r lib_dir; do
            found=1
            python3 scripts/ci/verify_native_elfs.py --lib-dir "$lib_dir"
          done < <(find app/build/intermediates/merged_native_libs -path '*/merge*ReleaseNativeLibs/out/lib' -type d | sort -u)
          if [[ "$found" -ne 1 ]]; then
            echo "error: no packaged release native library directories found" >&2
            exit 1
          fi

      - name: Verify JNI callback names in release mapping
        run: python3 scripts/ci/verify_jni_readiness_mapping.py

      - name: Package deterministic release native symbols
        if: matrix.shard.id == 'github'
        run: |
          set -euo pipefail
          symbols_root="$RUNNER_TEMP/release-symbol-inputs"
          mkdir -p "$symbols_root"
          for shard in "$RUNNER_TEMP/native-symbols-release"/native-symbols-*; do
            test -d "$shard"
            abi="${shard##*/native-symbols-}"
            mkdir -p "$symbols_root/$abi"
            cp "$shard"/*.dbg "$symbols_root/$abi/"
          done
          ndk_version="$(grep '^ripdpi.nativeNdkVersion=' gradle.properties | cut -d= -f2-)"
          readelf="$ANDROID_SDK_ROOT/ndk/$ndk_version/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$readelf"
          python3 scripts/ci/package_native_symbols.py \
            --symbols-dir "$symbols_root" \
            --stripped-libs-dir "$RUNNER_TEMP/prebuilt-release/jniLibs" \
            --output-dir "$RUNNER_TEMP/release-native-symbols" \
            --readelf "$readelf"

      - name: Upload release retrace inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-retrace-inputs-${{ matrix.shard.id }}
          path: |
            app/build/outputs/mapping/*Release/mapping.txt
            app/build/intermediates/compose_mapping/*Release/compose-mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload release native symbols
        if: matrix.shard.id == 'github'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-symbols
          path: |
            ${{ runner.temp }}/release-native-symbols/manifest.json
            ${{ runner.temp }}/release-native-symbols/release-native-symbols.zip
          if-no-files-found: error
          retention-days: 7

  native-bloat:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true') &&
      github.event_name != 'schedule' &&
      (
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'run-heavy-ci') ||
        contains(github.event.pull_request.labels.*.name, 'run-native-bloat')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-android
          rust-cache-save: "false"
          setup-java: "false"
          setup-gradle: "false"

      - name: Install cargo-bloat
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-bloat

      - name: Verify representative native bloat hotspots
        run: |
          mkdir -p "$RUNNER_TEMP/native-bloat-report"
          python3 scripts/ci/verify_native_bloat.py \
            --report-json "$RUNNER_TEMP/native-bloat-report/native-bloat-report.json" \
            --report-md "$RUNNER_TEMP/native-bloat-report/native-bloat-report.md"

      - name: Upload native bloat attribution report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-bloat-report
          path: ${{ runner.temp }}/native-bloat-report/*
          if-no-files-found: warn
          retention-days: 14

      - name: Dump current native bloat baseline (on failure)
        if: failure()
        run: |
          if ! python3 scripts/ci/verify_native_bloat.py --dump-current > /tmp/native-bloat-baseline.json; then
            printf '%s\n' '{' \
              '  "error": "verify_native_bloat.py --dump-current failed; see job log for compiler output"' \
              '}' > /tmp/native-bloat-baseline.json
          fi

      - name: Upload native bloat baseline (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-bloat-baseline
          path: /tmp/native-bloat-baseline.json
          if-no-files-found: warn
          retention-days: 14

  rust-miri:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly
          components: miri,rust-src

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          shared-key: rust-miri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run targeted Miri smoke
        run: bash scripts/ci/run-rust-miri.sh

  cargo-deny:
    needs: change-routing
    if: github.event_name != 'schedule' && (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny@0.19.8

      - name: Validate advisory waiver governance
        run: python3 scripts/ci/check_rust_advisory_waivers.py

      - name: Run cargo-deny
        run: cargo deny --locked --manifest-path native/rust/Cargo.toml check

  cargo-deny-advisories:
    # Daily re-scan of the RustSec advisory DB against the pinned Cargo.lock, so
    # advisories published AFTER a PR merges (e.g. against russh's RC crypto stack,
    # see native/rust/deny.toml) surface on main without waiting for an unrelated PR.
    # The PR/push cargo-deny job above already runs advisories as part of `check`;
    # this job adds the time-based re-scan that a code-change-triggered gate cannot.
    needs: change-routing
    if: github.event_name == 'schedule' && github.event.schedule == '23 3 * * *' && needs.change-routing.outputs.run_full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny@0.19.8

      - name: Validate advisory waiver governance
        run: python3 scripts/ci/check_rust_advisory_waivers.py

      - name: Run cargo-deny advisories
        run: cargo deny --locked --manifest-path native/rust/Cargo.toml check advisories

  diagnostics-probes-facade:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          shared-key: diagnostics-probes-facade
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      # The compat-facade feature is default-on; the diagnostics-probes crate
      # must compile with it OFF (root exports unconditional) and ON.
      - name: Check ripdpi-diagnostics-probes (compat-facade OFF)
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check --manifest-path native/rust/Cargo.toml -p ripdpi-diagnostics-probes --no-default-features --locked

      - name: Check ripdpi-diagnostics-probes (compat-facade ON)
        env:
          RUSTC_WRAPPER: sccache
        run: cargo check --manifest-path native/rust/Cargo.toml -p ripdpi-diagnostics-probes --no-default-features --features compat-facade --locked

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-diagnostics-probes

  rust-lint:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          shared-key: rust-host
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      - name: Run Rust lint checks
        env:
          RUSTC_WRAPPER: sccache
        run: bash scripts/ci/run-rust-lint.sh

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-rust-lint

  rust-cross-check:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-cross-check
          rust-cache-save: ${{ github.ref == 'refs/heads/main' }}
          setup-java: "false"
          setup-gradle: "false"

      - name: Run Android ABI cross-compilation checks
        env:
          RUSTC_WRAPPER: sccache
        run: bash scripts/ci/run-rust-cross-check.sh

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-rust-cross-check

  rust-workspace-tests:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          shared-key: rust-host
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest

      - name: Run Rust workspace tests and architecture checks
        env:
          RUSTC_WRAPPER: sccache
        run: bash scripts/ci/run-rust-workspace-tests.sh

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-rust-workspace-tests

      - name: Upload Rust analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-workspace-tests-reports
          path: native/rust/target/golden-diffs/
          retention-days: 7

  rust-fuzz-smoke:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: |
            native/rust -> target
            native/rust/fuzz -> target
          cache-on-failure: true
          shared-key: rust-fuzz-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-fuzz

      - name: Run fuzz smoke check
        run: bash scripts/ci/run-rust-fuzz-smoke.sh

  runtime-api-snapshot:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    name: JNI API snapshot check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0" # Keep in sync with native/rust/rust-toolchain.toml
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          shared-key: rust-api-snapshot
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install rustdoc JSON toolchain for cargo-public-api
        run: rustup toolchain install nightly --profile minimal --no-self-update
      - name: Install cargo-public-api
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-public-api@0.52.0
      - name: Check Rust public API snapshots
        run: |
          python3 scripts/ci/test_rust_api_snapshots.py
          python3 scripts/ci/check_rust_api_snapshots.py

  gradle-static-analysis:
    needs: change-routing
    if: github.event_name != 'schedule' && (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fail if baseline files modified
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E 'baseline' | grep -v '^#'; then
            echo "error: baseline files must not be modified in PRs — fix violations in code"
            exit 1
          fi

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-android
          rust-cache-save: "false"
          setup-rust: "false"
          setup-android-ndk: "false"
          gradle-cache-read-only: "true"

      - name: Resolve release application IDs
        run: ./gradlew :app:writeReleaseIdentityManifest --profile

      - name: Run app identity release gate
        run: python3 scripts/ci/check_app_identity_review.py

      - name: Run static analysis
        run: ./gradlew staticAnalysis --profile -Pripdpi.skipNativeBuild=true

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-gradle-static-analysis

      - name: Upload Gradle analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-static-analysis-reports
          path: |
            **/build/reports/detekt/
            build/reports/file-loc-limits/
            **/build/reports/ktlint/
            **/build/reports/lint-results*.html
          retention-days: 7

  rust-network-e2e:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          shared-key: rust-network-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest

      - name: Run repo-owned Rust network E2E
        run: bash scripts/ci/run-rust-network-e2e.sh

  relay-interoperability:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          shared-key: relay-interoperability
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest

      - name: Run relay interoperability suite
        run: bash scripts/ci/run-rust-relay-interoperability.sh

  cli-packet-smoke:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true

      - name: Install CLI packet capture tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cmake libclang-dev tcpdump tshark
          sudo setcap cap_net_raw,cap_net_admin=eip "$(command -v tcpdump)"

      - name: Run CLI packet smoke matrix
        run: bash scripts/ci/run-cli-packet-smoke.sh

      - name: Upload CLI packet smoke artifacts
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-packet-smoke
          path: build/packet-smoke/cli/**
          retention-days: 7

  rust-turmoil:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          shared-key: rust-turmoil
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-nextest

      - name: Run turmoil-backed deterministic network tests
        run: bash scripts/ci/run-rust-turmoil-tests.sh

  kotlin-coverage:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      needs.change-routing.outputs.run_kotlin_coverage == 'true' &&
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.run_nightly_coverage != 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          java-version: "21"
          rust-components: ""
          rust-cache-save: "false"
          rust-targets: ""
          setup-rust: "false"
          setup-android-ndk: "false"
          setup-sccache: "false"
          # Kotlin coverage is the sole Gradle build-cache writer on main. Every other
          # job restores only, preventing a small parallel job from reserving
          # the immutable SHA key before the coverage graph can populate it.
          gradle-cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Generate Kotlin coverage reports
        run: ./gradlew coverageReport -Pripdpi.skipNativeBuild=true

      - name: Summarize Kotlin coverage
        run: |
          python3 scripts/ci/summarize_coverage.py \
            --aggregate-xml build/reports/jacoco/kotlinCoverageReport/kotlinCoverageReport.xml \
            --module "core:data=core/data/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml" \
            --module "core:diagnostics=core/diagnostics/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml" \
            --module "core:engine=core/engine/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml" \
            --module "core:service=core/service/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml" \
            --markdown-output "$RUNNER_TEMP/kotlin-coverage-summary.md"
          cat "$RUNNER_TEMP/kotlin-coverage-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Kotlin coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-coverage-artifacts
          path: |
            build/reports/jacoco/
            app/build/reports/jacoco/
            core/**/build/reports/jacoco/
            ${{ runner.temp }}/kotlin-coverage-summary.md
          retention-days: 7

  rust-coverage:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      needs.change-routing.outputs.run_rust_coverage == 'true' &&
      github.event_name != 'schedule' &&
      (
        github.event_name != 'workflow_dispatch' ||
        github.event.inputs.run_nightly_coverage != 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RIPDPI_ENFORCE_COVERAGE_THRESHOLDS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: llvm-tools
          rust-cache-shared-key: rust-coverage
          rust-cache-save: "false"
          rust-targets: ""
          setup-java: "false"
          setup-gradle: "false"
          skip-android-sdk-ndk: "true"
          setup-android-ndk: "false"
          setup-sccache: "false"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-llvm-cov

      - name: Generate Rust coverage reports
        run: bash scripts/ci/run-rust-coverage.sh

      - name: Publish Rust coverage summary
        run: |
          cat native/rust/target/coverage/metrics.env
          cat native/rust/target/coverage/summary.txt

      - name: Upload Rust coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-artifacts
          path: native/rust/target/coverage/
          retention-days: 7

  rust-criterion-bench:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true') &&
      ((github.event_name == 'schedule' && github.event.schedule == '7 4 * * 1') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_rust_criterion_bench == 'true') ||
      (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.specialized_lanes, 'criterion_baseline')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-bench')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          prefix-key: criterion

      - name: Restore criterion baseline from main
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/rust/target/criterion
          key: criterion-baseline-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            criterion-baseline-

      - name: Run criterion benchmarks
        run: |
          cd native/rust
          cargo bench --locked --package ripdpi-bench 2>&1 | tee "$RUNNER_TEMP/criterion-output.txt"

      # Advisory on PRs / manual dispatch: heterogeneous hardware should not hard-fail
      # on throughput noise, so warn only (full suite, baseline 10% threshold).
      - name: Check for regressions (advisory)
        if: github.event_name != 'schedule' && !contains(github.event.inputs.specialized_lanes, 'criterion_baseline')
        run: |
          python3 scripts/ci/check-criterion-regressions.py \
            --criterion-dir native/rust/target/criterion \
            --baseline scripts/ci/rust-bench-baseline.json \
            --warn-only \
            --markdown-output "$RUNNER_TEMP/criterion-summary.md"
          cat "$RUNNER_TEMP/criterion-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Enforced on the scheduled reference runner only: a >20% median regression in any
      # protocol-throughput transport fails the lane (DoD). Median (not mean) is gated so
      # the heavy-tailed slow samples on shared runners can't flap it. Scoped to
      # protocol-throughput/* so the noisier microbenches can't flap the gate; the
      # 20% threshold tolerates shared-runner noise while catching the 25% DoD target.
      # Until a reference-runner baseline lands the 7 protocol-throughput/* keys, this
      # is a safe no-op (missing keys -> "new benchmark" warning -> exit 0).
      # ws_tunnel_1MiB is excluded from the HARD gate: its 1 MiB full-duplex TLS echo
      # on a multi-thread tokio runtime is bound by the shared runner's vCPU count, not
      # the code -- identical code measures 1.75ms (fast box) to 11.5ms (shared CI), with
      # a ~+-35% 95% CI within a single run. It stays measured and visible in the advisory
      # lane below; only the pass/fail gate skips it. See the ws-tunnel variance analysis.
      - name: Check for regressions (enforced, scheduled)
        if: github.event_name == 'schedule'
        run: |
          python3 scripts/ci/check-criterion-regressions.py \
            --criterion-dir native/rust/target/criterion \
            --baseline scripts/ci/rust-bench-baseline.json \
            --only-prefix 'protocol-throughput/' \
            --exclude 'protocol-throughput/ws_tunnel_1MiB' \
            --max-regression-percent 20 \
            --markdown-output "$RUNNER_TEMP/criterion-summary.md"
          cat "$RUNNER_TEMP/criterion-summary.md" >> "$GITHUB_STEP_SUMMARY"

      # Manual capture of a fresh reference-runner baseline. Dumps the FULL result set
      # (all benches, not just protocol-throughput) and uploads it as a candidate
      # artifact for a human to review and commit to scripts/ci/rust-bench-baseline.json
      # via a normal reviewed PR -- never auto-committed (see golden-bless-discipline.md).
      - name: Capture criterion baseline candidate
        if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.specialized_lanes, 'criterion_baseline')
        run: |
          python3 scripts/ci/check-criterion-regressions.py \
            --criterion-dir native/rust/target/criterion \
            --dump-current \
            > "$RUNNER_TEMP/rust-bench-baseline.json"
          {
            echo "## Captured criterion baseline candidate"
            echo ""
            echo "Download the \`rust-bench-baseline-candidate\` artifact and commit it to"
            echo "\`scripts/ci/rust-bench-baseline.json\` via a reviewed PR to arm the nightly lane."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload criterion baseline candidate
        if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.specialized_lanes, 'criterion_baseline')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-bench-baseline-candidate
          path: ${{ runner.temp }}/rust-bench-baseline.json
          retention-days: 14

      - name: Save criterion baseline (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/rust/target/criterion
          key: criterion-baseline-${{ github.sha }}

      - name: Upload criterion artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-bench-artifacts
          path: |
            native/rust/target/criterion/
            ${{ runner.temp }}/criterion-output.txt
            ${{ runner.temp }}/criterion-summary.md
          retention-days: 7

  phase0-baseline:
    # This aggregates benchmarks, load, Android packaging, and bloat checks that
    # the recurring lanes already execute independently. Keep the composite
    # snapshot manual to avoid paying for the same native work twice per cycle.
    needs: [change-routing, pluggable-transport-assets]
    if: needs.change-routing.outputs.run_full_ci == 'true' && github.event_name == 'workflow_dispatch' && contains(github.event.inputs.specialized_lanes, 'phase0_baseline')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-cache-shared-key: rust-android
          rust-cache-save: "false"

      - name: Download verified pluggable transport assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluggable-transport-assets
          path: ${{ runner.temp }}/pluggable-transport-download

      - name: Extract verified pluggable transport assets
        run: |
          set -euo pipefail
          scripts/ci/extract-pluggable-transport-artifact.sh \
            "$RUNNER_TEMP/pluggable-transport-download/pluggable-transport-assets.tar.gz" \
            "$RUNNER_TEMP/prebuilt-pluggable-transport-assets"

      - name: Resolve baseline profile
        id: baseline-profile
        run: |
          profile="${{ github.event.inputs.soak_profile }}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            profile="smoke"
          elif [ -z "$profile" ]; then
            profile="smoke"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Capture full Phase 0 baseline snapshot
        env:
          RIPDPI_PREBUILT_PT_DIR: ${{ runner.temp }}/prebuilt-pluggable-transport-assets
          RIPDPI_PREBUILT_PT_MANIFEST_SHA256: ${{ needs.pluggable-transport-assets.outputs.manifest_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/phase0-baseline"
          RIPDPI_SOAK_PROFILE="${{ steps.baseline-profile.outputs.profile }}" \
            bash scripts/ci/run-phase0-baseline.sh "$RUNNER_TEMP/phase0-baseline" \
            2>&1 | tee "$RUNNER_TEMP/phase0-baseline/phase0-baseline.log"

      - name: Upload Phase 0 baseline artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase0-baseline-artifacts
          path: |
            ${{ runner.temp }}/phase0-baseline/
          retention-days: 14

  android-macrobenchmark:
    # Runs StartupBenchmark on a Gradle Managed Device. The :baselineprofile module
    # already tolerates emulator runs (androidx.benchmark.suppressErrors includes
    # EMULATOR) and the regression check is warn-only.
    needs: [change-routing, pluggable-transport-assets]
    if: needs.change-routing.outputs.run_full_ci == 'true' && ((github.event_name == 'schedule' && github.event.schedule == '11 4 * * 4') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_android_macrobenchmark == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-targets: x86_64-linux-android
          rust-cache-shared-key: rust-android
          rust-cache-save: "false"
          gradle-cache-read-only: "true"

      - name: Download verified pluggable transport assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluggable-transport-assets
          path: ${{ runner.temp }}/pluggable-transport-download

      - name: Extract verified pluggable transport assets
        run: |
          set -euo pipefail
          scripts/ci/extract-pluggable-transport-artifact.sh \
            "$RUNNER_TEMP/pluggable-transport-download/pluggable-transport-assets.tar.gz" \
            "$RUNNER_TEMP/prebuilt-pluggable-transport-assets"

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator and system image
        run: |
          android sdk install \
            "cmdline-tools/latest" \
            "emulator" \
            "system-images/android-34/aosp_atd/x86_64"

      - name: Run macrobenchmarks on managed device
        env:
          RUSTC_WRAPPER: sccache
        run: |
          ./gradlew :baselineprofile:pixel6Api34AtdDebugAndroidTest \
            -Pripdpi.nativeAbisOverride=x86_64 \
            -Pripdpi.prebuiltPluggableTransportAssetsDir="$RUNNER_TEMP/prebuilt-pluggable-transport-assets" \
            -Pripdpi.prebuiltPluggableTransportAssetsManifestSha256="${{ needs.pluggable-transport-assets.outputs.manifest_sha256 }}" \
            -Pandroid.testInstrumentationRunnerArguments.class=com.poyka.ripdpi.baselineprofile.StartupBenchmark \
            --profile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-android-macrobenchmark

      - name: Check for regressions
        run: |
          python3 scripts/ci/check-macrobenchmark-regressions.py \
            --results-dir baselineprofile/build/outputs \
            --baseline scripts/ci/macrobenchmark-baseline.json \
            --warn-only \
            --markdown-output "$RUNNER_TEMP/macrobenchmark-summary.md"
          cat "$RUNNER_TEMP/macrobenchmark-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macrobenchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macrobenchmark-artifacts
          path: |
            baselineprofile/build/outputs/
            baselineprofile/build/reports/androidTests/
            ${{ runner.temp }}/macrobenchmark-summary.md
          retention-days: 7

  # Runs :app instrumented smoke tests across minSdk, modern-runtime, and targetSdk x86_64 emulators.
  # The dedicated x86_64 native shard is staged via
  # -Pripdpi.prebuilt*Dir so cargo is skipped.
  android-instrumented-tests:
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true')
    needs: [change-routing, rust-native-x86_64, pluggable-transport-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: pixel6Api27Aosp
            api: 27
            system-image: default
          - device: pixel6Api33Atd
            api: 33
            system-image: aosp_atd
          - device: pixel6Api35Google
            api: 35
            system-image: google_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          setup-rust: "false"
          setup-sccache: "false"
          setup-android-ndk: "false"
          gradle-cache-read-only: "true"
          embedded-relay-bundle-base64: ${{ secrets.RIPDPI_EMBEDDED_RELAY_BUNDLE_BASE64 }}

      - name: Download x86_64 native shard
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-shard-x86_64
          path: ${{ runner.temp }}/native-shard-x86_64

      - name: Download verified pluggable transport assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluggable-transport-assets
          path: ${{ runner.temp }}/pluggable-transport-download

      - name: Extract verified pluggable transport assets
        run: |
          set -euo pipefail
          scripts/ci/extract-pluggable-transport-artifact.sh \
            "$RUNNER_TEMP/pluggable-transport-download/pluggable-transport-assets.tar.gz" \
            "$RUNNER_TEMP/prebuilt-pluggable-transport-assets"

      - name: Stage prebuilt x86_64 native artifacts
        run: |
          set -euo pipefail
          jni_root="$RUNNER_TEMP/prebuilt-integration/jniLibs"
          assets_root="$RUNNER_TEMP/prebuilt-integration/assetsBin"
          mkdir -p "$jni_root" "$assets_root"
          cp -r "$RUNNER_TEMP/native-shard-x86_64/jniLibs-x86_64" "$jni_root/x86_64"
          cp -r "$RUNNER_TEMP/native-shard-x86_64/assetsBin-x86_64" "$assets_root/x86_64"
          find "$RUNNER_TEMP/prebuilt-integration" -maxdepth 3 -type f -print

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Provision ${{ matrix.device }} emulator
        run: |
          bash scripts/ci/start-android-emulator.sh \
            --avd "${{ matrix.device }}" \
            --api "${{ matrix.api }}" \
            --arch x86_64 \
            --target "${{ matrix.system-image }}" \
            --boot-timeout 600

      - name: Run instrumented tests on ${{ matrix.device }}
        run: |
          rm -rf app/build/outputs/androidTest-results/connected/debug/flavors/githubFull
          ./gradlew :app:connectedGithubFullDebugAndroidTest \
            -Pripdpi.nativeAbisOverride=x86_64 \
            -Pripdpi.prebuiltJniLibsDir="$RUNNER_TEMP/prebuilt-integration/jniLibs" \
            -Pripdpi.prebuiltRootHelperDir="$RUNNER_TEMP/prebuilt-integration/assetsBin" \
            -Pripdpi.prebuiltNaiveProxyDir="$RUNNER_TEMP/prebuilt-integration/assetsBin" \
            -Pripdpi.prebuiltCloudflareOriginDir="$RUNNER_TEMP/prebuilt-integration/assetsBin" \
            -Pripdpi.prebuiltPluggableTransportAssetsDir="$RUNNER_TEMP/prebuilt-pluggable-transport-assets" \
            -Pripdpi.prebuiltPluggableTransportAssetsManifestSha256="${{ needs.pluggable-transport-assets.outputs.manifest_sha256 }}" \
            -Pandroid.testInstrumentationRunnerArguments.package=com.poyka.ripdpi.integration \
            -Pandroid.testInstrumentationRunnerArguments.coverage=false \
            --profile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Run Simple experience integration on ${{ matrix.device }}
        run: |
          rm -rf app/build/outputs/androidTest-results/connected/debug/flavors/githubSimple
          # The preceding Full invocation removes AndroidX Test Orchestrator
          # packages from the shared emulator. Re-run this invocation's task
          # graph so AGP installs its test utility before starting Simple.
          ./gradlew :app:connectedGithubSimpleDebugAndroidTest \
            --rerun-tasks \
            -Pripdpi.nativeAbisOverride=x86_64 \
            -Pripdpi.prebuiltJniLibsDir="$RUNNER_TEMP/prebuilt-integration/jniLibs" \
            -Pripdpi.prebuiltRootHelperDir="$RUNNER_TEMP/prebuilt-integration/assetsBin" \
            -Pripdpi.prebuiltNaiveProxyDir="$RUNNER_TEMP/prebuilt-integration/assetsBin" \
            -Pripdpi.prebuiltCloudflareOriginDir="$RUNNER_TEMP/prebuilt-integration/assetsBin" \
            -Pripdpi.prebuiltPluggableTransportAssetsDir="$RUNNER_TEMP/prebuilt-pluggable-transport-assets" \
            -Pripdpi.prebuiltPluggableTransportAssetsManifestSha256="${{ needs.pluggable-transport-assets.outputs.manifest_sha256 }}" \
            -Pandroid.testInstrumentationRunnerArguments.class=com.poyka.ripdpi.integration.MainActivityNavigationInstrumentedTest#simpleHomeWiresDiagnosticStartCancelAndShareThroughMainViewModel \
            -Pandroid.testInstrumentationRunnerArguments.coverage=false \
            --profile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Validate GitHub Full instrumentation evidence on ${{ matrix.device }}
        run: |
          python3 scripts/ci/validate_android_junit_results.py \
            app/build/outputs/androidTest-results/connected/debug/flavors/githubFull \
            --require-test com.poyka.ripdpi.integration.NativeBridgeInstrumentedTest#rawBindingsCreateAndDestroySessionsWithoutStarting \
            --expected-count 1 \
            --minimum-total-count 54

      - name: Preserve GitHub Full instrumentation evidence on ${{ matrix.device }}
        run: |
          evidence_dir="$RUNNER_TEMP/android-instrumented-results/${{ matrix.device }}/github-full-integration"
          mkdir -p "$evidence_dir"
          cp -R app/build/outputs/androidTest-results/connected/debug/flavors/githubFull/. "$evidence_dir/"

      - name: Validate GitHub Simple instrumentation evidence on ${{ matrix.device }}
        run: |
          python3 scripts/ci/validate_android_junit_results.py \
            app/build/outputs/androidTest-results/connected/debug/flavors/githubSimple \
            --require-test com.poyka.ripdpi.integration.MainActivityNavigationInstrumentedTest#simpleHomeWiresDiagnosticStartCancelAndShareThroughMainViewModel \
            --expected-count 1 \
            --expected-total-count 1 \
            --forbid-skips

      - name: Preserve GitHub Simple instrumentation evidence on ${{ matrix.device }}
        run: |
          evidence_dir="$RUNNER_TEMP/android-instrumented-results/${{ matrix.device }}/github-simple-integration"
          mkdir -p "$evidence_dir"
          cp -R app/build/outputs/androidTest-results/connected/debug/flavors/githubSimple/. "$evidence_dir/"

      - name: Run JNI strategy instrumentation on ${{ matrix.device }}
        if: matrix.api == 35
        run: |
          rm -rf app/build/outputs/androidTest-results/connected/debug/flavors/githubFull
          ./gradlew :app:connectedGithubFullDebugAndroidTest \
            -Pripdpi.nativeAbisOverride=x86_64 \
            -Pripdpi.prebuiltJniLibsDir="$RUNNER_TEMP/prebuilt-integration/jniLibs" \
            -Pripdpi.prebuiltRootHelperDir="$RUNNER_TEMP/prebuilt-integration/assetsBin" \
            -Pripdpi.prebuiltNaiveProxyDir="$RUNNER_TEMP/prebuilt-integration/assetsBin" \
            -Pripdpi.prebuiltCloudflareOriginDir="$RUNNER_TEMP/prebuilt-integration/assetsBin" \
            -Pripdpi.prebuiltPluggableTransportAssetsDir="$RUNNER_TEMP/prebuilt-pluggable-transport-assets" \
            -Pripdpi.prebuiltPluggableTransportAssetsManifestSha256="${{ needs.pluggable-transport-assets.outputs.manifest_sha256 }}" \
            -Pandroid.testInstrumentationRunnerArguments.class=com.poyka.ripdpi.jni.StrategyEngineJniInstrumentedTest \
            -Pandroid.testInstrumentationRunnerArguments.coverage=false \
            --profile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Validate JNI strategy instrumentation evidence
        if: matrix.api == 35
        run: |
          python3 scripts/ci/validate_android_junit_results.py \
            app/build/outputs/androidTest-results/connected/debug/flavors/githubFull \
            --require-test com.poyka.ripdpi.jni.StrategyEngineJniInstrumentedTest#strategyConfigValidationAcceptsRegistryYaml \
            --expected-count 1 \
            --expected-total-count 5 \
            --forbid-skips

      - name: Preserve JNI strategy instrumentation evidence
        if: matrix.api == 35
        run: |
          evidence_dir="$RUNNER_TEMP/android-instrumented-results/${{ matrix.device }}/github-full-jni"
          mkdir -p "$evidence_dir"
          cp -R app/build/outputs/androidTest-results/connected/debug/flavors/githubFull/. "$evidence_dir/"

      - name: Capture Android instrumented-test emulator diagnostics
        if: always()
        run: |
          bash scripts/ci/capture-android-emulator-diagnostics.sh \
            --avd "${{ matrix.device }}" \
            --output-dir "$RUNNER_TEMP/android-instrumented-${{ matrix.device }}"

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-android-instrumented-${{ matrix.device }}

      - name: Stop ${{ matrix.device }} emulator
        if: always()
        run: bash scripts/ci/stop-android-emulator.sh --avd "${{ matrix.device }}"

      - name: Upload Android instrumented-test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumented-artifacts-${{ matrix.device }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/android-instrumented-results/
            app/build/outputs/managed_device_android_test_additional_output/
            ${{ runner.temp }}/android-instrumented-${{ matrix.device }}/
          retention-days: 7

  rust-loom:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      github.event_name != 'schedule' &&
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_rust_native_ci == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true
          prefix-key: loom

      - name: Run loom concurrency tests
        env:
          LOOM_MAX_PREEMPTIONS: 3
        run: bash scripts/ci/run-rust-loom.sh

  rust-native-soak:
    needs: [change-routing, ci-preflight]
    if: >-
      !cancelled() &&
      needs.change-routing.outputs.run_full_ci == 'true' && ((github.event_name == 'schedule' && github.event.schedule == '19 4 * * 2') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_native_soak == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep in sync with native/rust/rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: native/rust -> target
          cache-on-failure: true

      - name: Resolve soak profile
        id: soak-profile
        run: |
          profile="${{ github.event.inputs.soak_profile }}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            profile="full"
          elif [ -z "$profile" ]; then
            profile="smoke"
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Run native Rust soak suites
        run: |
          mkdir -p "$RUNNER_TEMP/native-soak-artifacts"
          RIPDPI_SOAK_PROFILE="${{ steps.soak-profile.outputs.profile }}" \
