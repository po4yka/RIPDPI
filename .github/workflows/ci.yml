  android-network-e2e:
    needs: [change-routing, pluggable-transport-assets]
    if: >-
      (needs.change-routing.outputs.run_full_ci == 'true' || needs.change-routing.outputs.run_android_ci == 'true') &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.run_android_network_e2e == 'true') ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'run-android-e2e')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-android-rust
        with:
          rust-components: ""
          rust-targets: x86_64-linux-android
          rust-cache-shared-key: rust-android
          rust-cache-save: "false"
          gradle-cache-read-only: "true"

      - name: Download verified pluggable transport assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluggable-transport-assets
          path: ${{ runner.temp }}/pluggable-transport-download

      - name: Extract verified pluggable transport assets
        run: |
          set -euo pipefail
          scripts/ci/extract-pluggable-transport-artifact.sh \
            "$RUNNER_TEMP/pluggable-transport-download/pluggable-transport-assets.tar.gz" \
            "$RUNNER_TEMP/prebuilt-pluggable-transport-assets"

      - name: Cache Appium dependencies
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_appium_smoke == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.appium
            ~/.cache/pip
          key: appium-deps-${{ hashFiles('appium/requirements.txt') }}
          restore-keys: |
            appium-deps-

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start local network fixture
        env:
          RIPDPI_FIXTURE_ANDROID_HOST: 10.0.2.2
          RIPDPI_FIXTURE_DNS_ANSWER_IPV4: 10.0.2.2
        run: |
          mkdir -p "$RUNNER_TEMP/local-network-fixture"
          scripts/ci/start-local-network-fixture.sh \
            "$RUNNER_TEMP/local-network-fixture/fixture.log" \
            "$RUNNER_TEMP/local-network-fixture/fixture-manifest.json" \
            "$RUNNER_TEMP/local-network-fixture/fixture.pid"
          cat "$RUNNER_TEMP/local-network-fixture/fixture-manifest.json"

      - name: Provision network E2E emulator
        run: |
          bash scripts/ci/start-android-emulator.sh \
            --avd network-e2e \
            --api 34 \
            --arch x86_64 \
            --target google_apis

      - name: Run connected Android network E2E tests
        timeout-minutes: 60
        env:
          RIPDPI_PREBUILT_PT_DIR: ${{ runner.temp }}/prebuilt-pluggable-transport-assets
          RIPDPI_PREBUILT_PT_MANIFEST_SHA256: ${{ needs.pluggable-transport-assets.outputs.manifest_sha256 }}
        run: bash scripts/ci/run-android-e2e-emulator.sh "${{ github.event_name }}" "${{ github.event.inputs.run_maestro_smoke }}" "${{ github.event.inputs.run_appium_smoke }}"

      - name: Capture fixture state
        if: always()
        timeout-minutes: 2
        run: |
          curl -fsS http://127.0.0.1:46090/manifest > "$RUNNER_TEMP/local-network-fixture/fixture-manifest.json" || true
          curl -fsS http://127.0.0.1:46090/events > "$RUNNER_TEMP/local-network-fixture/fixture-events.json" || true

      - name: Capture network E2E emulator diagnostics
        if: always()
        timeout-minutes: 5
        run: |
          bash scripts/ci/capture-android-emulator-diagnostics.sh \
            --avd network-e2e \
            --output-dir "$RUNNER_TEMP/android-network-e2e-diagnostics" \
            --logcat-file android-logcat.txt

      - uses: ./.github/actions/upload-build-observability
        if: always()
        with:
          artifact-name: build-observability-android-network-e2e

      - name: Stop emulator
        if: always()
        timeout-minutes: 5
        run: bash scripts/ci/stop-android-emulator.sh --avd network-e2e

      - name: Stop local network fixture
        if: always()
        timeout-minutes: 2
        run: scripts/ci/stop-local-network-fixture.sh "$RUNNER_TEMP/local-network-fixture/fixture.pid"

      - name: Upload Android network E2E artifacts
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-network-e2e-artifacts
          path: |
            android-logcat.txt
            ${{ runner.temp }}/android-network-e2e-diagnostics/
            ${{ runner.temp }}/android-instrumented-target.txt
            app/build/reports/androidTests/connected/
            app/build/reports/coverage/
            app/build/outputs/code_coverage/
            app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/maestro/
            ${{ runner.temp }}/appium-smoke.log
            appium/appium-report.html
            appium/screenshots/
            ${{ runner.temp }}/local-network-fixture/fixture.log
            ${{ runner.temp }}/local-network-fixture/fixture-manifest.json
            ${{ runner.temp }}/local-network-fixture/fixture-events.json
          retention-days: 7

