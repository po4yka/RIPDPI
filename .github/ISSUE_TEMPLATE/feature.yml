name: Feature request
description: Propose a new feature or improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem_statement
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who is affected and how often?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider and why did you rule them out?
    validations:
      required: false

  - type: dropdown
    id: root_required
    attributes:
      label: Root mode required?
      description: Does this feature require a rooted device to function?
      options:
        - "Yes"
        - "No"
        - "Unknown"
    validations:
      required: true
