name: Security report
description: Report a security vulnerability or regression
title: "security: "
labels: [security]
body:
  - type: dropdown
    id: vuln_type
    attributes:
      label: Vulnerability type
      options:
        - DPI bypass regression
        - Credential leak
        - Protocol weakness
        - Other
    validations:
      required: true

  - type: input
    id: affected_version
    attributes:
      label: Affected version
      description: Which app version is affected? (e.g. 1.4.2)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the vulnerability, its impact, and how to reproduce it.
      placeholder: Describe impact and reproduction
    validations:
      required: true

  - type: dropdown
    id: contact_preference
    attributes:
      label: Contact preference
      options:
        - Public issue OK
        - Please email nikkipochaev@gmail.com
    validations:
      required: true
