name: Bug report
description: Report a bug or unexpected behavior
title: "bug: "
labels: [bug]
body:
  - type: dropdown
    id: android_version
    attributes:
      label: Android version
      description: Which Android version is the device running?
      options:
        - "Android 8.0 (Oreo)"
        - "Android 8.1"
        - "Android 9 (Pie)"
        - "Android 10"
        - "Android 11"
        - "Android 12"
        - "Android 12L"
        - "Android 13"
        - "Android 14"
        - "Android 15"
        - Other (specify in repro steps)
    validations:
      required: true

  - type: dropdown
    id: root_mode
    attributes:
      label: Root mode enabled
      description: Is root mode turned on in settings?
      options:
        - "Yes"
        - "No"
        - "N/A"
    validations:
      required: true

  - type: textarea
    id: repro_steps
    attributes:
      label: Reproduction steps
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open the app
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: log_excerpt
    attributes:
      label: Log excerpt
      description: Paste relevant logcat output here (optional).
      placeholder: paste logcat output
      render: text
    validations:
      required: false

  - type: checkboxes
    id: pcap_attached
    attributes:
      label: Packet capture
      options:
        - label: I have attached a packet capture
