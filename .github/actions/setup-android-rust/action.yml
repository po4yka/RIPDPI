name: Setup Android + Rust
description: Shared setup for Java, Rust toolchain, Android SDK/NDK, sccache, and Gradle

inputs:
  rust-components:
    description: Comma-separated Rust components to install (e.g. "rustfmt, clippy")
    required: false
    default: ""
  rust-targets:
    description: Space-separated Rust targets to add
    required: false
    default: "aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android"
  rust-cache-shared-key:
    description: Shared key for Swatinem/rust-cache
    required: false
    default: "rust-android"
  rust-cache-workspaces:
    description: Cargo workspace-to-target mappings passed to Swatinem/rust-cache
    required: false
    default: "native/rust -> target"
  rust-cache-save:
    description: Whether to save the Rust cache (set false for restore-only)
    required: false
    default: "true"
  gradle-cache-read-only:
    description: Whether Gradle cache is read-only; defaults to true so workflow owners must opt in one designated writer
    required: false
    default: "true"
  java-version:
    description: Java version to install
    required: false
    default: "17"
  setup-java:
    description: Whether to install Java toolchains
    required: false
    default: "true"
  setup-rust:
    description: Whether to install Rust, its cache, and targets
    required: false
    default: "true"
  setup-sccache:
    description: Whether to install sccache for Rust compilation
    required: false
    default: "true"
  setup-gradle:
    description: Whether to set up Gradle
    required: false
    default: "true"
  skip-android-sdk-ndk:
    description: Skip Android SDK + NDK installation (for Rust-only jobs that don't touch Android)
    required: false
    default: "false"
  setup-android-ndk:
    description: Whether to install the Android NDK when Android SDK setup is enabled
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Install the Gradle daemon JVM (JDK 21, per gradle/gradle-daemon-jvm.properties)
    # alongside the compile-toolchain version, both as Temurin. This guarantees a
    # local JDK 21 on every runner so the daemon resolves it directly instead of
    # auto-downloading from foojay (whose pinned package ids rotate and return 400).
    # The compile version is listed last so JAVA_HOME is unchanged for back-compat;
    # setup-gradle wires every installed JDK into Gradle's toolchain discovery.
    - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      if: inputs.setup-java == 'true'
      with:
        distribution: temurin
        java-version: |
          21
          ${{ inputs.java-version }}

    # Keep in sync with native/rust/rust-toolchain.toml
    - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      if: inputs.setup-rust == 'true'
      with:
        toolchain: "1.96.0"
        components: ${{ inputs.rust-components }}

    # Android CLI is downloaded from a versioned official URL and verified
    # before execution. Do not use the mutable `latest` installer here: it
    # downloads another mutable payload and crosses the release signing boundary.
    - name: Install Android CLI
      if: inputs.skip-android-sdk-ndk != 'true'
      shell: bash
      run: |
        set -euo pipefail
        readonly android_cli_version="1.0.15857036"
        readonly android_cli_sha256="e5b6930e96a1e898a69f0194c68f5867bc83fa86dde87ab733ab5493d0c8e7c2"
        android_cli="$RUNNER_TEMP/android-cli"
        curl -fsSL \
          "https://dl.google.com/android/cli/$android_cli_version/linux_x86_64/android-cli" \
          -o "$android_cli"
        printf '%s  %s\n' "$android_cli_sha256" "$android_cli" | sha256sum --check --strict
        mkdir -p "$HOME/.local/bin"
        install -m 0755 "$android_cli" "$HOME/.local/bin/android"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        # Capture the complete output before inspecting it. Piping this Rust CLI
        # through `head` can close stdout early and make the process panic with
        # exit 101 when a runner emits an additional informational line.
        version_output="$(android --no-metrics --version 2>&1)"
        version_matches=false
        while IFS= read -r version_line; do
          if [ "$version_line" = "$android_cli_version" ]; then
            version_matches=true
            break
          fi
        done <<< "$version_output"
        if [ "$version_matches" != true ]; then
          echo "Android CLI version differs from pinned release (got: $version_output)" >&2
          exit 1
        fi
        echo "Android CLI: $android_cli_version"

    - name: Read native toolchain policy
      if: inputs.skip-android-sdk-ndk != 'true'
      id: native-toolchain
      shell: bash
      run: |
        echo "ndk=$(grep '^ripdpi.nativeNdkVersion=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
        echo "cmake=$(grep '^ripdpi.nativeCmakeVersion=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
        echo "compile-sdk=$(grep '^ripdpi.compileSdk=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

    # Cache the Android CLI state directory as an installation accelerator only.
    # Every job still reconciles the packages below because Gradle consumes them
    # from ANDROID_HOME, and a ~/.android cache hit is not installation evidence.
    # A hash of this action file invalidates stale CLI state when commands change.
    - name: Cache Android SDK and NDK
      if: inputs.skip-android-sdk-ndk != 'true'
      id: cache-android-sdk
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.android
        key: android-sdk-${{ runner.os }}-${{ steps.native-toolchain.outputs.compile-sdk }}-${{ steps.native-toolchain.outputs.ndk }}-cmake-${{ steps.native-toolchain.outputs.cmake }}-ndk-${{ inputs.setup-android-ndk }}-${{ hashFiles('.github/actions/setup-android-rust/action.yml') }}

    - name: Install Android SDK baseline via android CLI
      if: inputs.skip-android-sdk-ndk != 'true'
      shell: bash
      run: |
        set -euo pipefail
        bash scripts/ci/android-sdk-install.sh \
          "platform-tools" \
          "platforms/android-${{ steps.native-toolchain.outputs.compile-sdk }}"

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      if: inputs.setup-rust == 'true'
      with:
        workspaces: ${{ inputs.rust-cache-workspaces }}
        cache-on-failure: true
        shared-key: ${{ inputs.rust-cache-shared-key }}
        save-if: ${{ inputs.rust-cache-save }}

    - name: Install Rust Android targets
      if: inputs.setup-rust == 'true' && inputs.rust-targets != ''
      shell: bash
      run: rustup target add ${{ inputs.rust-targets }}

    - name: Install native toolchain via android CLI
      if: inputs.skip-android-sdk-ndk != 'true' && inputs.setup-android-ndk == 'true'
      shell: bash
      run: >-
        bash scripts/ci/android-sdk-install.sh
        "ndk/${{ steps.native-toolchain.outputs.ndk }}"
        "cmake/${{ steps.native-toolchain.outputs.cmake }}"

    - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      if: inputs.setup-rust == 'true' && inputs.setup-sccache == 'true'
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    - name: Configure shared Gradle build cache
      if: inputs.setup-gradle == 'true'
      shell: bash
      run: |
        mkdir -p ~/.gradle/init.d
        cat > ~/.gradle/init.d/ci-build-cache.gradle << 'GRADLE'
        settingsEvaluated { settings ->
          settings.buildCache {
            local {
              directory = new File(System.getenv("RUNNER_TEMP"), "gradle-build-cache")
            }
          }
        }
        GRADLE

    - name: Restore shared Gradle build cache (read-only)
      if: inputs.setup-gradle == 'true' && inputs.gradle-cache-read-only == 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/gradle-build-cache
        key: gradle-build-cache-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml') }}-${{ github.sha }}
        restore-keys: |
          gradle-build-cache-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml') }}-
          gradle-build-cache-

    - name: Shared Gradle build cache
      if: inputs.setup-gradle == 'true' && inputs.gradle-cache-read-only != 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/gradle-build-cache
        key: gradle-build-cache-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml') }}-${{ github.sha }}
        restore-keys: |
          gradle-build-cache-${{ hashFiles('**/*.gradle*', 'gradle.properties', 'gradle/libs.versions.toml') }}-
          gradle-build-cache-

    - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      if: inputs.setup-gradle == 'true'
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
