name: Fetch upstream NaiveProxy client
description: >-
  Restores or downloads the digest-pinned upstream NaiveProxy libnaive.so binaries that
  HelperExecutableJniLibsTask stages as jniLibs. The cache key is the pin manifest, and the
  script verifies every digest on a cache hit and a miss.

runs:
  using: composite
  steps:
    - name: Cache upstream NaiveProxy client
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: native/naiveproxy-upstream/artifacts
        key: naive-upstream-${{ hashFiles('native/naiveproxy-upstream/sources.json') }}

    - name: Fetch and verify upstream NaiveProxy client
      shell: bash
      run: python3 scripts/ci/fetch-naive-upstream.py
