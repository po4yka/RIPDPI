name: Upload build observability
description: Preserve Gradle profiles for a CI build lane.

inputs:
  artifact-name:
    description: Unique artifact name for this job or matrix shard.
    required: true

runs:
  using: composite
  steps:
    - name: Collect build observability
      shell: bash
      run: |
        set -euo pipefail
        output_dir="$RUNNER_TEMP/build-observability"
        mkdir -p "$output_dir"
        if [[ -d "$GITHUB_WORKSPACE/build/reports/profile" ]]; then
          cp -R "$GITHUB_WORKSPACE/build/reports/profile" "$output_dir/gradle-profile"
        fi

    - name: Upload build observability
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/build-observability/
        if-no-files-found: warn
        retention-days: 7
