# Pin Robolectric to SDK 35 (= ripdpi.targetSdk) for this module's unit tests.
#
# With testOptions.unitTests.isIncludeAndroidResources = true (required so
# MigrationTestHelper can read the exported Room schema assets), Robolectric
# otherwise derives the SDK from the merged test manifest, which defaults to
# compileSdk = 37 -- above Robolectric 4.16.1's max-supported SDK 36, failing
# every test that lacks an explicit @Config(sdk = ...). Pinning here keeps the
# whole module's Robolectric tests on the repo's targetSdk.
sdk=35
