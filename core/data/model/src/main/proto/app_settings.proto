syntax = "proto3";
option java_package = "com.poyka.ripdpi.proto";
option java_multiple_files = true;

message NumericRange {
  int64 start = 1; // -1 means unset
  int64 end = 2;   // -1 means unset
}

message ActivationFilter {
  NumericRange round = 1;
  NumericRange payload_size = 2;
  NumericRange stream_bytes = 3;
  optional bool tcp_has_timestamp = 4;
  optional bool tcp_has_ech = 5;
  optional int32 tcp_window_below = 6;
  optional int32 tcp_mss_below = 7;
}

message StrategyTcpStep {
  string kind = 1;
  string marker = 2;
  string midhost_marker = 3;
  string fake_host_template = 4;
  int32 fragment_count = 5;
  int32 min_fragment_size = 6;
  int32 max_fragment_size = 7;
  ActivationFilter activation_filter = 8;
  int32 overlap_size = 9;
  string fake_mode = 10;
  string ipv6_extension_profile = 11;
  string tcp_flags_set = 12;
  string tcp_flags_unset = 13;
  string tcp_flags_orig_set = 14;
  string tcp_flags_orig_unset = 15;
  string fake_order = 16;
  string fake_seq_mode = 17;
}

message StrategyUdpStep {
  string kind = 1;
  int32 count = 2;
  ActivationFilter activation_filter = 3;
  int32 split_bytes = 4;
  string ipv6_extension_profile = 5;
}

message AppSettings {
  reserved 15, 16, 17, 29, 30, 31, 32, 69, 71, 93, 94, 130, 190, 215, 216;
  reserved
      "desync_method",
      "split_position",
      "split_at_host",
      "tlsrec_enabled",
      "tlsrec_position",
      "tlsrec_at_sni",
      "udp_fake_count",
      "split_marker",
      "tlsrec_marker",
      "dns_doh_url",
      "dns_doh_bootstrap_ips",
      "settings_migration_level",
      "relay_masque_cloudflare_mode";
  // Removed legacy relay kinds: VMess, Trojan-Go, Hysteria-v1.
  reserved 307, 308, 309, 310, 311, 312, 313, 314, 315, 316, 317, 318, 322, 323, 324, 325, 326, 327;
  reserved
      "relay_vmess_security",
      "relay_vmess_transport",
      "relay_vmess_ws_path",
      "relay_vmess_ws_host",
      "relay_vmess_grpc_service",
      "relay_vmess_h2_path",
      "relay_vmess_h2_host",
      "relay_trojan_go_sni",
      "relay_trojan_go_ws_path",
      "relay_trojan_go_ws_host",
      "relay_trojan_go_mux",
      "relay_trojan_go_inner_cipher",
      "relay_hysteria_v1_auth_type",
      "relay_hysteria_v1_protocol",
      "relay_hysteria_v1_up_mbps",
      "relay_hysteria_v1_down_mbps",
      "relay_hysteria_v1_sni",
      "relay_hysteria_v1_alpn";

  // General
  string app_theme = 1;       // "system" | "light" | "dark"
  string ripdpi_mode = 2;     // "vpn" | "proxy"
  string dns_ip = 3;
  bool ipv6_enable = 4;

  // Mode toggle
  bool enable_cmd_settings = 5;
  string cmd_args = 6;

  // Proxy
  string proxy_ip = 7;
  int32 proxy_port = 8;
  int32 max_connections = 9;
  int32 buffer_size = 10;
  bool no_domain = 11;
  bool tcp_fast_open = 12;
  // Mixed inbound: one local listener serving SOCKS5 + SOCKS4 + HTTP CONNECT
  // (first-byte dispatch). When on and proxy_port is unset, the port defaults
  // to 2080 instead of 1080.
  bool mixed_inbound_enabled = 403;
  // Allow-LAN: bind the local listener to all interfaces (0.0.0.0) instead of
  // loopback so other devices on the network can use it. Non-loopback
  // listeners are rejected by the native core unless an access token is set,
  // so enabling this auto-generates proxy_lan_auth_token.
  bool proxy_allow_lan = 404;
  string proxy_lan_auth_token = 405;
  // Advertise HTTP proxy to system via VpnService.Builder.setHttpProxy() on Android 10+.
  // Only takes effect in VPN mode; has no impact in proxy mode.
  bool append_http_proxy = 406;

  // Desync
  int32 default_ttl = 13;
  bool custom_ttl = 14;
  int32 fake_ttl = 18;
  string fake_sni = 19;
  int32 fake_offset = 20;
  string oob_data = 21;
  bool drop_sack = 22;
  // Root-gated: request TCP_MD5SIG on outbound desync sockets. The native
  // proxy-config conversion forces this false unless root mode is enabled.
  bool fake_md5sig = 331;
  // Override the TLS record-layer minor-version byte on the genuine
  // first-flight payload (CLI -m/--tlsminor). The value applies only when
  // tls_minor_enabled is true; otherwise the byte is left untouched.
  bool tls_minor_enabled = 332;
  int32 tls_minor_value = 333;

  // Protocol
  bool desync_http = 23;
  bool desync_https = 24;
  bool desync_udp = 25;

  // Hosts
  string hosts_mode = 26;      // "disable" | "blacklist" | "whitelist"
  string hosts_blacklist = 27;
  string hosts_whitelist = 28;

  // HTTP
  bool host_mixed_case = 33;
  bool domain_mixed_case = 34;
  bool host_remove_spaces = 35;
  bool onboarding_complete = 56;
  bool webrtc_protection_enabled = 57;
  bool biometric_enabled = 58;
  string backup_pin = 59;
  string app_icon_variant = 60; // "default" | "dark" | "black" | "raven"
  string app_icon_style = 61;   // "themed" | "plain"
  bool diagnostics_monitor_enabled = 62;
  int32 diagnostics_sample_interval_seconds = 63;
  string diagnostics_default_scan_path_mode = 64; // "raw_path" | "in_path"
  bool diagnostics_auto_resume_after_raw_scan = 65;
  string diagnostics_active_profile_id = 66;
  int32 diagnostics_history_retention_days = 67;
  bool diagnostics_export_include_history = 68;
  string fake_offset_marker = 70;
  repeated StrategyTcpStep tcp_chain_steps = 72;
  repeated StrategyUdpStep udp_chain_steps = 73;
  string quic_initial_mode = 74; // "disabled" | "route" | "route_and_cache"
  bool quic_support_v1 = 75;
  bool quic_support_v2 = 76;
  bool host_autolearn_enabled = 77;
  int32 host_autolearn_penalty_ttl_hours = 78;
  int32 host_autolearn_max_hosts = 79;
  bool fake_tls_use_original = 80;
  bool fake_tls_randomize = 81;
  bool fake_tls_dup_session_id = 82;
  bool fake_tls_pad_encap = 83;
  int32 fake_tls_size = 84;
  string fake_tls_sni_mode = 85; // "fixed" | "randomized"
  string quic_fake_profile = 86; // "disabled" | "compat_default" | "realistic_initial"
  string quic_fake_host = 87;
  string http_fake_profile = 88; // "compat_default" | "iana_get" | "cloudflare_get"
  string tls_fake_profile = 89; // "compat_default" | "iana_firefox" | "google_chrome" | "google_chrome_hrr" | "vk_chrome" | "sberbank_chrome" | "rutracker_kyber" | "bigsize_iana"
  string udp_fake_profile = 90; // "compat_default" | "zero_256" | "zero_512" | "dns_query" | "stun_binding" | "wireguard_initiation" | "dht_get_peers"
  string dns_mode = 91; // "plain_udp" | "encrypted"
  string dns_provider_id = 92; // "cloudflare" | "google" | "quad9" | "adguard" | "custom"
  ActivationFilter group_activation_filter = 95;
  string encrypted_dns_protocol = 96; // "doh" | "dot" | "dnscrypt" | "doq" | "odoh"
  string encrypted_dns_host = 97;
  int32 encrypted_dns_port = 98;
  string encrypted_dns_tls_server_name = 99;
  repeated string encrypted_dns_bootstrap_ips = 100;
  string encrypted_dns_doh_url = 101;
  string encrypted_dns_dnscrypt_provider_name = 102;
  string encrypted_dns_dnscrypt_public_key = 103;
  string encrypted_dns_tls_roots_pem = 285;
  string encrypted_dns_odoh_proxy_url = 288;
  string encrypted_dns_odoh_proxy_operator_id = 289;
  string encrypted_dns_odoh_target_host = 290;
  string encrypted_dns_odoh_target_path = 291;
  string encrypted_dns_odoh_target_operator_id = 292;
  string encrypted_dns_odoh_config_source = 293; // "custom_bytes" | "bundled"
  string encrypted_dns_odoh_configs_hex = 294;
  int64 encrypted_dns_odoh_configs_retrieved_at_secs = 295;
  int64 encrypted_dns_odoh_configs_ttl_secs = 296;
  bool http_method_eol = 104;
  bool http_unix_eol = 105;
  bool adaptive_fake_ttl_enabled = 106;
  int32 adaptive_fake_ttl_delta = 107;
  int32 adaptive_fake_ttl_min = 108;
  int32 adaptive_fake_ttl_max = 109;
  int32 adaptive_fake_ttl_fallback = 110;
  bool network_strategy_memory_enabled = 111;
  bool ws_tunnel_enabled = 112;
  string ws_tunnel_mode = 113;

  // TCP window and timestamp manipulation
  int32 window_clamp = 116;            // TCP_WINDOW_CLAMP value (0 = disabled)
  bool strip_timestamps = 117;         // Strip TCP Timestamps option from outgoing segments

  // Banner dismiss state
  bool battery_banner_dismissed = 114;
  bool background_guidance_dismissed = 115;

  // QUIC DPI evasion
  bool quic_sni_split = 118;
  bool quic_bind_low_port = 119;
  int32 quic_dummy_prepend_size = 120;    // 0 = disabled, >0 = prepend size
  uint32 quic_fake_version = 121;         // 0 = disabled, non-zero = version to use
  bool quic_migrate_after_handshake = 122;

  // Strategy evolution (Geneva-style adaptive exploration)
  bool strategy_evolution = 123;       // Enable automated combo exploration
  double evolution_epsilon = 124;      // Exploration rate 0.0-1.0 (default 0.1)
  int64 evolution_experiment_ttl_ms = 254;     // Experiment window ms (0 = use built-in default 30 000)
  int64 evolution_decay_half_life_ms = 255;    // Stat decay half-life ms (0 = use built-in default 3 600 000)
  int32 evolution_cooldown_after_failures = 256; // Failures before cooldown (0 = use built-in default 3)
  int64 evolution_cooldown_ms = 257;           // Cooldown duration ms (0 = use built-in default 300 000)

  // Entropy-aware padding
  int32 entropy_padding_target_permil = 125;  // 0 = disabled, 3400 = target 3.4 popcount
  int32 entropy_padding_max = 126;            // Max padding bytes (default 256)
  int32 entropy_mode = 127;                   // 0=disabled 1=popcount 2=shannon 3=combined
  int32 shannon_entropy_target_permil = 128;  // 0 = disabled, 7920 = target 7.92 bits/byte

  // Connection freeze detection (middlebox degradation mode)
  bool freeze_detection_enabled = 129;       // Detect throttled/frozen connections

  // TCP window size control (wsize)
  int32 wsize_window = 36;                   // TCP window size in bytes (0 = disabled)
  int32 wsize_scale = 131;                   // Window scale factor (-1 = auto, 0-14 = explicit)

  // MTProto Fake-TLS domain selection
  string ws_tunnel_fake_sni = 134;           // Cover domain for WS tunnel TLS SNI (empty = disabled)
  bool ws_tunnel_allow_insecure_sni = 305;   // Operator opt-in: honour ws_tunnel_fake_sni even though it disables TLS cert verification

  // Root mode
  bool root_mode_enabled = 135;

  // WARP integration
  bool warp_enabled = 136;
  string warp_route_mode = 137; // "off" | "rules"
  string warp_route_hosts = 138;
  bool warp_builtin_rules_enabled = 139;
  string warp_endpoint_selection_mode = 140; // "automatic" | "manual"
  string warp_manual_endpoint_host = 141;
  string warp_manual_endpoint_v4 = 142;
  string warp_manual_endpoint_v6 = 143;
  int32 warp_manual_endpoint_port = 144;
  bool warp_scanner_enabled = 145;
  int32 warp_scanner_parallelism = 146;
  int32 warp_scanner_max_rtt_ms = 147;
  bool warp_amnezia_enabled = 148;
  int32 warp_amnezia_jc = 149;
  int32 warp_amnezia_jmin = 150;
  int32 warp_amnezia_jmax = 151;
  int64 warp_amnezia_h1 = 152;
  int64 warp_amnezia_h2 = 153;
  int64 warp_amnezia_h3 = 154;
  int64 warp_amnezia_h4 = 155;
  int32 warp_amnezia_s1 = 156;
  int32 warp_amnezia_s2 = 157;
  int32 warp_amnezia_s3 = 158;
  int32 warp_amnezia_s4 = 159;
  string warp_amnezia_preset = 213; // "off" | "balanced" | "aggressive" | "custom"
  string strategy_chain_yaml = 214; // Raw YAML strategy chain config for advanced strategy compositor

  // Tier 2 adaptive fallback
  bool adaptive_fallback_enabled = 160;
  bool adaptive_fallback_torst = 161;
  bool adaptive_fallback_tls_err = 162;
  bool adaptive_fallback_http_redirect = 163;
  bool adaptive_fallback_connect_failure = 164;
  bool adaptive_fallback_auto_sort = 165;
  int32 adaptive_fallback_cache_ttl_seconds = 166;
  int32 adaptive_fallback_cache_prefix_v4 = 167;

  // Tier 2 HTTP parser evasions
  bool http_method_space = 168;
  bool http_host_pad = 169;

  // Tier 3 upstream relay
  bool relay_enabled = 170;
  // relay_kind values mirror the RelayKindDescriptor table (Kotlin) and the
  // RELAY_TRANSPORT_DESCRIPTORS table (Rust); RelayKindDescriptorDriftTest pins the alignment.
  string relay_kind = 171; // "off" | "vless" | "vless_reality" | "hysteria2" | "chain_relay" | "masque" | "anytls" | "cloudflare_tunnel" | "tuic_v5" | "shadowtls_v3" | "trojan" | "shadowsocks" | "naiveproxy" | "tor" | "google_apps_script" | "snowflake" | "webtunnel" | "obfs4" | "mieru" | "ssh"
  string relay_profile_id = 172;
  string relay_server = 173;
  int32 relay_server_port = 174;
  string relay_server_name = 175;
  string relay_reality_public_key = 176;
  string relay_reality_short_id = 177;
  string relay_chain_entry_server = 178;
  int32 relay_chain_entry_port = 179;
  string relay_chain_entry_server_name = 180;
  string relay_chain_entry_public_key = 181;
  string relay_chain_entry_short_id = 182;
  string relay_chain_exit_server = 183;
  int32 relay_chain_exit_port = 184;
  string relay_chain_exit_server_name = 185;
  string relay_chain_exit_public_key = 186;
  string relay_chain_exit_short_id = 187;
  string relay_masque_url = 188;
  bool relay_masque_use_http2_fallback = 189;
  string relay_local_socks_host = 191;
  int32 relay_local_socks_port = 192;
  bool relay_udp_enabled = 193;
  bool relay_tcp_fallback_enabled = 194;
  string relay_chain_entry_profile_id = 227;
  string relay_chain_exit_profile_id = 228;
  // Ordered intermediate chain-relay hop profile IDs (positions strictly
  // between entry and exit) for N-hop (3..4) chains. Empty for plain two-hop
  // chains and all pre-N-hop (v6) configs, which fold to entry/exit only.
  repeated string relay_chain_middle_profile_ids = 306;
  bool relay_tuic_zero_rtt = 229;
  string relay_tuic_congestion_control = 230; // "bbr" | "cubic"
  string relay_shadowtls_inner_profile_id = 231;
  string relay_naive_path = 232;
  bool relay_masque_cloudflare_geohash_enabled = 233;
  string relay_cloudflare_tunnel_mode = 234; // "consume_existing" | "publish_local_origin"
  string relay_cloudflare_publish_local_origin_url = 235;
  string relay_cloudflare_credentials_ref = 236;
  string relay_finalmask_type = 237; // "off" | "header_custom" | "sudoku" | "fragment" | "noise"
  string relay_finalmask_header_hex = 238;
  string relay_finalmask_trailer_hex = 239;
  string relay_finalmask_rand_range = 240;
  string relay_finalmask_sudoku_seed = 241;
  int32 relay_finalmask_fragment_packets = 242;
  int32 relay_finalmask_fragment_min_bytes = 243;
  int32 relay_finalmask_fragment_max_bytes = 244;
  string ip_id_mode = 245; // "" | "seq" | "seqgroup" | "rnd" | "zero"
  repeated string relay_apps_script_script_ids = 247;
  string relay_apps_script_google_ip = 248;
  string relay_apps_script_front_domain = 249;
  bool relay_apps_script_verify_ssl = 250;
  bool relay_apps_script_parallel_relay = 251;
  repeated string relay_apps_script_sni_hosts = 252;
  repeated string relay_apps_script_direct_hosts = 253;
  string relay_vless_transport = 258; // "reality_tcp" | "xhttp"
  string relay_xhttp_path = 259;
  string relay_xhttp_host = 260;
  string relay_xhttp_mode = 334; // "auto" | "stream-up" | "stream-one"
  // Mieru outbound non-credential config; the username and password are
  // credentials stored in the secure store. Endpoint comes from the common
  // relay_server / relay_server_port.
  string relay_mieru_protocol = 319; // "tcp" | "udp"
  string relay_mieru_multiplexing = 320; // "off" | "low" | "middle" | "high"
  int32 relay_mieru_mtu = 321; // 1280..1500, default 1400
  // SSH outbound non-credential config; the username/password, private key, and
  // private-key passphrase are credentials stored in the secure store. Endpoint
  // comes from the common relay_server / relay_server_port.
  string relay_ssh_auth_type = 328; // "password" | "private_key"
  string relay_ssh_host_key_fingerprint = 329; // pinned "SHA256:..." TOFU fingerprint, optional
  bool relay_ssh_strict_host_key = 330; // reject on host-key mismatch when true

  // WARP active profile metadata (non-secret)
  string warp_profile_id = 195;
  string warp_account_kind = 196; // "consumer_free" | "consumer_plus" | "zero_trust"
  string warp_zero_trust_org = 197;
  string warp_setup_state = 198; // "not_configured" | "provisioning" | "provisioned" | "needs_attention"
  string warp_last_scanner_mode = 199; // "automatic" | "manual" | "rescan"

  // Tier 4 strategy packs
  string strategy_pack_channel = 200; // "stable" | "beta"
  string strategy_pack_pinned_id = 201;
  string strategy_pack_pinned_version = 202;
  string strategy_pack_refresh_policy = 203; // "manual" | "automatic"
  bool strategy_pack_allow_rollback_override = 246;

  // Tier 4 TLS fingerprint profile for app-owned TLS clients
  string tls_fingerprint_profile = 204; // migration accepts "native_default"; runtime normalizes to "chrome_stable" | "firefox_stable"

  bool exclude_russian_apps_enabled = 205;

  // Anti-spy hardening: route all traffic through VPN with no app exclusions
  bool full_tunnel_mode = 206;

  // Detection check settings
  bool detection_check_include_bypass = 207;   // Include localhost proxy scanning (default true)
  bool detection_check_include_location = 208; // Include PLMN/BSSID checks (default true)
  bool detection_check_rtt_triangulation_enabled = 261; // Enable RTT triangulation check (default false)
  bool detection_check_privacy_mode_enabled = 262; // Mask public IPs in detection UI/export output
  bool rkn_diagnostics_fetch_self_info_enabled = 263; // Opt-in public IP/ASN context for RKN diagnosis
  bool detection_check_cdn_pulling_enabled = 264; // Enable CDN trace pulling/MITM check (default false)
  bool compression_probe_include_zstd = 265; // Enable native Zstd HTTP compression probe (default false)
  bool detection_check_debug_mode_enabled = 266; // Enable verbose detection debug diagnostics copy action
  string detection_check_color_vision_mode = 267; // "off" | "red_green" | "blue_yellow" | "achromatopsia"
  bool detection_check_protanopia_variant_unlocked = 268; // Hidden RED_GREEN palette sub-variant unlock
  bool detection_check_network_requests_enabled = 269; // Master switch for active network detection requests (default true)
  bool detection_check_cdn_pulling_meduza_enabled = 270; // Include Meduza CDN cohort in CDN pulling (default true)
  bool detection_check_call_transport_probe_enabled = 271; // Probe MTProto/STUN through detected proxy (default false)
  bool detection_check_xray_api_scan_enabled = 272; // Include localhost Xray API scan (default true)
  string detection_check_tun_probe_mode = 273; // "auto" | "strict_same_path" | "curl_compatible"
  string detection_check_port_range_mode = 274; // "popular" | "extended" | "full" | "custom"
  int32 detection_check_custom_port_start = 275;
  int32 detection_check_custom_port_end = 276;
  string detection_check_dns_resolver_mode = 277; // "system" | "direct" | "doh"
  string detection_check_dns_preset = 278; // "custom" | "cloudflare" | "google" | "yandex"
  string detection_check_dns_direct_servers = 279;
  string detection_check_dns_doh_url = 280;
  string detection_check_dns_doh_bootstrap_ips = 281;
  // Censorship-resistance lever: route the chosen encrypted-DNS connection
  // through the SOCKS5/relay path so the TSPU cannot SNI-block the resolver
  // endpoint. Drives the native MapDnsConfig serde key
  // "route-dns-through-socks5". proto3 bool defaults to false (off).
  bool detection_check_dns_route_through_proxy = 408;
  int32 dpi_suite_concurrency = 282; // Max concurrent requests for manual DPI probe suite (default 100)
  bool detection_diagnostic_random_hostnames_enabled = 283; // Randomize Host/SNI in manual diagnostic probes
  string detection_diagnostic_tls_keylog_path = 284; // Hidden diagnostic TLS keylog path; empty disables

  // Community comparison (anonymous opt-in)
  bool community_comparison_enabled = 209;
  string community_api_url = 210;

  // HTTP parser evasion: Host header manipulation
  bool http_host_extra_space = 211;  // Insert space before colon: "Host : example.com"
  bool http_host_tab = 212;          // Tab separator: "Host:\texample.com"
  string fake_tls_source = 217;      // "profile" | "captured_client_hello"
  string fake_tls_secondary_profile = 218;
  bool fake_tcp_timestamp_enabled = 219;
  int32 fake_tcp_timestamp_delta_ticks = 220;
  bool desync_any_protocol = 221;
  string relay_outbound_bind_ip = 222;
  string app_routing_policy_mode = 223; // "off" | "prompt"
  repeated string app_routing_enabled_preset_ids = 224;
  bool anti_correlation_enabled = 225;
  string dht_mitigation_mode = 226; // "off" | "bypass" | "drop_warn"

  // P3.8: PCAP capture toggle (developer diagnostics)
  bool pcap_capture_enabled = 286;
  optional bool relay_dns_over_tunnel_enabled = 287; // Unset means true: relay-active DNS is fail-closed through the relay path.
  optional bool udp_associate_enabled = 407; // Unset means true: SOCKS5 UDP ASSOCIATE stays always-on unless explicitly disabled.

  // Geo asset (geoip.db / geosite.db) source picker
  string geo_asset_provider_id = 297; // AssetProvider id; "sagernet" | "soffchen" | "chocolate4u" | "l11r" | "custom" (empty = default)
  string geo_asset_custom_base_url = 298; // User-supplied GitHub-Releases-compatible base when provider_id == "custom"
  string geo_asset_geoip_version_tag = 299; // Stored release tag of the on-disk geoip.db (empty = never downloaded)
  string geo_asset_geosite_version_tag = 300; // Stored release tag of the on-disk geosite.db (empty = never downloaded)
  int64 geo_asset_last_updated_epoch_millis = 301; // System.currentTimeMillis() of the last successful download or import; 0 = never

  // Per-app split tunneling (friendly surface over VpnService app exclusion).
  // full_tunnel_mode (206) takes precedence: when on, these are ignored entirely.
  string split_tunnel_mode = 302; // "off" | "include" | "exclude"
  repeated string split_tunnel_packages = 303; // user-selected packages for the active mode

  // Start-on-boot: drives the BootReceiver enabled state. proto3 bool defaults to false.
  bool start_on_boot = 304;

  // UI persona: "simple" | "advanced". Simple is the default user-facing surface.
  string ui_persona = 409;

  // Simple-flavor failover-selected AWG profile id. Empty means no AWG failover egress is selected.
  string simple_failover_awg_profile_id = 410;

  // Optional Cloudflare Worker route for the Telegram WS tunnel. The bearer is
  // stored only in the Android-Keystore-backed credential store.
  string ws_tunnel_worker_url = 411;
  string ws_tunnel_worker_credential_ref = 412;
}
