# russh 0.62.4 exact-pins the SSH relay's RustCrypto graph. Some transitive
# primitives (rsa, ssh-key, ssh-cipher) remain release candidates and ship in every
# build via the always-on SSH relay. Track the remaining upstream stabilization in
# deny.toml [advisories] "Known RC-crypto exposure" and Eugeny/russh #697 / PR #702.
russh = "=0.62.6"
ripdpi-naiveproxy = { path = "crates/ripdpi-naiveproxy" }
ripdpi-cloudflare-origin = { path = "crates/ripdpi-cloudflare-origin" }
