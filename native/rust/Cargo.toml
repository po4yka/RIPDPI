# salsa20 (XSalsa20Poly1305, DNSCrypt es_version 0x0001) is in crypto_box's default
# features, but pin it explicitly so a future default-features purge cannot silently
# drop DNSCrypt's classic-NaCl-box cipher path. See ripdpi-dns-resolver dnscrypt::cipher.
crypto_box = { version = "0.9", features = ["chacha20", "salsa20"] }
