metrics = "0.24"
lru = "0.18"
maxminddb = "0.30"
mlua = "0.12"
mio = { version = "1.2", features = ["net", "os-poll"] }
nix = { version = "0.31", features = ["net", "ioctl", "fs", "mman", "signal", "process", "uio", "zerocopy"] }
odoh-rs = "=1.0.4"
once_cell = "1"
quinn = { version = "0.11", default-features = false, features = ["rustls", "ring", "runtime-tokio"] }
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "socks"] }
rand_09 = { package = "rand", version = "=0.9.5", default-features = false, features = ["os_rng", "std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
serde_yaml_ng = "0.10"
toml = "1.1"
socket2 = "0.6"
proptest = "1"
rcgen = "0.14"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12", "aws-lc-rs"] }
# Exact upstream revision containing the malformed-RDATA bounds fix from
# hickory-dns/hickory-dns#3743. Return to crates.io when the fix is released.
hickory-proto = { git = "https://github.com/hickory-dns/hickory-dns.git", rev = "ac6cc706d9641ce8440bd20e2da20d51b522555f", default-features = false, features = ["std"] }
hickory-resolver = { git = "https://github.com/hickory-dns/hickory-dns.git", rev = "ac6cc706d9641ce8440bd20e2da20d51b522555f", default-features = false, features = ["tls-ring", "https-ring", "tokio", "webpki-roots"] }
smoltcp = { version = "0.13", default-features = false, features = ["std", "async", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
thiserror = "2"
tokio = { version = "1", default-features = false }
tor-rtcompat = { version = "0.44.0", default-features = false, features = ["tokio", "rustls"] }
tun-rs = { version = "2.8", features = ["async"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }
tokio-stream = "0.1"
tracing = "0.1"
md5 = "0.8"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std"] }
url = "2"
yamux = "0.14"
# BoringSSL has no stable ABI; the Reality TLS path in ripdpi-vless
# declares six BoringSSL symbols by hand (see reality_hook.rs extern block).
# Pin boring and tokio-boring to exact versions so a transitive cargo
# update cannot silently swap in a vendored-BoringSSL revision that
# renames or removes any of those symbols. See
# docs/design/reality-boringssl-patch.md.
boring = "=5.1.0"
tokio-boring = "=5.0.0"
webpki-roots = "1.0"
io-uring = "=0.7.13"
flume = "0.12"
crossbeam-queue = "0.3"
waker-fn = "1"
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
http = "1"
base64 = "0.23"
http-body-util = "0.1"
blake2 = "0.10"
futures = "0.3"
h3-datagram = "0.0.2"
rand = "0.10"
ringbuf = { version = "0.5", features = ["alloc"] }
sha2 = "0.11"
flate2 = "1"
time = "0.3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[workspace.lints.clippy]
# Correctness & suspicious (errors)
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Style & complexity (warnings)
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

# Cherry-picked pedantic lints
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
manual_let_else = "warn"
trivially_copy_pass_by_ref = "warn"
unused_self = "warn"
default_trait_access = "warn"
explicit_into_iter_loop = "warn"
match_wildcard_for_single_variants = "warn"

# JNI/FFI allowances. These remain because (a) JNI export symbols are
# generated as `unsafe fn` by macros and the macro-injected body cannot
# carry a # Safety section, and (b) raw-pointer argument dereferences in
# JNI bridges happen inside narrowly-scoped `unsafe` blocks with SAFETY
# comments. The custom `scripts/ci/check_unsafe_boundaries.py` scan
# enforces the documentation/contract requirements that these `allow`s
# bypass at the lint level.
missing_safety_doc = "allow"
not_unsafe_ptr_arg_deref = "allow"

# Soundness-focused unsafe boundary lints. Each one catches a concrete
# class of safe-API-wrapping-unsafe pitfall identified in the soundness
# policy (see docs/rust-soundness-policy.md).
#
# - `mut_from_ref`, `transmute_ptr_to_ptr`, `useless_transmute` are the
#   pattern-level traps that drove the bufpool + fd refactors. They are
#   `deny` and currently clean across the workspace.
#
# - `undocumented_unsafe_blocks` and `multiple_unsafe_ops_per_block` are
#   the *documentation* lints. The TARGET state is `warn` (with CI's
#   `-D warnings`, that escalates them to errors); the CURRENT state is
#   `allow` while the existing unsafe corpus is being annotated. The
#   high-level safe-wrapper-of-unsafe boundary policy is enforced by
#   `scripts/ci/check_unsafe_boundaries.py` regardless of these two
#   lint levels.
undocumented_unsafe_blocks = "allow"
mut_from_ref = "deny"
transmute_ptr_to_ptr = "deny"
useless_transmute = "deny"
multiple_unsafe_ops_per_block = "allow"

# Pointer-validity hygiene (soundness epic issue #3).
#
# - `as_ptr_cast_mut` flags `value.as_ptr() as *mut T`, the silent
#   shared-to-mut downgrade that synthesizes a mutable raw pointer out
#   of a shared reference without going through `UnsafeCell` or a
#   `&mut self` borrow. Treating it as `warn` (CI's `-D warnings`
#   escalates to error) prevents new occurrences.
#
# - `ptr_as_ptr` flags `p as *const U` / `p as *mut U` pointer casts
#   that should use `.cast::<U>()` instead. The explicit `.cast` form
#   makes provenance preserving and forbids accidental conversion of
#   `*const` to `*mut`.
as_ptr_cast_mut = "warn"
ptr_as_ptr = "warn"

# Type-pun / layout-reinterpretation lints (soundness issue #23).
#
# - `cast_ptr_alignment` flags `*const U` → `*const V` (and `.cast::<V>()`)
#   pointer casts where `align_of::<V>() > align_of::<U>()`. Reading
#   through the resulting pointer would be UB on ARM64 strict-alignment
#   configurations (and silently miscompiled elsewhere). The workspace
#   currently has zero findings — the only type-pun cast in production
#   is `sockaddr_storage` → `sockaddr_in*`, where the alignment relation
#   is opposite (`align_of::<sockaddr_storage>() >= align_of::<sockaddr_in*>()`)
#   and the compile-time `assert!` block in `fd.rs` locks it. `deny` to
#   prevent any new occurrence.
#
# - `crosspointer_transmute` flags `mem::transmute<*const T, *mut U>`
#   and the inverse. Such transmutes are always expressible as a plain
#   cast and the transmute spelling defeats clippy's other transmute
#   lints. Pre-existing in the `complexity` group (warn); restated here
#   so the policy intent is explicit.
#
# - `transmute_undefined_repr` (nursery) flags `mem::transmute<T, U>`
#   where either type is missing `#[repr]` and the layout therefore
#   isn't stable across compiler versions. Issue #23 audit confirmed
#   zero findings; `warn` (escalated to error via CI's `-D warnings`)
#   locks the baseline.
cast_ptr_alignment = "deny"
crosspointer_transmute = "deny"
transmute_undefined_repr = "warn"

# Async safety + interior-mutability anti-patterns (soundness audit
# issues 37, 38, 42, 43 -- see docs/rust-soundness-policy.md
# "Async borrow safety", "RefCell runtime borrow panics", and
# "Rc<RefCell<T>> as global mutable graph").
#
# - `await_holding_lock` flags `std::sync::Mutex`/`RwLock` or
#   `parking_lot::Mutex`/`RwLock` guards held across an `.await`. The
#   sync lock blocks the runtime worker indefinitely (issue 39) and
#   can deadlock with another `.await` arm that needs the same lock.
#   Fix: drop the guard before `.await`, switch to a `tokio::sync`
#   lock, or move the awaited work outside the critical section.
#
# - `await_holding_refcell_ref` flags `Ref`/`RefMut` from `RefCell`
#   held across `.await`. A second future polled on the same task
#   then trying to borrow the cell panics; this is the canonical
#   issue 42 failure mode. Fix: scope the borrow to a non-async
#   block, or replace `RefCell` with `Cell`/`Mutex` if cross-await
#   access is genuinely required.
#
# - `rc_mutex` flags `Rc<Mutex<T>>` / `Rc<RwLock<T>>`. `Rc` is
#   single-threaded so the lock can never contend; the combination
#   is almost always a typo for `Arc<Mutex<T>>` or evidence that
#   `Rc<RefCell<T>>` would have sufficed. Either way, manual review
#   is warranted (issue 43).
#
# - `arc_with_non_send_sync` (already `suspicious` group, restated)
#   flags `Arc<T>` where `T: !Send + !Sync`, which silently turns
#   a "shared ownership" pattern into a single-threaded pointer
#   with extra atomic-refcount overhead. Often a regression after
#   adding a non-Send field deep inside `T`.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
rc_mutex = "deny"

# Allocation / layout arithmetic safety (soundness audit issue 48).
#
# `cast_possible_truncation` is intentionally NOT enabled workspace-
# wide: the SOCKS5/protocol-encoding tail has many provably-safe
# `len() as u8` casts where the protocol bounds the value to 255.
# Enabling the lint at `warn` would become `deny` under CI's
# `-D warnings` and require dozens of per-site `#[allow]` (defeats
# the lint) or a workspace-wide truncation audit (out of scope).
# The `scripts/ci/check_raw_slice_and_layout.py` scanner catches
# the higher-impact pattern -- manual `* size_of::<T>()` arithmetic
# in allocation contexts -- which is the true issue-48 vector.

# Packed-struct field reference safety (soundness audit issue 49).
#
# - `unaligned_references` is built into rustc and DENY by default
#   since Rust 1.71. Restated here so the intent appears in one
#   place with the audit cross-reference. Any `&header.packed_field`
#   on a `#[repr(packed)]` struct is a hard error.
#
# - The companion `safe_packed_borrows` lint is the historical
#   warn-by-default version covering the same pattern from a
#   different angle; we elevate it to `deny` to close any niche
#   the newer rustc lint might miss in future-edition code.

[workspace.lints.rust]
# Force every operation inside `unsafe fn` to live in its own `unsafe {}`
# block with a SAFETY comment, rather than inheriting the function-level
# unsafe context implicitly.
unsafe_op_in_unsafe_fn = "deny"

# FFI layout and ABI hygiene (soundness issue #24).
#
# - `improper_ctypes` (rustc) flags `extern "C" { fn(...) -> T; }`
#   declarations whose parameter/return types are not FFI-stable
#   (Rust enums without `#[repr]`, `bool`, `&str`, `String`, `Vec<T>`,
#   etc.). Already `warn` by default in rustc; restating here so the
#   policy intent is explicit and `-D warnings` in CI makes it a
#   hard error.
#
# - `improper_ctypes_definitions` (rustc) is the matching lint for
#   `extern "C" fn` / `extern "system" fn` definitions (i.e. functions
#   we EXPORT, not import). Four JNI bridge crates carry
#   `#[allow(improper_ctypes_definitions)]` because the `jni` crate's
#   types use lifetime parameters that rustc's CType check cannot
#   prove FFI-safe; the scanner pattern `extern fn non-FFI type`
#   provides the belt-and-suspenders check that the allowance does
#   not let a genuine FFI-unstable type slip through.
improper_ctypes = "warn"
improper_ctypes_definitions = "warn"

# Packed-struct reference safety (soundness audit issue 49).
#
# The historical `unaligned_references` lint was REMOVED from rustc
# (rust-lang/rust#82523): creating any `&packed.field` reference on
# a `#[repr(packed)]` struct is now a HARD COMPILER ERROR, not a
# lint that could be downgraded. The audit cross-reference lives in
# `docs/rust-soundness-policy.md` § "`repr(packed)` discipline" and
# in `scripts/ci/check_packed_structs.py` (which enforces the
# upstream rule that production code may not introduce
# `#[repr(packed)]` at all without an allowlist entry).

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
panic = "abort"
strip = "symbols"
codegen-units = 1

[profile.bench]
debug = false
lto = "thin"

[profile.android-jni]
inherits = "release"
lto = "fat"
opt-level = "z"
panic = "unwind"
debug = "line-tables-only"
strip = "none"

[profile.android-jni-dev]
inherits = "dev"
panic = "unwind"
opt-level = 1
debug = "line-tables-only"
# Pinned so a future tweak to [profile.dev] can't silently turn incremental
# off for the local-dev Android profile and tank rebuild speed.
incremental = true

[workspace.metadata.ripdpi]
# Crates that are test/bench/debug infrastructure only.
# They must never appear as non-dev dependencies of production crates.
test-support-crates = [
    "golden-test-support",
    "local-network-fixture",
    "native-soak-support",
    "ripdpi-bench",
]
local-debug-crates = [
    "ripdpi-cli",
]

[patch.crates-io]
boring-sys = { path = "vendor/boring-sys" }
