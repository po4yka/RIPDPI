[package]
name = "ripdpi-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# This crate is the Android cdylib/JNI facade. Feature-specific glue lives in
# sibling adapter crates; keep direct dependencies here only for exported JNI
# symbols and process-level library initialization.
android-support = { workspace = true }
jni = { workspace = true }
ripdpi-android-bridge-support = { workspace = true }
ripdpi-android-diagnostics-adapter = { workspace = true }
ripdpi-android-fetch-adapter = { workspace = true }
ripdpi-android-platform-adapter = { workspace = true }
ripdpi-android-proxy-adapter = { workspace = true }
ripdpi-android-telemetry-adapter = { workspace = true }
ripdpi-android-vpn-protect-adapter = { workspace = true }
ripdpi-strategy-config = { workspace = true }
ripdpi-strategy-lua = { workspace = true, features = ["lua-strategies"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
jni = { workspace = true, features = ["invocation"] }

[features]
loom = ["ripdpi-android-proxy-adapter/loom"]
io-uring = ["ripdpi-android-proxy-adapter/io-uring"]
