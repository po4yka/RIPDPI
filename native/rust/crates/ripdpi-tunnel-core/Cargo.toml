[package]
name = "ripdpi-tunnel-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ripdpi-tunnel-config = { workspace = true }
ripdpi-tunnel-intercept = { workspace = true }
ripdpi-flow-app-attribution = { workspace = true }
ripdpi-tun-driver = { workspace = true }
ripdpi-dns-resolver = { workspace = true }
ripdpi-collections = { workspace = true }
socket2 = { workspace = true }
ripdpi-runtime-platform = { workspace = true }
ripdpi-privileged-ops = { workspace = true }
rustls = { workspace = true }
ringbuf = { workspace = true }
smoltcp = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
tun-rs = { workspace = true }
hickory-proto = { workspace = true }
hex = { workspace = true }
lru = { workspace = true }
etherparse = { workspace = true }
ripdpi-socks5-core = { workspace = true }
ripdpi-io-uring = { workspace = true, optional = true }

[features]
io-uring = ["dep:ripdpi-io-uring"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "time"] }
tokio-test = "0.4"
proptest = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
turmoil = "0.7"
local-network-fixture = { workspace = true }
libc = { workspace = true }
tracing-subscriber = { workspace = true }

[[test]]
name = "linux_tun_soak"
path = "tests/linux_tun_e2e.rs"
