[package]
name = "ripdpi-proxy-runtime-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
constant_time_eq = { workspace = true }
libc = { workspace = true }
metrics = { workspace = true }
nix = { workspace = true }
ripdpi-failure-classifier = { workspace = true }
ripdpi-config = { workspace = true }
ripdpi-proxy-config = { workspace = true }
ripdpi-proxy-runtime-desync-adapter = { workspace = true }
ripdpi-runtime-api = { workspace = true }
ripdpi-runtime-decision-engine = { workspace = true }
ripdpi-runtime-decision-ports = { workspace = true }
ripdpi-runtime-platform = { workspace = true }
ripdpi-runtime-services = { workspace = true }
ripdpi-session = { workspace = true }
ripdpi-socks5-core = { workspace = true }
ripdpi-ws-bootstrap = { workspace = true }
socket2 = { workspace = true }
tracing = { workspace = true }

[features]
# Compile-time switch for opt-in CLI daemonization; the implementation is the
# in-repo double-fork primitive in ripdpi-runtime-platform, not an external
# crate.
daemonize = []
loom = ["ripdpi-proxy-runtime-desync-adapter/loom", "ripdpi-runtime-api/loom"]
io-uring = ["ripdpi-runtime-platform/io-uring"]
