ripdpi-packets = { workspace = true }
ripdpi-tls-profiles = { workspace = true }
ripdpi-ws-bootstrap = { workspace = true }
ripdpi-ws-tunnel = { workspace = true }
libc = { workspace = true }
md5 = { workspace = true }
socket2 = { workspace = true }
