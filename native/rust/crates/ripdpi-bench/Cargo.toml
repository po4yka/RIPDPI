# Internal benchmark crate; not shipped in APK and never published.
[package]
name = "ripdpi-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bench]]
name = "config_parse"
harness = false

[[bench]]
name = "relay_throughput"
harness = false

[[bench]]
name = "protocol_throughput"
harness = false

[[bench]]
name = "runtime_control_snapshot"
harness = false

[[bench]]
name = "relay_connect_setup"
harness = false

[[bench]]
name = "runtime_lock_contention"
harness = false

[dependencies]
# Bench crate has no library; all dependencies are dev-dependencies used by
# the benchmark harnesses.

[dev-dependencies]
criterion = { workspace = true }
local-network-fixture = { workspace = true }
quic-mtu-test-util = { workspace = true }
ripdpi-config = { workspace = true }
ripdpi-proxy-runtime = { workspace = true }
ripdpi-proxy-config = { workspace = true }
ripdpi-runtime-adaptive = { workspace = true }
ripdpi-runtime-api = { workspace = true }
ripdpi-runtime-strategy = { workspace = true }
ripdpi-ws-tunnel = { workspace = true }
# Per-transport throughput benches drive each protocol client against its
# loopback server fixture.
ripdpi-hysteria2 = { workspace = true }
ripdpi-masque = { workspace = true }
ripdpi-native-protect = { workspace = true }
ripdpi-shadowtls = { workspace = true, features = ["test-server"] }
ripdpi-tuic = { workspace = true }
ripdpi-vless = { workspace = true }
ripdpi-webtunnel = { workspace = true }
ripdpi-xhttp = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "macros", "net", "time"] }
