[package]
name = "ripdpi-vless"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
boring = { workspace = true }
tokio-boring = { workspace = true }
foreign-types-shared = "0.3.1"
futures = { workspace = true }
ripdpi-relay-mux = { workspace = true }
ripdpi-dns-resolver = { workspace = true }
ripdpi-ech-dns = { workspace = true }
ripdpi-tls-profiles = { workspace = true }
# VpnService.protect() callback registry — keeps the outbound VLESS socket out
# of the TUN route (vpnservice-protect-invariant.md). Depend on the
# zero-dependency leaf directly; runtime-platform only re-exports it.
ripdpi-native-protect = { workspace = true }
ring = { workspace = true }
aes = { workspace = true }
x25519-dalek = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
yamux = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
tracing = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
android-support.workspace = true
rcgen = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
# Miri-friendly stubs for the three BoringSSL FFI calls in
# reality_hook.rs. Build with --features miri-stubs and run under
# `cargo +nightly miri test` to validate the Rust-side glue
# (Box::into_raw + RealityHookGuard drop + extern "C" callback
# panic-trap) without linking BoringSSL.
miri-stubs = []

[lints]
workspace = true
