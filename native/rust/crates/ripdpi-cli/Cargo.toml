# Local-debug binary only; not shipped in APK and never published.
[package]
name = "ripdpi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ripdpi"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ripdpi-config = { workspace = true }
ripdpi-proxy-runtime = { workspace = true, features = ["daemonize"] }
ripdpi-runtime-api = { workspace = true }
ripdpi-telemetry = { workspace = true }
ripdpi-ws-tunnel = { workspace = true }
ripdpi-failure-classifier = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
loom = ["ripdpi-proxy-runtime/loom", "ripdpi-runtime-api/loom"]

[dev-dependencies]
aes = { workspace = true }
libc = { workspace = true }
local-network-fixture = { workspace = true }
nix = { workspace = true }
ring = { workspace = true }
ripdpi-packets = { workspace = true }
ripdpi-proxy-runtime-adapter = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
