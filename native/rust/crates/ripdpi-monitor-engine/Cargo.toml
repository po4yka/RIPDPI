[package]
name = "ripdpi-monitor-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The engine crate owns scan orchestration. Concrete probe crates are imported
# through private adapter namespaces in src/probes.rs and runner contracts in
# src/execution so callers do not depend on a broad aggregate API.
log = { workspace = true }
tracing = { workspace = true }
ripdpi-config = { workspace = true }
ripdpi-diagnostics-candidates = { workspace = true }
ripdpi-diagnostics-classification = { workspace = true }
ripdpi-diagnostics-contracts = { workspace = true }
ripdpi-diagnostics-dns = { workspace = true }
ripdpi-diagnostics-http = { workspace = true }
ripdpi-diagnostics-runner = { workspace = true }
ripdpi-diagnostics-telegram = { workspace = true }
ripdpi-diagnostics-tls = { workspace = true }
ripdpi-diagnostics-transport = { workspace = true }
ripdpi-packets = { workspace = true }
ripdpi-failure-classifier = { workspace = true }
ripdpi-proxy-config = { workspace = true }
ripdpi-runtime-platform = { workspace = true }
ripdpi-telemetry = { workspace = true }
libc = { workspace = true }
md5 = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
socket2 = { workspace = true }
tokio = { workspace = true, optional = true, features = ["net", "rt", "time"] }
loom = { workspace = true, optional = true }

[dev-dependencies]
golden-test-support = { workspace = true }
local-network-fixture = { workspace = true }
native-soak-support = { workspace = true }
rcgen = { workspace = true }

[features]
loom = ["dep:loom"]
