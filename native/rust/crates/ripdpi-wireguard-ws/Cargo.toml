[package]
name = "ripdpi-wireguard-ws"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# getrandom 0.4 is already vetted + locked in the workspace (used by
# ripdpi-warp-core's AmneziaWG junk-packet path); reuse it for junk-prefix
# randomness so this crate introduces no new RNG surface.
getrandom = "0.4"
# futures provides the Sink/Stream bounds + SinkExt/StreamExt the carrier
# drives a generic WebSocket stream through. tokio-tungstenite's WebSocketStream
# implements both, so the carrier stays transport-agnostic.
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
