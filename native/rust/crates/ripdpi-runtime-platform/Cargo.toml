[package]
name = "ripdpi-runtime-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["privileged-packets"]
privileged-packets = ["ripdpi-capabilities/privileged-packets", "dep:ripdpi-root-helper-protocol", "dep:serde_json", "ripdpi-privileged-ops/privileged-packets"]

[dependencies]
ripdpi-capabilities = { workspace = true }
ripdpi-config = { workspace = true }
ripdpi-desync = { workspace = true }
ripdpi-ipfrag = { workspace = true }
ripdpi-native-protect = { workspace = true }
ripdpi-privileged-ops = { workspace = true }
ripdpi-root-helper-protocol = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
libc = { workspace = true }
nix = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
android-support = { workspace = true }
tracing-subscriber = { workspace = true }
