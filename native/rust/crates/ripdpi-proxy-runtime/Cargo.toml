[package]
name = "ripdpi-proxy-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ripdpi-proxy-runtime-adapter = { workspace = true }
ripdpi-geo = { workspace = true }
ripdpi-runtime-api = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
loom = { workspace = true, optional = true }
ripdpi-io-uring = { workspace = true, optional = true }
constant_time_eq = { workspace = true }

[features]
daemonize = ["ripdpi-proxy-runtime-adapter/daemonize"]
loom = ["dep:loom", "ripdpi-proxy-runtime-adapter/loom"]
io-uring = ["dep:ripdpi-io-uring", "ripdpi-proxy-runtime-adapter/io-uring"]

[dev-dependencies]
aes = { workspace = true }
base64 = { workspace = true }
ctr = "0.10"
local-network-fixture = { workspace = true }
native-soak-support = { workspace = true }
proptest = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
ripdpi-packets = { workspace = true }
ripdpi-tunnel-core = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
tempfile = "3.27"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
