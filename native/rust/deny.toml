[advisories]
# Vulnerabilities are denied by default; list specific advisory IDs to ignore.
ignore = [
    # paste 1.0.15 (proc-macro, no runtime risk) -- unmaintained but pulled
    # transitively via netlink-packet-core; no updated upstream version available.
    "RUSTSEC-2024-0436",
    # daemonize -- unmaintained but no replacement available; used only in the
    # root-helper binary which is opt-in behind root_mode_enabled.
    "RUSTSEC-2025-0069",
    # rsa (Marvin timing sidechannel) enters the tree on two paths, neither of which is practically exploitable for RIPDPI:
    #   1. rsa 0.9.10 via Arti 0.43.0 -> ssh-key-fork-arti; RIPDPI uses Arti only as a Tor client backend and does not expose RSA private-key service operations.
    #   2. rsa 0.10.0-rc.18 via russh 0.61.1 (ripdpi-ssh SSH outbound engine); SSH publickey auth signs the session identifier (a transcript hash the client did not choose), not attacker-chosen plaintext, so the Marvin timing sidechannel is not practically exploitable here.
    # No safe upgrade exists on either path.
    { id = "RUSTSEC-2023-0071", reason = "rsa enters via Arti 0.43.0 -> ssh-key-fork-arti (rsa 0.9.10) and via russh 0.61.1 (rsa 0.10.0-rc.18). RIPDPI uses Arti only as a Tor client backend; the russh SSH publickey auth path signs the session identifier (not attacker-chosen plaintext), so the Marvin timing sidechannel is not practically exploitable. No safe upgrade exists on either path." },
    # bincode 2.0.1 -- unmaintained (RUSTSEC-2025-0141, flagged 2025-12-16).
    # Enters transitively via typed-index-collections -> tor-netdir (Arti 0.43.0 tor client).
    # RIPDPI does not use bincode directly; no runtime security risk (serialisation library with
    # no network-reachable code path in our usage). Migration to an alternative requires an
    # upstream Arti change. Track: https://gitlab.torproject.org/tpo/core/arti/-/issues.
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.0.1 is an unmaintained transitive dep via typed-index-collections -> tor-netdir (Arti 0.43.0). No RIPDPI code touches bincode directly; the serialisation path is internal to Arti's directory-network cache. No upstream drop-in replacement is available without an Arti upgrade." },
    # proc-macro-error2 2.0.1 -- unmaintained (RUSTSEC-2026-0173, flagged 2026-06-07).
    # Enters transitively via defmt-macros -> defmt -> smoltcp (userspace TCP/IP stack).
    # This is a proc-macro crate: it runs only at compile time and has zero runtime footprint.
    # The only risk is a supply-chain issue in the proc-macro toolchain, not a runtime
    # vulnerability. No drop-in replacement accepted by the upstream smoltcp/defmt dependency
    # chain is currently available.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 2.0.1 is a compile-time-only proc-macro crate, unmaintained but with no runtime footprint. Enters via defmt-macros -> defmt -> smoltcp. No replacement available in the smoltcp dependency chain." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Additional permissive licenses used by transitive deps
    "0BSD",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    # aws-lc-sys (used by rustls)
    "OpenSSL",
]
exceptions = [
    { allow = ["Unlicense"], crate = "async_executors@0.7.0" },
    { allow = ["CC0-1.0"], crate = "notify@8.2.0" },
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["MPL-2.0"], crate = "priority-queue@2.7.0" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
