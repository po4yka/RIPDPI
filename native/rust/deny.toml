[advisories]
# Vulnerabilities are denied by default; list specific advisory IDs to ignore.
# Every entry is mirrored by owner, expiry, rationale, and tracking metadata in
# advisory-waivers.toml; scripts/ci/check_rust_advisory_waivers.py fails closed
# when metadata is missing, stale, or expired.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is a compile-time proc-macro pulled through netlink-packet-core; it has no runtime path and no maintained compatible replacement is published." },
    { id = "RUSTSEC-2025-0069", reason = "daemonize 0.5.0 is isolated behind ripdpi-cli's daemonize feature and excluded from the Android runtime graph; no maintained compatible replacement is published." },
    { id = "RUSTSEC-2023-0071", reason = "rsa enters via Arti 0.44.0 -> ssh-key-fork-arti (rsa 0.9.10) and russh 0.62.5 (rsa 0.10.0-rc.18); RIPDPI exposes no RSA private-key service and SSH publickey auth signs the session transcript hash, not attacker-chosen plaintext. No safe upgrade exists on either path." },
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.0.1 is an unmaintained transitive serialization dependency of Arti's typed-index-collections path; RIPDPI does not call it directly and no maintained compatible replacement is published." },
]

# Known RC-crypto exposure -- tracked, documentation only (no advisory ID to ignore).
# russh =0.62.5 (the pinned release as of 2026-08) exact-pins ('==')
# release-candidate RustCrypto primitives and pulls them transitively into the shipped
# cdylib via ripdpi-ssh -> ripdpi-relay-tls-transports -> ripdpi-relay-core ->
# ripdpi-relay-android. The SSH relay is an always-on transport (ripdpi-ssh is a
# non-optional dependency), so there is no SSH-less build variant to feature-gate
# against -- this crypto ships in every release build:
#   rsa 0.10.0-rc.18, ed25519-dalek 3.0.0-rc.1, curve25519-dalek 5.0.0-rc.1,
#   p256/p384/p521 0.14.0-rc.15, pkcs1 0.8.0-rc.4, and ssh-key 0.7.0-rc.11.
# RC crypto is unstable-by-contract and matches advisory databases weakly. There is no
# downstream fix while russh exact-pins the remaining RC primitives. Action: track the
# releases named by docs/tasks/issues/unpin-russh-after-rsa-advisory-fix.md and re-pin
# once russh moves to stable rsa 0.10, ed25519-dalek 3, curve25519-dalek 5, p256/p384/p521
# 0.14, pkcs1 0.8, and ssh-key 0.7. The scheduled cargo-deny-advisories job re-scans the
# RustSec DB daily so newly published advisories surface without an unrelated code change.

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Additional permissive licenses used by transitive deps
    "0BSD",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    # aws-lc-sys (used by rustls)
    "OpenSSL",
]
exceptions = [
    { allow = ["Unlicense"], crate = "async_executors@0.7.0" },
    { allow = ["CC0-1.0"], crate = "notify@8.2.0" },
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["MPL-2.0"], crate = "priority-queue@2.7.0" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/hickory-dns/hickory-dns.git"]
