[advisories]
# Vulnerabilities are denied by default; list specific advisory IDs to ignore.
ignore = [
    # paste 1.0.15 (proc-macro, no runtime risk) -- unmaintained but pulled
    # transitively via netlink-packet-core; no updated upstream version available.
    "RUSTSEC-2024-0436",
    # daemonize -- unmaintained but no replacement available; used only in the
    # root-helper binary which is opt-in behind root_mode_enabled.
    "RUSTSEC-2025-0069",
    # rsa 0.9.10 via Arti's ssh-key-fork-arti path has no safe upgrade yet; RIPDPI uses Arti as a Tor client backend and does not expose RSA private-key service operations.
    { id = "RUSTSEC-2023-0071", reason = "Arti 0.42.0 transitively depends on rsa through ssh-key-fork-arti; no safe upgrade exists, and RIPDPI only uses Arti as a client backend." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Additional permissive licenses used by transitive deps
    "0BSD",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    # aws-lc-sys (used by rustls)
    "OpenSSL",
]
exceptions = [
    { allow = ["Unlicense"], crate = "async_executors@0.7.0" },
    { allow = ["CC0-1.0"], crate = "notify@8.2.0" },
    { allow = ["MPL-2.0"], crate = "option-ext@0.2.0" },
    { allow = ["MPL-2.0"], crate = "priority-queue@2.7.0" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
