[target.aarch64-linux-android]
# APS2 relocations reduce native size and support Android API 23 and later.
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,--build-id=sha1", "-C", "link-arg=-Wl,--exclude-libs,ALL", "-C", "link-arg=-Wl,--pack-dyn-relocs=android", "-C", "force-frame-pointers=yes"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,--build-id=sha1", "-C", "link-arg=-Wl,--exclude-libs,ALL", "-C", "force-frame-pointers=yes"]

[target.i686-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,--build-id=sha1", "-C", "link-arg=-Wl,--exclude-libs,ALL", "-C", "force-frame-pointers=yes"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,--build-id=sha1", "-C", "link-arg=-Wl,--exclude-libs,ALL", "-C", "force-frame-pointers=yes"]
