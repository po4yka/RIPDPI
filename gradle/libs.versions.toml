# --- libXray / Xray-core native packaging pins (Xray provider mode) ---------
# These are NOT Maven coordinates. The Android artifact is a gomobile-built
# `.aar` (per-ABI `.so` payloads) produced by `scripts/native/build-libxray.sh`
# and imported via the `ripdpi.prebuiltXrayAarDir` Gradle input — there is no
# published Gradle module for libXray. The version strings below are the single
# source of truth; `scripts/native/verify-libxray-artifacts.sh` fails the build
# on any drift between these pins and the produced artifact manifest.
#
# Upstream repositories:
#   libXray   https://github.com/XTLS/libXray        (Apache-2.0) — gomobile wrapper
#   xray-core https://github.com/XTLS/Xray-core      (MPL-2.0)    — transitive dep of libXray
#   gomobile  https://github.com/golang/mobile       (BSD-3-Clause) — Go bind toolchain
#   geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat (CC-BY-SA-4.0; MaxMind GeoLite2 derivative)
#   geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat (CC-BY-SA-4.0)
#
# Update policy (stable vs canary):
#   STABLE channel (default; what ships): bump `libxray` + `xray-core` only to a
#     tagged upstream release, in its own PR, with the upstream changelog linked,
#     after `scripts/native/verify-libxray-artifacts.sh` passes on freshly built
#     ABIs and the REALITY/XHTTP ground-truth tests are re-run. libXray is pinned
#     to the xray-core release it vendored — bump them together, never apart.
#   CANARY channel (opt-in, never shipped): set the `*-canary` pins to a commit
#     SHA or pre-release tag for upstream REALITY/ECH/XHTTP watch work; the build
#     script accepts `--channel canary` to use them. Canary artifacts must never
#     reach a `release`/`bundle`/`publish` Gradle task — the verify script rejects
#     a canary manifest in release-like builds.
# See docs/native/libxray-packaging.md for the full runbook.
# Verified against upstream 2026-05-30 in the gomobile container lane
# (scripts/native/libxray-build.Dockerfile): libXray uses CalVer tags mirroring
# xray-core; `xray-core` is the go.mod module version libXray v26.3.27 vendors
# (git tag v26.3.27 == module v1.260327.0). libXray v26.x requires Go >= 1.26.2.
libxray = "v26.3.27"
xray-core = "1.260327.0"
gomobile = "0.0.0-20260529142300-ecb4cd65260a"
libxray-canary = "main"
xray-core-canary = "main"

