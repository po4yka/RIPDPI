<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=700"><link rel="stylesheet" href="preview.css"><style>html,body{min-height:410px}</style></head>
<body><div class="card">
<style>
.phone { background: var(--rdp-background); border: 1px solid var(--rdp-card-border); border-radius: 28px; padding: 48px 32px; height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.brand-circle { width: 96px; height: 96px; border-radius: 9999px; background: var(--rdp-foreground); display: grid; place-items: center; }
.brand-circle .glyph { display: block; width: 58%; height: 58%; background: var(--rdp-background);
  -webkit-mask: url("../assets/icons/ic_launcher_foreground_ripdpi_clean.svg") center 38% / contain no-repeat;
          mask: url("../assets/icons/ic_launcher_foreground_ripdpi_clean.svg") center 38% / contain no-repeat; }
.wordmark { font: 400 32px/1 var(--rdp-font-brand); letter-spacing: 0.8px; margin-top: 24px; }
</style>
<div class="phone">
  <div class="brand-circle"><span class="glyph"></span></div>
  <div class="wordmark">RIPDPI</div>
</div>
<div style="font: var(--rdp-type-caption); color: var(--rdp-muted-foreground); margin-top: 10px">Splash screen · Android 12+ adaptive splash · 96dp brand circle on background color · wordmark in Geist Pixel Circle · no animation, no decoration.</div>
</div></body></html>
