<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<link rel="stylesheet" href="preview.css">
<style>html, body { min-height: 380px; }</style>
</head>
<body><div class="card">

<style>
.sh { font: var(--rdp-type-section-title); letter-spacing: 0.72px; text-transform: uppercase; color: var(--rdp-muted-foreground); padding: 12px 0 8px; }
.kard2 { background: var(--rdp-card); border:1px solid var(--rdp-card-border); border-radius:16px; }
.kard2 > .item { padding: 14px 16px; display:flex; justify-content:space-between; align-items:center; }
.kard2 > .item + .item { border-top: 0.5px solid #666; }
</style>
<div class="col" style="gap:6px">
  <div class="sh">Connection</div>
  <div class="kard2">
    <div class="item"><div class="rdp-body-emphasis">VPN with remote server</div><div class="rdp-caption" style="color: var(--rdp-muted-foreground); font-family: var(--rdp-font-mono)">relay.example</div></div>
    <div class="item"><div class="rdp-body-emphasis">Local DPI bypass</div><div class="rdp-caption" style="color: var(--rdp-muted-foreground); font-family: var(--rdp-font-mono)">tlsrec_split_host</div></div>
  </div>
  <div class="sh">Diagnostics</div>
  <div class="kard2">
    <div class="item"><div class="rdp-body-emphasis">Run scan</div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg></div>
    <div class="item"><div class="rdp-body-emphasis">History</div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 6 15 12 9 18"/></svg></div>
  </div>
</div>

</div></body></html>
