<style>
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:10px 20px; border-radius:16px; border:1px solid transparent;
  font: var(--rdp-type-button); cursor:pointer; user-select:none;
  transition: background-color var(--rdp-duration-state) var(--rdp-ease-standard),
              color var(--rdp-duration-state) var(--rdp-ease-standard),
              border-color var(--rdp-duration-quick) var(--rdp-ease-standard),
              transform var(--rdp-duration-quick) var(--rdp-ease-standard);
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--rdp-foreground); color: var(--rdp-background); }
.btn.secondary { background: var(--rdp-muted); color: var(--rdp-foreground); }
.btn.outline { background: transparent; color: var(--rdp-foreground); border-color: var(--rdp-border); }
.btn.ghost { background: transparent; color: var(--rdp-foreground); }
.btn.destructive { background: var(--rdp-destructive); color: var(--rdp-destructive-foreground); }
.btn.disabled { opacity: 0.38; pointer-events: none; }
.btn .lbl-row { display:inline-flex; align-items:center; gap:8px }

.iconbtn { width:48px; height:48px; border-radius:16px; border:1px solid transparent;
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  transition: background-color var(--rdp-duration-state) var(--rdp-ease-standard); color: var(--rdp-foreground); background: transparent;
}
.iconbtn.outline { border-color: var(--rdp-border); }
.iconbtn.tonal { background: var(--rdp-muted); }
.iconbtn.solid { background: var(--rdp-foreground); color: var(--rdp-background); }
</style>
