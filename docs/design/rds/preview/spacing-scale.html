<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<link rel="stylesheet" href="preview.css">
<style>
  html, body { min-height: 380px; }
</style>
</head>
<body>
<div class="card">

<div class="col" style="gap:10px">
  
    <div class="row" style="align-items:center; gap:16px">
      <div style="width:60px; font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">xs</div>
      <div style="width:4px; height:20px; background: var(--rdp-foreground); border-radius: 2px"></div>
      <div style="font: var(--rdp-type-mono-small)">4dp</div>
    </div>
  
    <div class="row" style="align-items:center; gap:16px">
      <div style="width:60px; font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">sm</div>
      <div style="width:8px; height:20px; background: var(--rdp-foreground); border-radius: 2px"></div>
      <div style="font: var(--rdp-type-mono-small)">8dp</div>
    </div>
  
    <div class="row" style="align-items:center; gap:16px">
      <div style="width:60px; font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">md</div>
      <div style="width:12px; height:20px; background: var(--rdp-foreground); border-radius: 2px"></div>
      <div style="font: var(--rdp-type-mono-small)">12dp</div>
    </div>
  
    <div class="row" style="align-items:center; gap:16px">
      <div style="width:60px; font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">lg</div>
      <div style="width:16px; height:20px; background: var(--rdp-foreground); border-radius: 2px"></div>
      <div style="font: var(--rdp-type-mono-small)">16dp</div>
    </div>
  
    <div class="row" style="align-items:center; gap:16px">
      <div style="width:60px; font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">xl</div>
      <div style="width:20px; height:20px; background: var(--rdp-foreground); border-radius: 2px"></div>
      <div style="font: var(--rdp-type-mono-small)">20dp</div>
    </div>
  
    <div class="row" style="align-items:center; gap:16px">
      <div style="width:60px; font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">xxl</div>
      <div style="width:24px; height:20px; background: var(--rdp-foreground); border-radius: 2px"></div>
      <div style="font: var(--rdp-type-mono-small)">24dp</div>
    </div>
  
    <div class="row" style="align-items:center; gap:16px">
      <div style="width:60px; font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">xxxl</div>
      <div style="width:32px; height:20px; background: var(--rdp-foreground); border-radius: 2px"></div>
      <div style="font: var(--rdp-type-mono-small)">32dp</div>
    </div>
  
    <div class="row" style="align-items:center; gap:16px">
      <div style="width:60px; font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">section</div>
      <div style="width:40px; height:20px; background: var(--rdp-foreground); border-radius: 2px"></div>
      <div style="font: var(--rdp-type-mono-small)">40dp</div>
    </div>
  
    <div class="row" style="align-items:center; gap:16px">
      <div style="width:60px; font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">screen</div>
      <div style="width:48px; height:20px; background: var(--rdp-foreground); border-radius: 2px"></div>
      <div style="font: var(--rdp-type-mono-small)">48dp</div>
    </div>
  
</div>
<div style="font: var(--rdp-type-caption); color: var(--rdp-muted-foreground); margin-top:10px">Closed 9-step scale. New work extends RipDpiSpacing — never inlines a raw dp value.</div>

</div>
</body>
</html>
