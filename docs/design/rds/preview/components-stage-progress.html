<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=700"><link rel="stylesheet" href="preview.css"><style>html,body{min-height:240px}</style></head>
<body><div class="card">
<style>
.sp { display: flex; flex-direction: column; gap: 4px; }
.sp .segs { display: flex; gap: 4px; height: 6px; }
.sp .segs div { flex: 1; border-radius: 2px; background: var(--rdp-outline-variant); }
.sp .segs div.pass { background: var(--rdp-success); }
.sp .segs div.fail { background: var(--rdp-destructive); }
.sp .sum { font: var(--rdp-type-caption); color: var(--rdp-muted-foreground); display: flex; gap: 12px; }
.sp .sum b { color: var(--rdp-foreground); font-weight: 500; }
.sp .sum .pass { color: var(--rdp-success); }
.sp .sum .fail { color: var(--rdp-destructive); }
</style>
<div class="col" style="gap: 16px">
  <div class="sp">
    <div class="segs"><div class="pass"></div><div class="pass"></div><div class="pass"></div><div class="fail"></div><div></div><div></div></div>
    <div class="sum"><span><span class="pass">3</span> passed</span><span><span class="fail">1</span> failed</span><span>2 pending</span></div>
  </div>
  <div class="sp">
    <div class="segs"><div class="pass"></div><div class="pass"></div><div class="pass"></div><div class="pass"></div><div class="pass"></div><div class="pass"></div></div>
    <div class="sum"><span><b class="pass">6</b> passed</span></div>
  </div>
  <div class="sp">
    <div class="segs"><div class="fail"></div><div class="fail"></div><div class="fail"></div><div class="fail"></div></div>
    <div class="sum"><span><b class="fail">4</b> failed</span></div>
  </div>
</div>
<div style="font: var(--rdp-type-caption); color: var(--rdp-muted-foreground); margin-top: 10px">StageProgressIndicator · 6dp segment bar with 4dp gaps · success/destructive/outline-variant tri-state · summary plural strings localized via strings.xml.</div>
</div></body></html>
