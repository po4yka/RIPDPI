<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=700"><link rel="stylesheet" href="preview.css"><style>html,body{min-height:360px}</style></head>
<body><div class="card">
<style>
.dlg-bg { background: rgba(0,0,0,0.4); padding: 24px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; }
.dlg { background: var(--rdp-card); border: 1px solid var(--rdp-card-border); border-radius: 28px; padding: 24px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }
.dlg .ico { width: 40px; height: 40px; border-radius: 9999px; background: var(--rdp-destructive-container); color: var(--rdp-destructive); display: grid; place-items: center; }
.dlg h3 { font: var(--rdp-type-sheet-title); margin: 0; }
.dlg p { font: var(--rdp-type-body); color: var(--rdp-muted-foreground); margin: 0; }
.dlg .actions { display: flex; gap: 8px; margin-top: 4px; justify-content: flex-end; }
.dlg .btn { min-height: 40px; padding: 8px 16px; border-radius: 12px; border: none; background: transparent; color: var(--rdp-foreground); font: var(--rdp-type-button); font-size: 14px; cursor: pointer; }
.dlg .btn:hover { background: var(--rdp-accent); }
.dlg .btn.destructive { background: var(--rdp-destructive); color: #fff; }
</style>
<div class="dlg-bg">
  <div class="dlg">
    <div class="ico">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm3 4h12v2H6zm-2 4h16v2H4z" opacity="0"/><path d="M12 2L1 21h22z M11 16h2v2h-2z M11 10h2v5h-2z"/></svg>
    </div>
    <h3>Reset cache?</h3>
    <p>All saved presets and probe history will be removed. The connection will restart on next launch.</p>
    <div class="actions">
      <button class="btn">Cancel</button>
      <button class="btn destructive">Reset</button>
    </div>
  </div>
</div>
<div style="font: var(--rdp-type-caption); color: var(--rdp-muted-foreground); margin-top: 10px">RipDpiDialog · 28dp corners · 40dp icon badge · tones: Default · Destructive · Info · width-capped at dialogMaxWidth (560 / 640 / 720 by width class).</div>
</div></body></html>
