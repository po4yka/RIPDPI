<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<link rel="stylesheet" href="preview.css">
<style>
  html, body { min-height: 280px; }
</style>
</head>
<body>
<div class="card">

<div class="col" style="gap:14px">
  <div class="meta"><span class="label">Strokes</span><span class="token">Depth comes from edges, not shadow.</span></div>
  <div class="row" style="gap:14px; flex-wrap: wrap">
    <div class="col" style="gap:6px">
      <div style="width: 220px; height: 64px; border: 1px solid var(--rdp-border); border-radius: 8px; display:grid; place-items:center; font: var(--rdp-type-mono-small)">1dp · Thin</div>
      <div class="token">RipDpiStroke.Thin · most edges</div>
    </div>
    <div class="col" style="gap:6px">
      <div style="width: 220px; height: 64px; border: 1px solid var(--rdp-card-border); border-radius: 8px; display:grid; place-items:center; font: var(--rdp-type-mono-small)">1dp · cardBorder</div>
      <div class="token">card edges</div>
    </div>
    <div class="col" style="gap:6px">
      <div style="width: 220px; height: 64px; border-top: 0.5px solid #666666; padding-top: 8px; font: var(--rdp-type-mono-small)">0.5dp · Hairline · #666</div>
      <div class="token">RipDpiStroke.Hairline · dense list rows</div>
    </div>
  </div>
</div>

</div>
</body>
</html>
