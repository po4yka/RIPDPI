<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=700"><link rel="stylesheet" href="preview.css"><style>html,body{min-height:320px}</style></head>
<body><div class="card">
<style>
.host { background: var(--rdp-card); border: 1px solid var(--rdp-card-border); border-radius: 12px; }
.row { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; padding: 14px 16px; align-items: center; cursor: pointer; }
.row + .row { border-top: 0.5px solid var(--rdp-divider); }
.row:hover:not(.add) { background: var(--rdp-muted); }
.row .radio { width: 18px; height: 18px; border: 1.5px solid var(--rdp-outline); border-radius: 9999px; display: grid; place-items: center; }
.row.sel .radio { border-color: var(--rdp-foreground); border-width: 2px; }
.row.sel .radio::after { content: ""; width: 8px; height: 8px; border-radius: 9999px; background: var(--rdp-foreground); }
.row .body { display: flex; flex-direction: column; gap: 2px; }
.row .body .name { font: var(--rdp-type-body-emphasis); }
.row .body .sub { font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground); }
.row .stat { display: inline-flex; align-items: center; gap: 6px; font: var(--rdp-type-mono-small); }
.row .stat .dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--rdp-success); }
.row .stat.off .dot { background: var(--rdp-outline); }
.row.add { color: var(--rdp-info); justify-content: flex-start; padding: 12px 16px; }
.row.add .plus { width: 18px; height: 18px; border-radius: 9999px; border: 1.5px solid var(--rdp-info); display: grid; place-items: center; color: var(--rdp-info); }
.row.add .plus svg { width: 10px; height: 10px; }
.row.add .text { font: var(--rdp-type-body-emphasis); color: var(--rdp-info); }
</style>
<div class="host">
  <div class="row sel"><span class="radio"></span><span class="body"><div class="name">Home</div><div class="sub">tlsrec_split_host · relay.example</div></span><span class="stat"><span class="dot"></span>ACTIVE</span></div>
  <div class="row"><span class="radio"></span><span class="body"><div class="name">Work</div><div class="sub">desync_fake · relay-eu.example</div></span><span class="stat off"><span class="dot"></span>OFF</span></div>
  <div class="row"><span class="radio"></span><span class="body"><div class="name">Mobile</div><div class="sub">fragment_drop · relay-us.example</div></span><span class="stat off"><span class="dot"></span>OFF</span></div>
  <div class="row add"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span><span class="text">New profile</span></div>
</div>
<div style="font: var(--rdp-type-caption); color: var(--rdp-muted-foreground); margin-top: 10px">Profile switcher · radio-style list · status pill per profile · trailing "new profile" affordance.</div>
</div></body></html>
