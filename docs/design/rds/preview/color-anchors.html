<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<link rel="stylesheet" href="preview.css">
<style>
  html, body { min-height: 280px; }
</style>
</head>
<body>
<div class="card">

<div class="dual">
<div class="pane light">
    
      <div class="swatch">
        <div class="chip" style="background:#FAFAFA; border-color: rgba(0,0,0, 0.18)"></div>
        <div class="info"><div class="nm">Background</div><div class="vl">background · #FAFAFA</div></div>
      </div>
      <div class="swatch">
        <div class="chip" style="background:#1A1A1A; border-color: rgba(0,0,0, 0.18)"></div>
        <div class="info"><div class="nm">Foreground</div><div class="vl">foreground · #1A1A1A</div></div>
      </div>
      <div class="swatch">
        <div class="chip" style="background:#FFFFFF; border-color: rgba(0,0,0, 0.18)"></div>
        <div class="info"><div class="nm">Card</div><div class="vl">card · #FFFFFF</div></div>
      </div>
  </div>
<div class="pane dark">
    
      <div class="swatch">
        <div class="chip" style="background:#121212; border-color: rgba(255,255,255, 0.18)"></div>
        <div class="info"><div class="nm">Background</div><div class="vl">background · #121212</div></div>
      </div>
      <div class="swatch">
        <div class="chip" style="background:#E8E8E8; border-color: rgba(255,255,255, 0.18)"></div>
        <div class="info"><div class="nm">Foreground</div><div class="vl">foreground · #E8E8E8</div></div>
      </div>
      <div class="swatch">
        <div class="chip" style="background:#1A1A1A; border-color: rgba(255,255,255, 0.18)"></div>
        <div class="info"><div class="nm">Card</div><div class="vl">card · #1A1A1A</div></div>
      </div>
  </div>
</div>
<div style="font: var(--rdp-type-caption); color: var(--rdp-muted-foreground); margin-top:8px">Anchor surfaces — never decorate. Dark mode is #121212 (not pure black) to avoid OLED smearing.</div>

</div>
</body>
</html>
