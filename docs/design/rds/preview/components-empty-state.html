<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=700"><link rel="stylesheet" href="preview.css"><style>html,body{min-height:320px}</style></head>
<body><div class="card">
<style>
.es { background: var(--rdp-card); border: 1px solid var(--rdp-card-border); border-radius: 16px; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.es .ico { width: 40px; height: 40px; border-radius: 9999px; background: var(--rdp-muted); color: var(--rdp-muted-foreground); display: grid; place-items: center; }
