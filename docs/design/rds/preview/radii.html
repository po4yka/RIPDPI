<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<link rel="stylesheet" href="preview.css">
<style>
  html, body { min-height: 220px; }
</style>
</head>
<body>
<div class="card">

<div class="col" style="gap:12px">
  <div class="row" style="gap:14px; flex-wrap: wrap; align-items: flex-end">
    
      <div class="col" style="gap:6px; align-items:center">
        <div style="width:60px; height:60px; background: var(--rdp-muted); border:1px solid var(--rdp-card-border); border-radius:4px"></div>
        <div style="font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">xs</div>
        <div style="font: var(--rdp-type-mono-small)">4dp</div>
      </div>
    
      <div class="col" style="gap:6px; align-items:center">
        <div style="width:60px; height:60px; background: var(--rdp-muted); border:1px solid var(--rdp-card-border); border-radius:8px"></div>
        <div style="font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">sm</div>
        <div style="font: var(--rdp-type-mono-small)">8dp</div>
      </div>
    
      <div class="col" style="gap:6px; align-items:center">
        <div style="width:60px; height:60px; background: var(--rdp-muted); border:1px solid var(--rdp-card-border); border-radius:10px"></div>
        <div style="font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">md</div>
        <div style="font: var(--rdp-type-mono-small)">10dp</div>
      </div>
    
      <div class="col" style="gap:6px; align-items:center">
        <div style="width:60px; height:60px; background: var(--rdp-muted); border:1px solid var(--rdp-card-border); border-radius:12px"></div>
        <div style="font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">lg / chip</div>
        <div style="font: var(--rdp-type-mono-small)">12dp</div>
      </div>
    
      <div class="col" style="gap:6px; align-items:center">
        <div style="width:60px; height:60px; background: var(--rdp-muted); border:1px solid var(--rdp-card-border); border-radius:16px"></div>
        <div style="font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">xl / card</div>
        <div style="font: var(--rdp-type-mono-small)">16dp</div>
      </div>
    
      <div class="col" style="gap:6px; align-items:center">
        <div style="width:60px; height:60px; background: var(--rdp-muted); border:1px solid var(--rdp-card-border); border-radius:20px"></div>
        <div style="font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">xl+</div>
        <div style="font: var(--rdp-type-mono-small)">20dp</div>
      </div>
    
      <div class="col" style="gap:6px; align-items:center">
        <div style="width:60px; height:60px; background: var(--rdp-muted); border:1px solid var(--rdp-card-border); border-radius:28px"></div>
        <div style="font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">xxl / pill</div>
        <div style="font: var(--rdp-type-mono-small)">28dp</div>
      </div>
    
      <div class="col" style="gap:6px; align-items:center">
        <div style="width:60px; height:60px; background: var(--rdp-muted); border:1px solid var(--rdp-card-border); border-radius:32px"></div>
        <div style="font: var(--rdp-type-mono-small); color: var(--rdp-muted-foreground)">xxl+</div>
        <div style="font: var(--rdp-type-mono-small)">32dp</div>
      </div>
    
      <div class="col" style="gap:6px; align-items:center">
        <div style="width:60px; height:60px; background: var(--rdp-muted); border:1px solid var(--rdp-card-border); border-radius:48px"></div>

      </div>

</div>

</html>
