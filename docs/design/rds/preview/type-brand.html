<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<link rel="stylesheet" href="preview.css">
<style>
  html, body { min-height: 240px; }
</style>
</head>
<body>
<div class="card">

<div class="col" style="gap:16px">
  <div class="row" style="align-items: center; gap: 16px">
    <div style="width:36px; height:36px; border-radius:9999px; background: var(--rdp-foreground); color: var(--rdp-background); display:flex; align-items:center; justify-content:center; font: var(--rdp-type-small-label)">R</div>
    <div style="font: var(--rdp-type-brand-mark); letter-spacing: 0.8px">RIPDPI</div>
  </div>
  <div class="token">brandMark · Geist Pixel Circle · 32/48 · letter-spacing 0.8 · brand-mark only — never body</div>
  <div class="rdp-hairline"></div>
  <div class="row" style="align-items:center; gap:8px">
    <span style="width:8px; height:8px; border-radius:9999px; background: var(--rdp-foreground)"></span>
    <span style="font: var(--rdp-type-brand-status)">RUNNING · TLSREC_SPLIT_HOST</span>
  </div>
  <div class="token">brandStatus · Geist Mono · 13/18 Medium · status pill text inside top app bar</div>
</div>

</div>
</body>
</html>
