<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<link rel="stylesheet" href="preview.css">
<style>
  html, body { min-height: 280px; }
</style>
</head>
<body>
<div class="card">

<div class="col" style="gap:16px">
  <div>
    <div style="font: var(--rdp-type-section-title); letter-spacing: 0.72px; text-transform: uppercase; color: var(--rdp-muted-foreground)">Section title</div>
    <div class="token" style="margin-top:4px">sectionTitle · 13/18 Medium · letter-spacing 0.72 · rendered uppercase</div>
  </div>
  <div class="rdp-hairline"></div>
  <div>
    <div style="font: var(--rdp-type-section-title); letter-spacing: 0.72px; text-transform: uppercase; color: var(--rdp-muted-foreground)">Connection</div>
    <div style="font: var(--rdp-type-body); margin-top:8px">VPN with remote server</div>
    <div style="font: var(--rdp-type-caption); color: var(--rdp-muted-foreground); margin-top:2px">relay.example · Connected 00:18:42</div>
  </div>
  <div>
    <div style="font: var(--rdp-type-section-title); letter-spacing: 0.72px; text-transform: uppercase; color: var(--rdp-muted-foreground)">Diagnostics</div>
    <div style="font: var(--rdp-type-body); margin-top:8px">Last scan — 4 minutes ago</div>
  </div>
</div>

</div>
</body>
</html>
