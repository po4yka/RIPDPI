<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=700">
<link rel="stylesheet" href="preview.css">
<style>
  html, body { min-height: 260px; }
</style>
</head>
<body>
<div class="card">

<div class="col" style="gap:14px">
  <div class="row" style="align-items: baseline; gap: 16px">
    <span style="font: var(--rdp-type-screen-title)">Screen title</span>
    <span class="meta"><span class="token">screenTitle · 22/28 Medium</span></span>
  </div>
  <div class="row" style="align-items: baseline; gap: 16px">
    <span style="font: var(--rdp-type-screen-title-emphasis)">Screen title (emphasis)</span>
    <span class="meta"><span class="token">screenTitleEmphasis · 22/28 Bold</span></span>
  </div>
  <div class="row" style="align-items: baseline; gap: 16px">
    <span style="font: var(--rdp-type-appbar-title)">App bar title</span>
    <span class="meta"><span class="token">appBarTitle · 20/28 Medium</span></span>
  </div>
  <div class="row" style="align-items: baseline; gap: 16px">
    <span style="font: var(--rdp-type-sheet-title)">Sheet title</span>
    <span class="meta"><span class="token">sheetTitle · 18/24 Medium</span></span>
  </div>
  <div class="row" style="align-items: baseline; gap: 16px">
    <span style="font: var(--rdp-type-intro-title)">Intro title</span>
    <span class="meta"><span class="token">introTitle · 22/30 Medium</span></span>
  </div>
</div>

</div>
</body>
</html>
