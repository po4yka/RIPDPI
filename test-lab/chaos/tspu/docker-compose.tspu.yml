# Compose overlay that adds the TSPU emulator service to the test-lab.
#
# Two profiles are exposed:
#
#   * `chaos` (default) -- runs the dry-run replayer. No kernel
#     requirements. Suitable for any host that can run the image.
#   * `chaos-live` -- runs the live-mode handler with NET_ADMIN.
#     Loads nft rules from /opt/tspu/runner/nft/ and attaches the
#     Python classifier to nfqueue 0.
#
# Dry-run invocation:
#
#     docker compose \
#       -f test-lab/docker-compose.yml \
#       -f test-lab/chaos/tspu/docker-compose.tspu.yml \
#       --profile chaos up tspu
#
# Live invocation (Linux host, requires capability):
#
#     docker compose \
#       -f test-lab/docker-compose.yml \
#       -f test-lab/chaos/tspu/docker-compose.tspu.yml \
#       --profile chaos-live up tspu-live

services:
  tspu:
    build:
      context: .
      dockerfile: Dockerfile
    image: ripdpi/tspu-emulator:v1.1
    profiles:
      - chaos
    volumes:
      - tspu-out:/var/lib/tspu-out

  tspu-live:
    image: ripdpi/tspu-emulator:v1.1
    profiles:
      - chaos-live
    cap_add:
      - NET_ADMIN
    network_mode: host
    entrypoint: ["/opt/tspu/runner/entrypoint-live.sh"]
    environment:
      MATRIX_FILE: /opt/tspu/matrix.json
      OUT_DIR: /var/lib/tspu-out
      QUEUE_NUM: "0"
    volumes:
      - tspu-out:/var/lib/tspu-out

volumes:
  tspu-out:
