services:
  coredns:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    command: -conf /Corefile
    volumes:
      - ./dns/Corefile.active:/Corefile:ro
    ports:
      - "${RIPDPI_DNS_PORT:-1053}:53/udp"
      - "${RIPDPI_DNS_PORT:-1053}:53/tcp"
    restart: unless-stopped

  httpbin:
    image: kennethreitz/httpbin@sha256:599fe5e5073102dbb0ee3dbb65f049dab44fa9fc251f6835c9990f8fb196a72b
    ports:
      - "8080:80"
    restart: unless-stopped

  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    ports:
      - "8082:8080"
    volumes:
      - ./http/wiremock/mappings:/home/wiremock/mappings:ro
      - ./http/wiremock/__files:/home/wiremock/__files:ro
    command:
      - --verbose
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./tls/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls/certs:/certs
    restart: unless-stopped

  tcp_echo:
    image: alpine/socat:1.8.1.3@sha256:e8a6e8868a8e6e01d9c2c321a8f8d4474d2d741d962462e5c5a124a8e66a0055
    command: tcp-l:9000,fork,reuseaddr exec:/bin/cat
    ports:
      - "9000:9000"
    restart: unless-stopped

  udp_echo:
    build:
      context: ./udp-echo
    ports:
      - "9001:9001/udp"
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
    ports:
      - "8474:8474"
      - "18080:18080"
      - "18443:18443"
    volumes:
      - ./chaos/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    command: -host 0.0.0.0 -config /config/toxiproxy.json
    restart: unless-stopped

  mock_relay:
    build:
      context: ./relay/mock-relay
    ports:
      - "10080:10080"
    restart: unless-stopped

  mitmproxy:
    image: mitmproxy/mitmproxy:12.3.1@sha256:2711066c855659b5af8b1dbb84494ed3eff69b42ece439c60b4fe09a2db829d4
    command: mitmweb --web-host 0.0.0.0 --listen-host 0.0.0.0 --listen-port 8088
    ports:
      - "8088:8088"
      - "8089:8081"
    profiles:
      - inspect

  quic_server:
    build:
      context: ./quic/quic-go-server
    ports:
      - "9443:9443/tcp"
      - "9443:9443/udp"
    restart: unless-stopped
