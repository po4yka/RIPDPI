appId: com.poyka.ripdpi
---
- launchApp:
    stopApp: false
- scrollUntilVisible:
    element:
      id: "home-modes-diagnostics-header"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible:
        id: "home-modes-diagnostics-collapsed"
    commands:
      - tapOn:
          id: "home-modes-diagnostics-header"
- assertVisible:
    text: "^Active$"
- tapOn:
    id: "home-mode-primary-remote-vpn"
- assertVisible:
    text: "^Inactive$"
