appId: com.poyka.ripdpi
---
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- assertVisible:
    id: "home-screen"
- scrollUntilVisible:
    element:
      id: "home-modes-diagnostics-header"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible:
        id: "home-modes-diagnostics-collapsed"
    commands:
      - tapOn:
          id: "home-modes-diagnostics-collapsed"
- assertVisible:
    id: "home-mode-primary-local-dpi-bypass"
- tapOn:
    id: "home-mode-primary-local-dpi-bypass"
- assertVisible:
    id: "home-mode-primary-local-dpi-bypass"
- tapOn:
    id: "home-mode-primary-local-dpi-bypass"
- assertVisible:
    id: "home-mode-primary-local-dpi-bypass"
- tapOn:
    id: "home-mode-primary-remote-vpn"
- tapOn:
    text: "OK|Allow"
    optional: true
- assertVisible:
    id: "home-mode-primary-remote-vpn"
- tapOn:
    id: "bottom-nav-diagnostics"
- assertVisible:
    id: "diagnostics-screen"
- tapOn:
    id: "diagnostics-section-scan"
- tapOn:
    id: "diagnostics-scan-run-in-path"
- assertVisible:
    id: "diagnostics-scan-progress-card"
