appId: com.poyka.ripdpi
---
- scrollUntilVisible:
    element:
      id: "home-modes-diagnostics-header"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible:
        id: "home-modes-diagnostics-collapsed"
    commands:
      - tapOn:
          id: "home-modes-diagnostics-header"
- assertVisible:
    id: "home-mode-primary-local-dpi-bypass"
- assertVisible:
    text: "Connected .*"
- tapOn:
    id: "home-mode-primary-local-dpi-bypass"
- assertNotVisible:
    text: "Connected .*"
