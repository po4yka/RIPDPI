# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:SoftRefLRUPolicyMSPerMB=50 -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.welcome=never
org.gradle.warning.mode=summary
# Kotlin daemon: KSP2 needs more headroom than the 1.5g default.
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseG1GC -Dfile.encoding=UTF-8
kotlin.incremental=true
# Pin KSP2 (KSP 2.3.x defaults to KSP2; explicit so a downgrade can't silently regress).
ksp.useKSP2=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Generates non-final resource IDs in library R classes; lets R8 propagate
# constants through resource references and lets AGP skip a few work items.
# Application module behavior unchanged.
android.nonFinalResIds=true
# Convention plugin SDK versions
# compileSdk=37 (Android 17) is required for the ProfilingManager OOM/Anomaly
# triggers (ProfilingTrigger.TRIGGER_TYPE_OOM / TRIGGER_TYPE_ANOMALY, API 37).
# targetSdk stays 35: bumping runtime-behavior target is a separate, tested change.
ripdpi.compileSdk=37
# Android CLI 1.0 uses the 37.0 package suffix for compileSdk 37.
ripdpi.compileSdkPackage=37.0
ripdpi.minSdk=27
ripdpi.targetSdk=35
# r29 is the current stable NDK (non-LTS). r30 is still beta as of 2026-06;
# adopt it (the next LTS) once it reaches the stable channel.
ripdpi.nativeNdkVersion=29.0.14206865
ripdpi.nativeCmakeVersion=3.31.6
ripdpi.nativeCargoProfile=android-jni
ripdpi.localNativeCargoProfileDefault=android-jni-dev
ripdpi.nativeAbis=armeabi-v7a,arm64-v8a,x86,x86_64
# Local debug default: "host" -> derive from os.arch (aarch64->arm64-v8a, x86_64->x86_64).
# Override with `ripdpi.localNativeAbis=...` in ~/.gradle/gradle.properties to pin.
# CI / release-like builds always use the full ripdpi.nativeAbis set.
ripdpi.localNativeAbisDefault=host
ripdpi.nativeUseLegacyPackaging=false
ripdpi.r8Diagnostics=false
org.gradle.vfs.watch=true
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
